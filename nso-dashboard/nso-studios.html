<style>
/* Summary-specific styles */
.summary-studio-select{margin-bottom:20px}
.summary-studio-select select{font-family:'Oswald',sans-serif;font-size:14px;padding:8px 16px;border-radius:8px;font-style:italic;text-transform:uppercase;letter-spacing:.5px}
.timeline-bar{position:relative;height:28px;background:#f0f6fa;border-radius:14px;overflow:visible;margin-bottom:8px}
.timeline-fill{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--c-leads),var(--c-ft));transition:width .6s ease;position:relative;min-width:8px}
.timeline-marker{position:absolute;top:-6px;width:2px;height:40px;background:#1a1a2e;opacity:.3}
.timeline-marker-label{position:absolute;top:46px;font-size:10px;color:#5a7a8a;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.timeline-marker.co{background:#f4a021;opacity:.9;width:2px}
.timeline-marker.co .timeline-marker-label{color:#f4a021;font-weight:700}
.timeline-marker.go .timeline-marker-label{color:#e05a5a;font-weight:700}
.timeline-marker.tier2{background:#27ae60;opacity:.9;width:2px}
.timeline-marker.tier2 .timeline-marker-label{color:#27ae60;font-weight:700}
.timeline-marker.tier3{background:#8e44ad;opacity:.9;width:2px}
.timeline-marker.tier3 .timeline-marker-label{color:#8e44ad;font-weight:700}
.timeline-current{position:absolute;top:-2px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--c-ft);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:2}
.timeline-weeks{display:flex;justify-content:space-between;font-size:9px;color:#8aaabb;margin-top:4px}
.summary-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.summary-card{padding:18px 20px}
.summary-card-section{font-family:'Oswald',sans-serif;font-style:italic;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:#5a7a8a;margin-bottom:14px}
.sk-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sk-label{font-size:11px;color:#5a7a8a;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sk-vals{text-align:right}
.sk-actual{font-size:22px;font-weight:700;color:#1a1a2e;line-height:1}
.sk-goal{font-size:11px;color:#8aaabb;margin-top:2px}
.sk-check{color:#0a8a4a;font-weight:700;margin-left:4px}
.sk-miss{color:#d32f2f;font-weight:700;margin-left:4px}
.sk-progress{height:14px;background:#f0f6fa;border-radius:7px;margin-top:5px;overflow:visible;position:relative;margin-bottom:16px}
.sk-progress-fill{height:100%;border-radius:7px;transition:width .6s ease}
.open-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center}
.open-days{font-family:'Oswald',sans-serif;font-size:48px;font-weight:700;color:var(--c-leads);line-height:1}
.open-label{font-family:'Oswald',sans-serif;font-style:italic;font-size:14px;font-weight:600;text-transform:uppercase;color:#e05a5a;letter-spacing:1px;margin-bottom:4px}
.open-date{font-size:11px;color:#5a7a8a}
@media(max-width:768px){.summary-kpis{grid-template-columns:1fr}}
.sc-table td:first-child,.sc-table th:first-child{position:sticky;left:0;background:#fff;z-index:1;border-right:1.5px solid #dde8ef}
.sc-table thead th:first-child{background:#f4f9fd}
.sc-cell-good{background:#e8faf0!important;color:#0a8a4a}
.sc-cell-warn{background:#fff8e1!important;color:#b8860b}
.sc-cell-bad{background:#ffeaea!important;color:#c0392b}
.sc-cell-cur{background:#e8f4fd!important}
/* Social posts table (Instagram / Facebook) */
.soc-table{width:100%;border-collapse:collapse;table-layout:fixed}
.soc-row{display:grid;gap:10px;padding:9px 12px;border-bottom:1px solid #edf3f7;align-items:center}
.soc-row:last-child{border-bottom:none}
.soc-row:not(.soc-th):hover{background:#f9fbfd}
.soc-row.soc-th{background:#f4f9fd;border-bottom:2px solid #dde8ef}
.soc-row.soc-ig{grid-template-columns:70px 68px 1fr 62px 50px 72px 58px 60px 58px 52px}
.soc-row.soc-fb{grid-template-columns:70px 68px 1fr 65px 65px}
.soc-cell{font-size:12.5px;color:#5a7a8a;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soc-cell:first-child,.soc-cell.soc-left{text-align:left;color:#1a4d6e}
.soc-row.soc-th .soc-cell:nth-child(3){text-align:left}
.soc-th .soc-cell{font-size:10px;font-weight:700;color:#8aaabb;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;font-family:'Oswald',sans-serif}
.soc-th .soc-cell:hover,.soc-th .soc-cell.sorted{color:var(--c-leads)}
.soc-cell.sc{color:var(--c-leads);font-weight:600}
.soc-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid #dde8ef;display:block}
.soc-thumb-ph{width:60px;height:60px;border-radius:8px;background:#f0f6fa;border:1px solid #dde8ef;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#8aaabb}
.soc-caption{font-size:12px;color:#1a4d6e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;text-align:left}
.soc-caption a{color:#1a4d6e;text-decoration:none}.soc-caption a:hover{color:var(--c-leads);text-decoration:underline}
.soc-date{font-size:11px;color:#8aaabb;font-weight:600}
.soc-studio-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.04em;margin-top:3px}
@media(max-width:640px){.soc-row.soc-ig{grid-template-columns:56px 56px 1fr 48px 48px}.soc-row.soc-ig .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-fb{grid-template-columns:56px 56px 1fr}.soc-row.soc-fb .soc-cell:nth-child(n+4){display:none}}
#leadsRingLeg,#newsalesRingLeg,#cancRingLeg{display:flex!important;flex-direction:column;gap:10px;font-size:13px;line-height:1.4;width:auto}
#leadsRingLeg .ring-legend-item,#newsalesRingLeg .ring-legend-item,#cancRingLeg .ring-legend-item{display:flex!important;align-items:center;gap:0;width:auto}
#leadsRingLeg .ring-legend-dot,#newsalesRingLeg .ring-legend-dot,#cancRingLeg .ring-legend-dot{width:12px!important;height:12px!important;border-radius:3px;flex-shrink:0;margin-right:12px}
#leadsRingLeg .ring-legend-label,#newsalesRingLeg .ring-legend-label,#cancRingLeg .ring-legend-label{white-space:nowrap;color:#1a1a2e;margin-right:16px;flex:0 0 auto}
#leadsRingLeg .ring-legend-vol,#newsalesRingLeg .ring-legend-vol,#cancRingLeg .ring-legend-vol{white-space:nowrap;text-align:right;color:#5a7a8a;margin-right:10px;flex:0 0 auto}
#leadsRingLeg .ring-legend-pct,#newsalesRingLeg .ring-legend-pct,#cancRingLeg .ring-legend-pct{white-space:nowrap;text-align:right;font-weight:700;color:#1a1a2e;flex:0 0 auto}
/* ── DEFINITIONS TAB ─────────────────────────────────────────────────────── */
.defs-intro{margin-bottom:20px}
.defs-section{margin-bottom:28px}
.defs-section-title{font-family:'Oswald',sans-serif;font-size:13px;font-style:italic;text-transform:uppercase;letter-spacing:.07em;color:#0084B5;border-bottom:2px solid #D2EFFF;padding-bottom:7px;margin-bottom:14px}
.defs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.defs-card{background:#fff;border-radius:8px;padding:14px 16px;border-left:3px solid #00A3E0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.defs-card-title{font-family:'Oswald',sans-serif;font-size:13px;font-style:italic;text-transform:uppercase;letter-spacing:.04em;color:#1a1a2e;margin-bottom:6px}
.defs-card-desc{font-size:13px;color:#4a5a6a;line-height:1.6}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   NSO STUDIOS DASHBOARD — Self-contained
   ══════════════════════════════════════════════════════════════════════════ */
const NSO=['SWEAT440 Aventura','SWEAT440 Burlington','SWEAT440 Dallas - Uptown','SWEAT440 Dunwoody','SWEAT440 Fort Myers','SWEAT440 Herriman','SWEAT440 Middletown','SWEAT440 Naples - Mercato','SWEAT440 North Miami','SWEAT440 Old Bridge','SWEAT440 Orlando - Dr Phillips','SWEAT440 Reston'];
const EXCL_SRC=['ClassPass / Platforms'];

let RAW=null,SC=null,GRAN='daily',trendChart=null,NSO_SALES=null,NSO_SALES_ROWS=[],GBP_RAW=null,AD_META={},CH_RAW=null;const _ch={};let _chDupOnly=false;
let CUR_USER=null,_allowedStudios=null;const isAdminUser=()=>CUR_USER&&CUR_USER.role==='admin';
let _sumView='cum',_sumStudio=null,_scStudio=null,_dataThruLabel='',_sumD7End=null;
const TODAY=new Date(),fom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),lpm=new Date(fom.getTime()-864e5),fpm=new Date(lpm.getFullYear(),lpm.getMonth(),1);
function lds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TWO_DAYS_AGO=new Date(TODAY.getTime()-2*864e5);
document.getElementById('fFrom').value=lds(fom);document.getElementById('fTo').value=lds(TWO_DAYS_AGO);

function toggleNav(){document.getElementById('navTabs').classList.toggle('open')}
function toggleControls(){const e=document.getElementById('ctrlInner');e.classList.toggle('open');document.getElementById('ctrlToggle').textContent=e.classList.contains('open')?'Filters ▴':'Filters ▾'}
function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn&&btn.closest('.nav-submenu')){
    document.querySelectorAll('.nav-submenu').forEach(g=>g.classList.remove('open'));
    document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
    btn.closest('.nav-submenu').classList.add('open');
    btn.closest('.nav-group').querySelector('.nav-group-label').classList.add('group-open');
  }
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('navTabs').classList.remove('open');
  document.querySelector('.controls-bar').style.display=(id==='summary'||id==='scorecard')?'none':'';
  if(id==='summary'){if(_scStudio)_sumStudio=_scStudio;renderSummary();}
  else if(id==='scorecard'){if(_sumStudio)_scStudio=_sumStudio;renderScorecard();}
  else if(id==='gbp')renderGBP();
  else if(id==='ga4')renderGA4();
  else if(id==='clienthistory')renderClientHistory();
  else if(id==='meta')renderMeta();
  else if(id==='google')renderGoogle();
  else if(id==='instagram')renderInstagram();
  else if(id==='funnel'){renderFunnel();applyFilters();}
  else applyFilters();
}

function _syncA(mid){const m=document.getElementById(mid);const all=[...m.querySelectorAll('input[value]')];const ac=document.getElementById(mid+'_all');const n=all.filter(c=>c.checked).length;ac.checked=n===all.length;ac.indeterminate=n>0&&n<all.length}

/* Data helpers */
function grd(r){return new Date((r.date||r.month)+'T00:00:00Z')}
function fR(arr,f,t,st,sr){return arr.filter(r=>{const d=grd(r);if(f&&d<f)return false;if(t&&d>t)return false;if(st&&!st.includes(r.studio))return false;if(sr&&!sr.includes(r.source))return false;return true})}
function sR(rows){return rows.reduce((a,r)=>{a.leads+=r.signups||0;a.ft+=r.first_visits||0;a.mem+=r.first_sales||0;return a},{leads:0,ft:0,mem:0})}
function cW(f,t){const ms=t-f;const pp2=new Date(f.getTime()-864e5);const pp1=new Date(pp2.getTime()-ms);const py1=new Date(f);py1.setFullYear(py1.getFullYear()-1);const py2=new Date(t);py2.setFullYear(py2.getFullYear()-1);return{ppFrom:pp1,ppTo:pp2,pyFrom:py1,pyTo:py2}}
function cD(c,p){return p?(c-p)/p*100:null}
function fmD(d){return d.toLocaleString('en-US',{month:'short',year:'numeric'})}
function fmDay(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}
function fmMo(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'})}
function _wkLabel(dateStr){
  if(!SC||!SC.studios)return'';
  const sel=_getSel('studioMenu');
  const studios=sel.length?SC.studios.filter(s=>sel.includes(s.full_name)):SC.studios;
  // Prefer a single-selected studio; fall back to the funnel/summary focused studio
  const studio=studios.length===1?studios[0]:(_sumStudio||null);
  if(!studio)return'';
  for(const wk of(studio.weeks||[])){
    if(wk.date_start&&wk.date_end&&dateStr>=wk.date_start&&dateStr<=wk.date_end)
      return wk.week.replace('Week ','W').replace('WEEK ','W');
  }
  return'';
}
function toTS(d,m){const map={};if(GRAN==='daily'){d.forEach(r=>{if(!map[r.date])map[r.date]={key:r.date,label:fmDay(r.date),signups:0,first_visits:0,first_sales:0};map[r.date].signups+=r.signups||0;map[r.date].first_visits+=r.first_visits||0;map[r.date].first_sales+=r.first_sales||0})}else if(GRAN==='weekly'){[...d,...m].forEach(r=>{const dt=new Date((r.date||r.month)+'T00:00:00Z');const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dt.getUTCDay());const k=ws.toISOString().slice(0,10);if(!map[k])map[k]={key:k,label:fmDay(k),signups:0,first_visits:0,first_sales:0};map[k].signups+=r.signups||0;map[k].first_visits+=r.first_visits||0;map[k].first_sales+=r.first_sales||0})}else{[...d,...m].forEach(r=>{const k=(r.date||r.month).slice(0,7)+'-01';if(!map[k])map[k]={key:k,label:fmMo(k),signups:0,first_visits:0,first_sales:0};map[k].signups+=r.signups||0;map[k].first_visits+=r.first_visits||0;map[k].first_sales+=r.first_sales||0})}return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
function toSrcTS(d,m){const map={};d.forEach(r=>{const mk=r.date+'|'+r.source;if(!map[mk])map[mk]={key:r.date,source:r.source,signups:0,first_visits:0,first_sales:0};map[mk].signups+=r.signups||0;map[mk].first_visits+=r.first_visits||0;map[mk].first_sales+=r.first_sales||0});return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
function toSrcTSGran(d,m){const map={};const rows=GRAN==='monthly'?[...d,...m]:d;rows.forEach(r=>{const raw=r.date||r.month;let k;if(GRAN==='weekly'){const dt=new Date(raw+'T00:00:00Z');const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dt.getUTCDay());k=ws.toISOString().slice(0,10)}else if(GRAN==='monthly'){k=raw.slice(0,7)+'-01'}else{k=r.date}const mk=k+'|'+r.source;if(!map[mk])map[mk]={key:k,source:r.source,signups:0,first_visits:0,first_sales:0};map[mk].signups+=r.signups||0;map[mk].first_visits+=r.first_visits||0;map[mk].first_sales+=r.first_sales||0});return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
// Buckets arbitrary daily rows into the current GRAN's period key, matching toTS's key scheme exactly —
// used to build the Funnel Over Time "Sales" line from whichever dataset backs the Total Sales KPI card,
// so the chart's total always equals the card (see applyFilters).
function _periodKey(dateStr){if(GRAN==='daily')return dateStr;if(GRAN==='weekly'){const dt=new Date(dateStr+'T00:00:00Z');const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dt.getUTCDay());return ws.toISOString().slice(0,10)}return dateStr.slice(0,7)+'-01'}
function _bucketByPeriod(rows,valueFn){const map={};rows.forEach(r=>{const raw=r.date||r.month;if(!raw)return;const k=_periodKey(raw);map[k]=(map[k]||0)+valueFn(r)});return map}
function _esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function kpiCard(l,v,pp,py,fmt,info){const dpp=cD(v,pp),dpy=cD(v,py);const ppH=dpp!=null?`<div class="kpi-card-delta ${dpp>=0?'pos':'neg'}">${dpp>=0?'▲':'▼'} ${Math.abs(dpp).toFixed(1)}% prev period</div>`:'';const pyH=dpy!=null?`<div class="kpi-card-delta ${dpy>=0?'pos':'neg'}">${dpy>=0?'▲':'▼'} ${Math.abs(dpy).toFixed(1)}% prev year</div>`:'';const fmtd=fmt?fmt(v):v.toLocaleString('en-US');const infoBtn=info?`<button class="kpi-info-btn" onclick="showKpiInfo(this,event)" data-title="${_esc(info.title||l)}" data-desc="${_esc(info.desc)}" data-date="${_esc(info.date||'')}">i</button>`:'';return`<div class="kpi-card">${infoBtn}<div class="kpi-card-label">${l}</div><div class="kpi-card-val">${fmtd}</div>${ppH}${pyH}</div>`}

function skRow(label,actual,goal,color,noCheck,infoKey,goalLabel){
  const numActual=typeof actual==='string'?actual:actual.toLocaleString('en-US');
  const numGoal=goal!=null?(typeof goal==='string'?goal:goal.toLocaleString('en-US')):null;
  const met=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual>=goal;
  const miss=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual<goal;
  const infoHtml=infoKey&&GLOSSARY[infoKey]?_infoBtnInline(infoKey):'';
  let h=`<div class="sk-row"><div><div class="sk-label">${label}${infoHtml}</div></div><div class="sk-vals"><div class="sk-actual">${numActual}`;
  if(met)h+=`<span class="sk-check">✓</span>`;
  h+=`</div>`;
  if(numGoal!=null)h+=`<div class="sk-goal">${goalLabel||'Goal'}: ${numGoal}</div>`;
  h+=`</div></div>`;
  if(typeof actual==='number'&&typeof goal==='number'&&goal>0){
    const ratio=actual/goal;
    if(ratio>1){
      const goalLinePct=Math.round(goal/actual*100);
      const goalFmt=goal.toLocaleString('en-US');
      h+=`<div class="sk-progress">`;
      h+=`<div class="sk-progress-fill" style="width:100%;background:${color}"></div>`;
      h+=`<div style="position:absolute;top:-4px;left:${goalLinePct}%;width:2px;height:22px;background:#f4a021;border-radius:1px;transform:translateX(-50%);z-index:2">`;
      h+=`<div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:8px;color:#f4a021;font-weight:700;white-space:nowrap;margin-top:3px">Goal: ${goalFmt}</div>`;
      h+=`</div>`;
      h+=`</div>`;
    } else {
      const basePct=Math.round(ratio*100);
      h+=`<div class="sk-progress"><div class="sk-progress-fill" style="width:${basePct}%;background:${color}"></div></div>`;
    }
  }
  return h;
}

function drawSumSourceChart(studio,metric){
  const ctx=document.getElementById('sumSrcCanvas');if(!ctx)return;
  if(_ch.sumSrc){_ch.sumSrc.destroy();_ch.sumSrc=null}
  const _d7baseD=_sumD7End?new Date(_sumD7End+'T12:00:00Z'):(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-2,12);})();
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date(_d7baseD.getTime()-i*864e5);days.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);}
  const _stripS=s=>(s||'').replace(/^SWEAT440\s+/,'');
  const _snameS=studio.data_name||studio.name;
  let rows,netFn;
  if(metric==='leads'){
    rows=(RAW?.daily_detail||[]).filter(r=>_stripS(r.studio)===_snameS&&days.includes(r.date));
    netFn=r=>r.signups||0;
  }else{
    rows=NSO_SALES_ROWS.filter(r=>_stripS(r.studio)===_snameS&&days.includes(r.date));
    netFn=r=>(r.first_sales||0)-(r.cancellations||0);
  }
  const srcTotals={};
  rows.forEach(r=>{const s=r.source||'Unknown';srcTotals[s]=(srcTotals[s]||0)+netFn(r);});
  // For sales: scale positive sources so ring total = aggregate net (matches the bar)
  let _ringNet=null;
  if(metric!=='leads'){
    _ringNet=Math.max(0,Object.values(srcTotals).reduce((s,v)=>s+v,0));
    const _pos=Object.values(srcTotals).reduce((s,v)=>s+Math.max(0,v),0);
    const _sc=_pos>0?_ringNet/_pos:1;
    Object.keys(srcTotals).forEach(s=>{srcTotals[s]=Math.max(0,Math.round(srcTotals[s]*_sc));});
  }else{
    Object.keys(srcTotals).forEach(s=>{srcTotals[s]=Math.max(0,srcTotals[s]);});
  }
  const sources=Object.keys(srcTotals).filter(s=>srcTotals[s]>0).sort((a,b)=>srcTotals[b]-srcTotals[a]);
  const leg=document.getElementById('sumSrcLegend');
  if(!sources.length){
    if(leg)leg.innerHTML=`<div style="color:#8aaabb;font-size:12px;font-style:italic">No data for the last 7 days</div>`;
    return;
  }
  const values=sources.map(s=>srcTotals[s]);
  const colors=sources.map((s,i)=>srcColor(s,i));
  const total=_ringNet!==null?_ringNet:values.reduce((a,b)=>a+b,0);
  _ch.sumSrc=new Chart(ctx,{
    type:'doughnut',
    data:{labels:sources,datasets:[{data:values,backgroundColor:colors,borderColor:'#fff',borderWidth:2,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed.toLocaleString('en-US')} (${(c.parsed/total*100).toFixed(1)}%)`}}},
      cutout:'62%'}
  });
  if(leg)leg.innerHTML=sources.map((src,i)=>{
    const pct=total?(values[i]/total*100).toFixed(1):0;
    return`<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
      <div style="width:10px;height:10px;border-radius:50%;background:${colors[i]};flex-shrink:0"></div>
      <div style="font-size:11px;color:#5a7a8a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${src}</div>
      <div style="font-size:11px;font-weight:700;color:#1a1a2e;margin-left:4px">${values[i].toLocaleString('en-US')}</div>
      <div style="font-size:10px;color:#8aaabb;min-width:34px;text-align:right">${pct}%</div>
    </div>`;
  }).join('');
}

function renderFunnel(){
  const el=document.getElementById('funnelAllStudios');

  // Studio switcher

    const active=s.code===activeCode;
    h+=`<button onclick="_sumStudio=SC.studios.find(x=>x.code==='${s.code}');renderFunnel()" style="font-family:Oswald,sans-serif;font-style:italic;font-size:13px;font-weight:600;text-transform:uppercase;padding:6px 16px;border-radius:4px;border:2px solid ${active?'#00A3E0':'#2a4a5a'};background:${active?'#00A3E0':'transparent'};color:${active?'#fff':'#8aaabb'};cursor:pointer;letter-spacing:.5px">${s.name}</button>`;
  });

  const studio=_sumStudio||SC.studios[0];
  const weeks=studio.weeks||[];
  const cw=studio.current_week||0;
  const tgt=studio.targets||{};
  const curWk=weeks.find(w=>(parseInt(String(w.week).replace(/[^0-9]/g,''))||0)===cw)||{};

  const cumLeads = curWk.total_leads||0;
  const cumSales = curWk.presales_count||0;      // gross sales
  const cumCanc  = curWk.cancellations_count||0;
  const _fTierMap={};(studio.tier_rmr_by_week||[]).forEach(r=>{_fTierMap[r.week]=r;});
  const _fCurTier=_fTierMap[cw];
  const netActive=_fCurTier?(_fCurTier.t0||0)+(_fCurTier.t1||0)+(_fCurTier.t2||0)+(_fCurTier.t3||0):Math.max(0,cumSales-cumCanc);

  const tLeads=tgt.total_leads;
  const tPres=tgt.presales_count;
  const leadsPct=tLeads&&cumLeads?Math.min(100,Math.round(cumLeads/tLeads*100)):null;
  const salesPct=tPres&&netActive?Math.min(100,Math.round(netActive/tPres*100)):null;

  const totalWeeks=studio.go_week||(weeks.length-1);
  const isPreLaunch=cw===0;
  const weekLabel=isPreLaunch?'Pre-Launch':`Week ${cw}`;
  const ds=curWk.date_start,de=curWk.date_end;
  const fmtD=iso=>{if(!iso)return'';const d=new Date(iso+'T00:00:00Z');return`${d.getUTCMonth()+1}/${d.getUTCDate()}`;};
  const drFmt=ds&&de?`${fmtD(ds)} – ${fmtD(de)}`:curWk.date_range||'';

  // Funnel bar widths — all relative to cumLeads so bars taper naturally
  const salesW = cumLeads>0 ? Math.max(3, Math.min(100, Math.round(cumSales/cumLeads*100))) : (cumSales>0?100:0);
  const cancW  = cumLeads>0 ? Math.max(0, Math.min(salesW, Math.round(cumCanc/cumLeads*100))) : 0;

  h+=`<span style="font-size:10px;color:#5a7a8a">of ${totalWeeks}</span>`;
  if(drFmt)h+=`<span style="font-size:10px;color:#5a7a8a">${drFmt}</span>`;
  h+=`</div>`;

  // Funnel rows: Leads → New Sales → Cancellations
  h+=fRow('Leads (New Accounts Created)', cumLeads, tLeads, 100, '#00A3E0', leadsPct, null);
  h+=fRow('New Sales', cumSales, tPres, salesW, '#00FFC2', salesPct, null);
  h+=fRow('Cancellations', cumCanc, null, cancW, '#ff6b6b', null, cumSales>0?`${(cumCanc/cumSales*100).toFixed(1)}% of sales`:null);

  // Net sales footer
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #1a3040;margin-top:4px">`;
  h+=`<span style="font-size:11px;font-family:Oswald,sans-serif;font-style:italic;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#8aaabb">Net Sales</span>`;
  h+=`<span style="font-size:20px;font-weight:700;color:${progCol(salesPct||0)}">${fmt(netActive)}${tPres?`<span style="font-size:11px;color:#5a7a8a"> / ${fmt(tPres)}</span>`:''}</span>`;
  h+=`</div>`;

  h+=`</div>`;
  el.innerHTML=h;
}

/* Parse "M/D - M/D" or "Label M/D - M/D" date strings → {start,end} YYYY-MM-DD */
function _parseWkDates(s){
  const m=[...s.matchAll(/(\d{1,2})\/(\d{1,2})/g)];
  if(m.length<2)return null;
  const fmt=(mo,dy)=>`2026-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
  // Use last two matches so label-embedded dates (e.g. "Move to $129 on 3/3 3/2 - 3/8") don't shift the range
  const s0=m[m.length-2],s1=m[m.length-1];
  return{start:fmt(s0[1],s0[2]),end:fmt(s1[1],s1[2])};
}

/* Aggregate data.json rows for a studio within a date range */
function _wkData(studioFull,dateStart,dateEnd){
  if(!RAW||!dateStart)return null;
  const rows=(RAW.daily_detail||[]).filter(r=>
    r.studio===studioFull && r.date>=dateStart && r.date<=dateEnd);
  if(!rows.length)return null;
  const nl=rows.reduce((a,r)=>a+(r.signups||0),0);
  const np=rows.reduce((a,r)=>a+(r.first_sales||0),0);
  const gl=rows.filter(r=>r.source==='Grassroots').reduce((a,r)=>a+(r.signups||0),0);
  return{nl,np,cr:nl>0?np/nl:null,gl};
}

function scKpi(label,val,target,fmt,targetLabel,auto){
  const fv=val!=null?fmt(val):'—';
  const pct=target&&val!=null?Math.min(100,Math.round(val/target*100)):null;
  const tl=targetLabel||(target!=null?fmt(target):null);
  const bar=pct!=null?`<div style="height:4px;background:#f0f6fa;border-radius:2px;margin-top:8px"><div style="height:100%;width:${pct}%;background:${pct>=100?'#0a8a4a':pct>=70?'#f4a021':'#e05a5a'};border-radius:2px"></div></div>`:'';
  const badge=auto?`<span style="font-size:9px;background:#e8f4fd;color:#0077bb;border-radius:3px;padding:1px 5px;margin-left:4px;font-family:Oswald,sans-serif;letter-spacing:.03em">AUTO</span>`:'';
  return`<div class="kpi-card"><div class="kpi-card-label">${label}${badge}</div><div class="kpi-card-val">${fv}</div>${tl?`<div style="font-size:11px;color:#8aaabb;margin-top:2px">Target: ${tl}</div>`:''} ${bar}</div>`;
}

  const tgt=sc.targets||{};

  let _cMs=0,_cGs=0,_cGrs=0,_cOth=0,_cLtf=0,_cTs=0,_cDs=0,_cIg=0,_cNl=0,_cDl=0,_cDp=0,_cDCanc=0,_cGl=0,_cGp=0,_cEv=0;

    const crRaw=w.conversion_rate;
    _cMs+=w.meta_spend||0;_cGs+=w.google_spend||0;_cGrs+=w.grassroots_spend||0;_cOth+=w.other_spend||0;
    _cLtf+=w.leadteam_fee||0;_cTs+=w.total_marketing_spend||0;_cDs+=(w.meta_spend||0)+(w.google_spend||0);_cIg+=w.ig_new_followers||0;_cNl+=w.new_leads||0;
    _cDl+=w.digital_leads_week||0;_cDp+=w.digital_presales_week||0;_cDCanc+=w.digital_cancellations_week||0;_cGl+=w.grassroots_leads||0;_cGp+=w.grassroots_presales||0;_cEv+=w.comm_events||0;
    return{
      w:wn, date:w.date_range||'', isCur:wn===cw,
      ds:w.date_start||null, de:w.date_end||null,
      nl, np,
      cr:crRaw!=null?crRaw/100:(nl>0&&np!=null?np/nl:null),
      gl:w.grassroots_leads??null, gp:w.grassroots_presales??null,
      ev:w.comm_events??null,

function drawScCumChart(sc,weeks){
  const ctx=document.getElementById('scCumChart');if(!ctx)return;
  if(_ch.scCum){_ch.scCum.destroy();_ch.scCum=null;}
  const go=sc.go_week||27;
  const allW=Array.from({length:go+1},(_,i)=>i);
  const labels=allW.map(i=>`W${i}`);
  const actual=allW.map(i=>{const w=weeks.find(x=>x.w===i);return(w&&w.pc)?w.pc:null;});
  const t300=allW.map((_,i)=>i<=12?Math.round(300/12*i):null);
  const t440_16=allW.map((_,i)=>i<=16?Math.round(440/16*i):null);
  const t440_go=allW.map((_,i)=>+(440/go*i).toFixed(1));
  _ch.scCum=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'Actual Presales',data:actual,borderColor:'#5b9bd5',borderWidth:2.5,pointRadius:3,pointHoverRadius:6,tension:.3,fill:false,spanGaps:false},
    {label:'300 in 12 Weeks',data:t300,borderColor:'#ed7d31',borderWidth:1.5,borderDash:[6,4],pointRadius:0,tension:0,fill:false,spanGaps:false},
    {label:'440 in 16 Weeks',data:t440_16,borderColor:'#ffc000',borderWidth:1.5,borderDash:[6,4],pointRadius:0,tension:0,fill:false,spanGaps:false},
    {label:`440 by GO (W${go})`,data:t440_go,borderColor:'#70ad47',borderWidth:1.5,borderDash:[4,4],pointRadius:0,tension:0,fill:false},

function metaFilter(studio,from,to){
  if(!META_RAW)return[];
  const code=META_CODES[studio];
  if(!code)return[];
  return META_RAW.filter(r=>{
    if(!r.campaign_name.includes(code))return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    return true;
  });

function _drawGoogleTrend(allRows,from,to){

  const byDate={};
  allRows.forEach(r=>{
    if(!r.date)return;
    if(!byDate[r.date])byDate[r.date]={spend:0,leads:0};
    byDate[r.date].spend+=r.spend||0;
    byDate[r.date].leads+=r.conversions||0;

  const dates=Object.keys(byDate).sort();
  if(!dates.length)return;
  const isMob=window.innerWidth<=768;
  _ch.google=new Chart(ctx,{type:'bar',data:{labels:dates.map(d=>fmDay(d)),datasets:[

let _chSort={col:'date',asc:false};

function renderClientHistory(){
  const el=document.getElementById('ch-content');
  if(!el)return;
  if(!CH_RAW||!CH_RAW.studios){el.innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">Client history data not yet available.</div>';return;}

  const selStudios=new Set(_getSel('studioMenu').map(s=>s.replace(/^SWEAT440\s+/,'')));

  // Collect records across selected studios
  let records=[];
  for(const s of CH_RAW.studios){
    const sname=s.name.replace(/^SWEAT440\s+/,'');
    if(selStudios.size&&!selStudios.has(sname))continue;
    for(const r of (s.records||[])){
      records.push({...r,studio:sname});
    }
  }

  // Cap at 2 days ago (same cutoff as other tabs)
  const _chCap=(()=>{const n=new Date();n.setDate(n.getDate()-2);return n.toISOString().slice(0,10);})();
  records=records.filter(r=>r.date<=_chCap);

  // Date filter
  const from=document.getElementById('fFrom').value||'';
  const to  =document.getElementById('fTo').value  ||'';
  if(from)records=records.filter(r=>r.date>=from);
  if(to)  records=records.filter(r=>r.date<=to);

  // Type filter
  const typeVal=document.getElementById('chTypeFilter')?.value||'all';
  if(typeVal==='sale')  records=records.filter(r=>r.type==='sale');
  if(typeVal==='cancel')records=records.filter(r=>r.type==='cancel');

  // Source filter — use global sourceMenu (same as other tabs)
  const selSrc=_getSel('sourceMenu');
  if(selSrc.length)records=records.filter(r=>selSrc.includes(r.source||''));

  // Sort
  const {col,asc}=_chSort;
  records.sort((a,b)=>{
    let av=a[col]??'',bv=b[col]??'';
    if(col==='amount'){av=+av;bv=+bv;}
    else{av=String(av).toLowerCase();bv=String(bv).toLowerCase();}
    return av<bv?(asc?-1:1):av>bv?(asc?1:-1):0;
  });

  const sales   =records.filter(r=>r.type==='sale').length;
  const cancels =records.filter(r=>r.type==='cancel').length;
  const revenue =records.filter(r=>r.type==='sale').reduce((s,r)=>s+(r.amount||0),0);

  // Email frequency — count SALES only (1 sale + 1 cancel is not "multiple memberships")
  const emailFreq={};
  records.filter(r=>r.type==='sale').forEach(r=>{if(r.email)emailFreq[r.email]=(emailFreq[r.email]||0)+1;});
  const dupEmails=new Set(Object.keys(emailFreq).filter(e=>emailFreq[e]>1));
  const dupCount=dupEmails.size;

  function _th(label,col){
    const arrow=_chSort.col===col?(_chSort.asc?' ▲':' ▼'):'';
    return `<th class="num" style="cursor:pointer;white-space:nowrap" onclick="chSortBy('${col}')">${label}${arrow}</th>`;
  }
  function _thL(label,col){
    const arrow=_chSort.col===col?(_chSort.asc?' ▲':' ▼'):'';

function chSortBy(col){
  if(_chSort.col===col)_chSort.asc=!_chSort.asc;
  else{_chSort.col=col;_chSort.asc=col==='date'?false:true;}
  renderClientHistory();
}

function chExportCSV(){
  const recs=window._chRecords||[];
  const hdr=['Name','Email','Phone','Studio','Source','Product','Date','Time','Platform','Sold By','Amount','Type'];
  const rows=recs.map(r=>[
    r.client_name,r.email,r.phone,r.studio,r.source||'N/A',r.product,r.date,r.time,r.platform,r.sold_by,r.amount,r.type
  ].map(v=>{
    const s=String(v??'').replace(/"/g,'""');
    return /[",\n]/.test(s)?`"${s}"`:s;
  }).join(','));
  const csv=[hdr.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`client_history_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function drawGA4Trend(from,to,activeStudios){
  const ctx=document.getElementById('ga4TrendChart');if(!ctx)return;
  if(_ch.ga4){_ch.ga4.destroy();_ch.ga4=null;}
  const datasets=activeStudios.map((studio,i)=>{
    const rows=_ga4StudioRows(studio,from,to);
    const byDate={};rows.forEach(r=>{byDate[r.date]=(byDate[r.date]||0)+(r.sessions||0)});
    return{studio,byDate,color:studioColor(studio)};
  });
  const allDates=[...new Set(datasets.flatMap(d=>Object.keys(d.byDate)))].sort();
  const isMob=window.innerWidth<=768;
  _ch.ga4=new Chart(ctx,{type:'line',data:{labels:allDates.map(d=>fmDay(d)),datasets:datasets.map(({studio,byDate,color})=>({label:studio.replace('SWEAT440 ',''),data:allDates.map(d=>byDate[d]||0),borderColor:color,borderWidth:2,pointRadius:0,tension:.4,fill:false}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Oswald',size:12,style:'italic'},usePointStyle:true,padding:14}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10},color:'#5a7a8a',autoSkip:true,maxTicksLimit:isMob?5:14,maxRotation:0}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:11},color:'#5a7a8a'}}}}});
}

      const name=r.name.replace('SWEAT440 ','');
      const rv=r.reviews;
      const ratingCell=rv?`${rv.average_rating.toFixed(1)} ★`:'—';
      const totalCell=rv?rv.total_count.toLocaleString():'—';
      const fiveCell=rv?rv.five_star_count.toLocaleString():'—';
      h+=`<tr><td>${name}</td><td class="num">${tv.toLocaleString()}</td><td class="num">${sv.toLocaleString()}</td><td class="num">${mv.toLocaleString()}</td><td class="num">${(r.direction_requests||0).toLocaleString()}</td><td class="num">${(r.website_clicks||0).toLocaleString()}</td><td class="num">${(r.calls||0).toLocaleString()}</td><td class="num">${ratingCell}</td><td class="num">${totalCell}</td><td class="num">${fiveCell}</td></tr>`;
    });
    h+='</tbody></table></div></div>';
    return h;
  }

  // Live API data path
  if(GBP_RAW&&(GBP_RAW.studios||[]).length){
    const studios=(GBP_RAW.studios||[]).filter(s=>selStudios.includes(s.name));
    if(!studios.length){el.innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">No studios selected.</div>';return;}
    const studioRows=studios.map(s=>{
      const rows=(s.daily||[]).filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));
      const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
      return{name:s.name,search_mobile:sum('mobile_search'),search_desktop:sum('desktop_search'),maps_mobile:sum('mobile_maps'),maps_desktop:sum('desktop_maps'),direction_requests:sum('direction_requests'),website_clicks:sum('website_clicks'),calls:sum('calls'),reviews:s.reviews||null};
    });
    el.innerHTML=_renderAgg(studioRows);
    return;
  }

  // Fallback: static GBP_DATA
  const filtered=GBP_DATA.filter(d=>selStudios.includes(d.studio));
  if(!filtered.length){el.innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">No studios selected.</div>';return;}
  const studioRows=filtered.map(d=>({name:d.studio,search_mobile:d.search_mobile,search_desktop:d.search_desktop,maps_mobile:d.maps_mobile,maps_desktop:d.maps_desktop,direction_requests:d.directions,website_clicks:d.website_clicks,calls:d.calls}));
  el.innerHTML=_renderAgg(studioRows)+`<div style="font-size:10px;color:#aab;padding:0 20px 16px">Source: Google Business Profile CSV export.</div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   INSTAGRAM TAB
   ══════════════════════════════════════════════════════════════════════════ */
function renderInstagram(){
  const el=document.getElementById('instagram-content');if(!el)return;
  const studios=_socialStudios('instagram');
  const from=document.getElementById('fFrom').value||null;
  const to=document.getElementById('fTo').value||null;

  if(!studios.length){
    el.innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">No Instagram data available. Data refreshes daily via GitHub Actions.</div>';
    return;
  }

  const fromD=from?new Date(from+'T00:00:00'):null;
  const toD=to?new Date(to+'T00:00:00'):null;

  // Determine rolling window start from available daily data
  const allDailyDates=studios.flatMap(s=>(s.daily||[]).map(r=>r.date));
  const windowStart=allDailyDates.length?[...allDailyDates].sort()[0]:null;
  const rangeExtendsBack=!!(from&&windowStart&&from<windowStart);
  const rangeEndsInHistory=!!(to&&windowStart&&to<windowStart);
  const fromMonthKey=from?from.substring(0,7)+'-01':null;
  const toMonthKey=to?to.substring(0,7)+'-01':null;
  const windowMonthKey=windowStart?windowStart.substring(0,7)+'-01':null;

  let ppFromStr=null,ppToStr=null,ppOutOfRange=false;
  if(fromD&&toD){
    const{ppFrom:ppF,ppTo:ppT}=computeWindows(fromD,toD);
    ppFromStr=localDateStr(ppF);ppToStr=localDateStr(ppT);
    const dataStart=windowStart||null;
    ppOutOfRange=!dataStart||ppFromStr<dataStart;
  }

  const filtered=studios.map(s=>({
    ...s,
    current_followers:s.current_followers||0,
    daily:(s.daily||[]).filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)),
    posts:(s.posts||[]).filter(p=>(!from||p.date>=from)&&(!to||p.date<=to))
  }));

  const ppFiltered=ppFromStr?studios.map(s=>({
    ...s,
    daily:(s.daily||[]).filter(r=>r.date>=ppFromStr&&r.date<=ppToStr),
    posts:(s.posts||[]).filter(p=>p.date>=ppFromStr&&p.date<=ppToStr)
  })):[];

  // Monthly data for the pre-window portion of the selected range, capped at toMonthKey
  const monthFiltered=rangeExtendsBack?studios.map(s=>({
    ...s,
    monthly:(s.monthly||[]).filter(m=>m.month>=fromMonthKey&&m.month<windowMonthKey&&(!toMonthKey||m.month<=toMonthKey))
  })):[];

  function _enrichPosts(studioList){
    return studioList.flatMap(s=>{
      const reachByDate={};s.daily.forEach(r=>{reachByDate[r.date]=r.reach||0;});
      const postsPerDay={};s.posts.forEach(p=>{postsPerDay[p.date]=(postsPerDay[p.date]||0)+1;});
      return s.posts.map(p=>({...p,studio:s.studio,code:s.code,
        est_reach:postsPerDay[p.date]?Math.round((reachByDate[p.date]||0)/postsPerDay[p.date]):0,
        er_pct:s.current_followers>0?+((p.likes+p.comments)/s.current_followers*100).toFixed(2):null}));
    });
  }
  function _median(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
  function _sumKey(studioList,key){let t=0;studioList.forEach(s=>s.daily.forEach(r=>{t+=r[key]||0;}));return t;}

  const allPosts=_enrichPosts(filtered);
  const ppAllPosts=_enrichPosts(ppFiltered);

  // Reach: daily (rolling window) + monthly (historical pre-window)
  const dailyReach=_sumKey(filtered,'reach');
  const monthlyReach=monthFiltered.reduce((t,s)=>(s.monthly||[]).reduce((a,m)=>a+(m.reach||0),0)+t,0);
  const totalReach=dailyReach+monthlyReach;
  const ppTotalReach=_sumKey(ppFiltered,'reach');

  // Days for avg: unique daily dates + calendar days for each historical month
  const dailyDays=new Set(filtered.flatMap(s=>s.daily.map(r=>r.date))).size;
  const monthlyDays=monthFiltered.flatMap(s=>s.monthly||[]).reduce((t,m)=>{
    const d=new Date(m.month);return t+new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  },0);
  const days=(dailyDays+monthlyDays)||1;
  const ppDays=new Set(ppFiltered.flatMap(s=>s.daily.map(r=>r.date))).size||1;
  const avgReach=Math.round(totalReach/days);
  const ppAvgReach=Math.round(ppTotalReach/ppDays);
  const totalFollowers=filtered.reduce((a,s)=>a+(s.current_followers||0),0);
  const hasFollowers=filtered.some(s=>s.current_followers>0);
  const medianLikes=_median(allPosts.map(p=>p.likes||0));
  const medianReach=_median(allPosts.map(p=>p.est_reach||0));
  const ppMedianLikes=_median(ppAllPosts.map(p=>p.likes||0));
  const ppMedianReach=_median(ppAllPosts.map(p=>p.est_reach||0));

  // Historical post count and medians from monthly aggregates
  const historicalPostCount=monthFiltered.reduce((t,s)=>(s.monthly||[]).reduce((a,m)=>a+(m.post_count||0),0)+t,0);
  // Weighted average of monthly medians (weighted by post_count per month)
  function _weightedMedian(studioList,field){
    let totalW=0,totalV=0;
    studioList.forEach(s=>(s.monthly||[]).forEach(m=>{
      const v=m[field];const w=m.post_count||0;
      if(v!=null&&w>0){totalV+=v*w;totalW+=w;}
    }));
    return totalW>0?Math.round(totalV/totalW):null;
  }
  const histMedianLikes=_weightedMedian(monthFiltered,'median_likes');
  const histMedianReach=_weightedMedian(monthFiltered,'median_reach_per_post');

  function _igDelta(curr,pp){
    if(!ppFromStr||ppOutOfRange||rangeExtendsBack)return'';
    if(!pp)return'';
    const d=(curr-pp)/pp*100;
    const cls=d>=0?'pos':'neg';const arrow=d>=0?'&#9650;':'&#9660;';
    return`<div class="kpi-card-delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)}% prev period</div>`;
  }
  function _igKpi(label,value,delta,note=''){
    const noteHtml=note?`<div style="font-size:10px;color:#888;font-style:italic;margin-top:3px">${note}</div>`:'';
    return`<div class="kpi-card"><div class="kpi-card-label">${label}</div><div class="kpi-card-val">${value}</div>${delta}${noteHtml}</div>`;
  }

  let h='';
  // Followers KPI — three cases:
  // 1. Range ends before rolling window: use monthly archive value
  // 2. Range ends within rolling window with a 'to' date: reconstruct from current_followers minus deltas after 'to'
  // 3. No 'to' date (open range): show current_followers
  let followersLabel='Current Followers',followersVal=totalFollowers,hasFollowersKpi=hasFollowers;
  if(rangeEndsInHistory&&monthFiltered.length){
    let mSum=0,mCount=0;
    monthFiltered.forEach(s=>{
      const mths=(s.monthly||[]).filter(m=>m.followers!=null).sort((a,b)=>b.month.localeCompare(a.month));
      if(mths.length){mSum+=mths[0].followers;mCount++;}
    });
    if(mCount>0){followersLabel='Followers';followersVal=mSum;hasFollowersKpi=true;}
  } else if(to){
    // Reconstruct: current_followers minus daily deltas that occurred after 'to'
    let rSum=0,rCount=0;
    studios.forEach(s=>{
      if(!s.current_followers)return;
      const deltasAfter=(s.daily||[]).filter(d=>d.date>to&&d.follower_count!=null)
        .reduce((acc,d)=>acc+(d.follower_count||0),0);
      rSum+=s.current_followers-deltasAfter;rCount++;
    });
    if(rCount>0){followersLabel='Followers';followersVal=rSum;hasFollowersKpi=true;}
  }

  h+=`<div class="kpi-grid">`;
  if(hasFollowersKpi)h+=_igKpi(followersLabel,followersVal.toLocaleString(),'');
  h+=_igKpi('Total Reach',totalReach.toLocaleString(),_igDelta(totalReach,ppTotalReach));
  h+=_igKpi('Avg Daily Reach',avgReach.toLocaleString(),_igDelta(avgReach,ppAvgReach));
  if(allPosts.length){
    h+=_igKpi('Median Reach / Post',medianReach.toLocaleString(),_igDelta(medianReach,ppMedianReach));
    h+=_igKpi('Median Likes',medianLikes.toLocaleString(),_igDelta(medianLikes,ppMedianLikes));
  } else if(rangeExtendsBack){
    if(histMedianReach!=null)h+=_igKpi('Median Reach / Post',histMedianReach.toLocaleString(),'');
    if(histMedianLikes!=null)h+=_igKpi('Median Likes',histMedianLikes.toLocaleString(),'');
  }
  h+=_igKpi('Posts in Period',(allPosts.length+historicalPostCount).toString(),_igDelta(allPosts.length,ppAllPosts.length));
  h+=`</div>`;
  const _disclaimerBase=`The Instagram API provides a rolling 90-day window of daily data. As each month falls completely outside that window, it is automatically archived as a monthly aggregate (reach, post count, and median engagement).`;
  const _disclaimerExtra=rangeExtendsBack
    ?` Metrics for dates before <strong>${windowStart}</strong> come from those monthly aggregates.`
    :'';
  h+=`<div style="display:flex;align-items:flex-start;gap:10px;background:#fdf8ee;border-left:3px solid #f4a021;border-radius:6px;padding:12px 16px;margin-bottom:20px">
    <span style="font-size:15px;line-height:1;color:#c8860a;flex-shrink:0;margin-top:1px">ⓘ</span>
    <p style="margin:0;font-size:12px;color:#6b5a2e;line-height:1.55">${_disclaimerBase}${_disclaimerExtra}</p>
  </div>`;

  if(allPosts.length||historicalPostCount){
    const histNote=rangeExtendsBack&&historicalPostCount>0
      ?`<div style="font-size:11px;color:#8aaabb;font-family:'Open Sans',sans-serif;padding:6px 0 2px">Showing ${allPosts.length} posts from the last 90 days. ${historicalPostCount} older posts are available as monthly totals only.</div>`
      :'';
    h+=`<div class="chart-card">
      <div class="chart-card-title">Best Performing Posts</div>
      ${histNote}
      <div style="overflow-x:auto">
        <table class="data-table" id="ig-posts-table">
          <thead><tr>
            <th style="width:68px"></th>
            <th data-sort="date">Date</th>
            <th data-sort="caption">Post</th>
            <th data-sort="media_type">Type</th>
            <th class="num" data-sort="est_reach">Reach</th>
            <th class="num" data-sort="likes">Likes</th>
            <th class="num" data-sort="comments">Comments</th>
            <th class="num" data-sort="er_pct">ER%</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`;
  }

  el.innerHTML=h;

  if(allPosts.length){
    sortableTable('ig-posts-table',allPosts,(p)=>{
      const isVid=p.media_type==='VIDEO'||p.media_type==='REELS';
      const vidBadge=isVid?'<div style="position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;font-size:9px;padding:1px 4px">&#9654;</div>':'';
      const _igSrc=p.image_url?(p.image_url.startsWith('http')?p.image_url:p.image_url.replace(/^nso-dashboard\//,'')):''
      const imgInner=_igSrc
        ?`<img class="soc-thumb" src="${_igSrc}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="soc-thumb-ph" style="display:none">${isVid?'&#9654;':'&#128247;'}</div>`
        :`<div class="soc-thumb-ph">${isVid?'&#9654;':'&#128247;'}</div>`;
      const img=p.permalink
        ?`<a href="${p.permalink}" target="_blank" rel="noopener" style="position:relative;display:block;width:60px">${imgInner}${vidBadge}</a>`
        :`<div style="position:relative;display:block;width:60px">${imgInner}</div>`;
      const caption=p.permalink
        ?`<a href="${p.permalink}" target="_blank" rel="noopener" style="color:#1a4d6e;text-decoration:none">${(p.caption||'').slice(0,90)||'(no caption)'}</a>`
        :((p.caption||'').slice(0,90)||'(no caption)');
      const typeLabel=p.media_type==='CAROUSEL_ALBUM'?'CAROUSEL':(p.media_type||'—');
      const er=p.er_pct!=null?p.er_pct.toFixed(2)+'%':'—';
      return`<tr>
        <td>${img}</td>
        <td style="white-space:nowrap;color:#8aaabb;font-size:12px">${fmDay(p.date)}</td>
        <td style="font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${caption}</td>
        <td style="font-size:12px">${typeLabel}</td>
        <td class="num">${(p.est_reach||0).toLocaleString()}</td>
        <td class="num">${(p.likes||0).toLocaleString()}</td>
        <td class="num">${(p.comments||0).toLocaleString()}</td>
        <td class="num">${er}</td>
      </tr>`;
    });
  }
}

    // data.json stores studio names without "SWEAT440 " prefix — normalize to match NSO array

  if(chRes.status==='fulfilled'){CH_RAW=chRes.value}
  else{console.warn('nso_client_history.json not found')}

  renderFreshnessNote('dataFreshnessNote', [
    {raw: dataRes.status==='fulfilled'   ? dataRes.value   : null, lagDays: 2},
    {raw: salesRes.status==='fulfilled'  ? salesRes.value  : null, lagDays: 2},
    {raw: scRes.status==='fulfilled'     ? scRes.value     : null, lagDays: 2},
    {raw: mktRes.status==='fulfilled'    ? mktRes.value    : null, lagDays: 1},
    {raw: gadsRes.status==='fulfilled'   ? gadsRes.value   : null, lagDays: 1},
    {raw: socialRes.status==='fulfilled' ? socialRes.value : null, lagDays: 1},
    {raw: gbpRes.status==='fulfilled'    ? gbpRes.value    : null, lagDays: 1},
    {raw: adMetaRes.status==='fulfilled' ? adMetaRes.value : null, lagDays: 1},
  ]);

  // Build multi-selects (filter NSO list to allowed studios if franchisee)
  // NSO names have "SWEAT440 " prefix; users.js stores names without it (matching data.json)
  const _nsoVisible = _allowedStudios
    ? NSO.filter(s => _allowedStudios.includes(s.replace(/^SWEAT440\s+/, '')))
    : NSO;
  _buildMS('studioMenu','studioLabel',_nsoVisible,[]);
  // Canonical source list from MARKETING_REPORTS.PUBLIC.LEADS_LIST
  const _allSrc=['Meta Ads','Google Ads','Local Listings','Social Media Organic','Website (unattributed)','Word of Mouth','SWEAT440 App','MindBody App','ClassPass / Platforms','Grassroots','Business Mode / App','Public API','Print Ads / Signs','Internet / AI Search','Other','N/A'];
  _buildMS('sourceMenu','sourceLabel',_allSrc,EXCL_SRC);

  // Fallback dates
  const nsoRows=[...(RAW.daily_detail||[]),...(RAW.monthly_detail||[])].filter(r=>NSO.includes(r.studio));
  const allKeys=nsoRows.map(r=>r.date||r.month).filter(Boolean).sort();
  if(allKeys.length){const lk=allKeys[allKeys.length-1].slice(0,7);const df=document.getElementById('fFrom').value.slice(0,7);const has=allKeys.some(k=>k>=df+'-01'&&k<=df+'-31');if(!has){const ld=new Date(lk+'-01T00:00:00Z');document.getElementById('fFrom').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth(),1)).toISOString().slice(0,10);document.getElementById('fTo').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth()+1,0)).toISOString().slice(0,10)}}

  // Cap leads data to NSO_SALES end date (both use 2-day lag; data.json may lag behind)
  const _salesEnd=NSO_SALES&&NSO_SALES.date_range&&NSO_SALES.date_range.end||null;
  if(_salesEnd&&RAW.daily_detail){RAW.daily_detail=RAW.daily_detail.filter(r=>!r.date||r.date<=_salesEnd);}
  const _lastD=_salesEnd||(RAW.daily_detail||[]).map(r=>r.date).filter(Boolean).sort().pop();
  if(_lastD){const _ld=new Date(_lastD+'T00:00:00Z');_dataThruLabel='Data until '+(_ld.getUTCMonth()+1)+'/'+_ld.getUTCDate()+'/'+_ld.getUTCFullYear();}
  document.querySelectorAll('.data-thru-label').forEach(el=>el.textContent=_dataThruLabel);
  document.querySelector('.controls-bar').style.display='none';
  renderSummary();
  renderFunnel();
  applyFilters();
}
init();
</script>
</body>
</html>
