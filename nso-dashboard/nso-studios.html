<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — NSO Studios Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/style.css"/>
<style>
/* Summary-specific styles */
.summary-studio-select{margin-bottom:20px}
.summary-studio-select select{font-family:'Oswald',sans-serif;font-size:14px;padding:8px 16px;border-radius:8px;font-style:italic;text-transform:uppercase;letter-spacing:.5px}
.timeline-bar{position:relative;height:28px;background:#f0f6fa;border-radius:14px;overflow:visible;margin-bottom:8px}
.timeline-fill{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--c-leads),var(--c-ft));transition:width .6s ease;position:relative;min-width:8px}
.timeline-marker{position:absolute;top:-6px;width:2px;height:40px;background:#1a1a2e;opacity:.3}
.timeline-marker-label{position:absolute;top:36px;font-size:9px;color:#5a7a8a;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.timeline-marker.co{background:#f4a021;opacity:.9;width:2px}
.timeline-marker.co .timeline-marker-label{color:#f4a021;font-weight:700}
.timeline-marker.go .timeline-marker-label{color:#e05a5a;font-weight:700}
.timeline-marker.tier2{background:#27ae60;opacity:.9;width:2px}
.timeline-marker.tier2 .timeline-marker-label{color:#27ae60;font-weight:700}
.timeline-marker.tier3{background:#8e44ad;opacity:.9;width:2px}
.timeline-marker.tier3 .timeline-marker-label{color:#8e44ad;font-weight:700}
.timeline-current{position:absolute;top:-2px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--c-ft);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:2}
.timeline-weeks{display:flex;justify-content:space-between;font-size:9px;color:#8aaabb;margin-top:4px}
.summary-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.summary-card{padding:18px 20px}
.summary-card-section{font-family:'Oswald',sans-serif;font-style:italic;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:#5a7a8a;margin-bottom:14px}
.sk-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sk-label{font-size:11px;color:#5a7a8a;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sk-vals{text-align:right}
.sk-actual{font-size:22px;font-weight:700;color:#1a1a2e;line-height:1}
.sk-goal{font-size:11px;color:#8aaabb;margin-top:2px}
.sk-check{color:#0a8a4a;font-weight:700;margin-left:4px}
.sk-miss{color:#d32f2f;font-weight:700;margin-left:4px}
.sk-progress{height:6px;background:#f0f6fa;border-radius:3px;margin-top:4px;overflow:hidden;position:relative}
.sk-progress-fill{height:100%;border-radius:3px;transition:width .6s ease}
.sk-progress-over{height:4px;border-radius:3px;margin-top:2px;opacity:.55;transition:width .6s ease;margin-left:auto}
.open-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center}
.open-days{font-family:'Oswald',sans-serif;font-size:48px;font-weight:700;color:var(--c-leads);line-height:1}
.open-label{font-family:'Oswald',sans-serif;font-style:italic;font-size:14px;font-weight:600;text-transform:uppercase;color:#e05a5a;letter-spacing:1px;margin-bottom:4px}
.open-date{font-size:11px;color:#5a7a8a}
@media(max-width:768px){.summary-kpis{grid-template-columns:1fr}}
.sc-table td:first-child,.sc-table th:first-child{position:sticky;left:0;background:#fff;z-index:1;border-right:1.5px solid #dde8ef}
.sc-table thead th:first-child{background:#f4f9fd}
.sc-cell-good{background:#e8faf0!important;color:#0a8a4a}
.sc-cell-warn{background:#fff8e1!important;color:#b8860b}
.sc-cell-bad{background:#ffeaea!important;color:#c0392b}
.sc-cell-cur{background:#e8f4fd!important}
/* Social posts table (Instagram / Facebook) */
.soc-table{width:100%;border-collapse:collapse;table-layout:fixed}
.soc-row{display:grid;gap:10px;padding:9px 12px;border-bottom:1px solid #edf3f7;align-items:center}
.soc-row:last-child{border-bottom:none}
.soc-row:not(.soc-th):hover{background:#f9fbfd}
.soc-row.soc-th{background:#f4f9fd;border-bottom:2px solid #dde8ef}
.soc-row.soc-ig{grid-template-columns:70px 68px 1fr 62px 50px 72px 58px 60px 58px 52px}
.soc-row.soc-fb{grid-template-columns:70px 68px 1fr 65px 65px}
.soc-cell{font-size:12.5px;color:#5a7a8a;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soc-cell:first-child,.soc-cell.soc-left{text-align:left;color:#1a4d6e}
.soc-row.soc-th .soc-cell:nth-child(3){text-align:left}
.soc-th .soc-cell{font-size:10px;font-weight:700;color:#8aaabb;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;font-family:'Oswald',sans-serif}
.soc-th .soc-cell:hover,.soc-th .soc-cell.sorted{color:var(--c-leads)}
.soc-cell.sc{color:var(--c-leads);font-weight:600}
.soc-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid #dde8ef;display:block}
.soc-thumb-ph{width:60px;height:60px;border-radius:8px;background:#f0f6fa;border:1px solid #dde8ef;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#8aaabb}
.soc-caption{font-size:12px;color:#1a4d6e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;text-align:left}
.soc-caption a{color:#1a4d6e;text-decoration:none}.soc-caption a:hover{color:var(--c-leads);text-decoration:underline}
.soc-date{font-size:11px;color:#8aaabb;font-weight:600}
.soc-studio-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.04em;margin-top:3px}
@media(max-width:640px){.soc-row.soc-ig{grid-template-columns:56px 56px 1fr 48px 48px}.soc-row.soc-ig .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-fb{grid-template-columns:56px 56px 1fr}.soc-row.soc-fb .soc-cell:nth-child(n+4){display:none}}
#leadsRingLeg,#memRingLeg{display:flex!important;flex-direction:column;gap:10px;font-size:13px;line-height:1.4;width:auto}
#leadsRingLeg .ring-legend-item,#memRingLeg .ring-legend-item{display:flex!important;align-items:center;gap:0;width:auto}
#leadsRingLeg .ring-legend-dot,#memRingLeg .ring-legend-dot{width:12px!important;height:12px!important;border-radius:3px;flex-shrink:0;margin-right:12px}
#leadsRingLeg .ring-legend-label,#memRingLeg .ring-legend-label{white-space:nowrap;color:#1a1a2e;margin-right:16px;flex:0 0 auto}
#leadsRingLeg .ring-legend-vol,#memRingLeg .ring-legend-vol{white-space:nowrap;text-align:right;color:#5a7a8a;margin-right:10px;flex:0 0 auto}
#leadsRingLeg .ring-legend-pct,#memRingLeg .ring-legend-pct{white-space:nowrap;text-align:right;font-weight:700;color:#1a1a2e;flex:0 0 auto}
</style>
</head>
<body>

</div>

<div class="main">

  <!-- SUMMARY TAB -->
  <div class="tab-content active" id="tab-summary">
    <div id="summaryContent"></div>
  </div>

  <!-- SCORECARD TAB -->
  <div class="tab-content" id="tab-scorecard">
    <div id="scorecard-content"></div>
  </div>

  <!-- FUNNEL TAB -->
  <div class="tab-content" id="tab-funnel">
    <div class="chart-card"><div class="chart-card-title">Conversion Funnel — NSO Studios</div><div class="funnel-wrap" id="funnelBars"></div></div>
    <div class="chart-card"><div class="chart-card-title">Funnel Over Time</div>

          <button class="tog-btn on" onclick="toggleDs(this,1)" style="border-color:#00FFC2;background:#00FFC2;color:#000"><span class="dot" style="background:#000"></span>Sales</button>

  <!-- LEADS -->

  <!-- SALES -->
  <div class="tab-content" id="tab-members">
    <div id="mem-kpis" class="kpi-grid three"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

        <div class="gran-group">
          <button class="gran-btn active" id="granDailyS" onclick="setGran('daily')">Daily</button>

    </div>
    <div class="chart-card"><div class="chart-card-title">Source Participation</div><div class="ring-wrap" style="flex-direction:row;align-items:center;justify-content:center;gap:56px;padding:24px 40px"><div class="ring-canvas-wrap" style="width:300px;height:300px;flex-shrink:0;margin:0"><canvas id="memRing"></canvas></div><div class="ring-legend" id="memRingLeg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../shared/utils.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   NSO STUDIOS DASHBOARD — Self-contained
   ══════════════════════════════════════════════════════════════════════════ */
const NSO=['SWEAT440 Herriman','SWEAT440 Naples - Mercato','SWEAT440 Reston'];
const EXCL_SRC=['ClassPass / Platforms','Grassroots','N/A'];

let RAW=null,SC=null,GRAN='daily',trendChart=null,NSO_SALES=null,NSO_SALES_ROWS=[],GBP_RAW=null;const _ch={};
let _sumView='cum',_sumStudio=null,_scStudio=null;
const TODAY=new Date(),fom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),lpm=new Date(fom.getTime()-864e5),fpm=new Date(lpm.getFullYear(),lpm.getMonth(),1);
function lds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
document.getElementById('fFrom').value=lds(fpm);document.getElementById('fTo').value=lds(lpm);

function toggleNav(){document.getElementById('navTabs').classList.toggle('open')}
function toggleControls(){const e=document.getElementById('ctrlInner');e.classList.toggle('open');document.getElementById('ctrlToggle').textContent=e.classList.contains('open')?'Filters ▴':'Filters ▾'}
function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn&&btn.closest('.nav-submenu')){
    document.querySelectorAll('.nav-submenu').forEach(g=>g.classList.remove('open'));
    document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
    btn.closest('.nav-submenu').classList.add('open');
    btn.closest('.nav-group').querySelector('.nav-group-label').classList.add('group-open');
  }
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('navTabs').classList.remove('open');
  if(id==='summary')renderSummary();
  else if(id==='scorecard')renderScorecard();
  else if(id==='gbp')renderGBP();
  else if(id==='ga4')renderGA4();
  else if(id==='meta')renderMeta();
  else if(id==='google')renderGoogle();

  else if(id==='instagram')renderInstagram();
  else applyFilters();
}
function toggleNavGroup(groupId,btn){
  const sub=document.getElementById(groupId);
  const isOpen=sub.classList.contains('open');
  document.querySelectorAll('.nav-submenu').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
  if(!isOpen){sub.classList.add('open');btn.classList.add('group-open');}
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.nav-group')){
    document.querySelectorAll('.nav-submenu').forEach(s=>s.classList.remove('open'));
    document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
  }
});

/* Multi-select */
function _toggleDD(id){document.querySelectorAll('.ms-menu').forEach(m=>{if(m.id!==id+'Menu')m.classList.remove('open')});document.getElementById(id+'Menu').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.multi-select'))document.querySelectorAll('.ms-menu').forEach(m=>m.classList.remove('open'))});
function _buildMS(mid,lid,items,excl){const m=document.getElementById(mid);m.innerHTML='';const ad=document.createElement('div');ad.className='ms-item ms-select-all';ad.innerHTML=`<input type=checkbox id=${mid}_all> <label for=${mid}_all style=cursor:pointer>Select all</label>`;m.appendChild(ad);const sep=document.createElement('div');sep.className='ms-divider';m.appendChild(sep);items.forEach(it=>{const d=document.createElement('div');d.className='ms-item';const ch=!excl.includes(it);const si=`ms_${mid}_${it.replace(/[^a-z0-9]/gi,'_')}`;d.innerHTML=`<input type=checkbox id="${si}" value="${it}" ${ch?'checked':''}> <label for="${si}" style=cursor:pointer>${it}</label>`;d.querySelector('input').addEventListener('change',()=>{_syncA(mid);_updL(mid,lid,items);applyFilters()});m.appendChild(d)});const ac=document.getElementById(mid+'_all');_syncA(mid);ac.addEventListener('change',()=>{m.querySelectorAll('input[value]').forEach(c=>c.checked=ac.checked);_updL(mid,lid,items);applyFilters()});_updL(mid,lid,items)}
function _syncA(mid){const m=document.getElementById(mid);const all=[...m.querySelectorAll('input[value]')];const ac=document.getElementById(mid+'_all');const n=all.filter(c=>c.checked).length;ac.checked=n===all.length;ac.indeterminate=n>0&&n<all.length}
function _updL(mid,lid,items){const ch=[...document.getElementById(mid).querySelectorAll('input[value]:checked')].map(c=>c.value);const l=document.getElementById(lid);if(ch.length===0)l.textContent='None';else if(ch.length===items.length)l.textContent='All';else if(ch.length<=2)l.textContent=ch.map(s=>s.replace('SWEAT440 ','')).join(', ');else l.textContent=ch.length+' selected'}
function _getSel(mid){return[...document.getElementById(mid).querySelectorAll('input[value]:checked')].map(c=>c.value)}

/* Data helpers */
function grd(r){return new Date((r.date||r.month)+'T00:00:00Z')}
function fR(arr,f,t,st,sr){return arr.filter(r=>{const d=grd(r);if(f&&d<f)return false;if(t&&d>t)return false;if(st&&!st.includes(r.studio))return false;if(sr&&!sr.includes(r.source))return false;return true})}
function sR(rows){return rows.reduce((a,r)=>{a.leads+=r.signups||0;a.ft+=r.first_visits||0;a.mem+=r.first_sales||0;return a},{leads:0,ft:0,mem:0})}
function cW(f,t){const ms=t-f;const pp2=new Date(f.getTime()-864e5);const pp1=new Date(pp2.getTime()-ms);const py1=new Date(f);py1.setFullYear(py1.getFullYear()-1);const py2=new Date(t);py2.setFullYear(py2.getFullYear()-1);return{ppFrom:pp1,ppTo:pp2,pyFrom:py1,pyTo:py2}}
function cD(c,p){return p?(c-p)/p*100:null}
function fmD(d){return d.toLocaleString('en-US',{month:'short',year:'numeric'})}
function fmDay(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}
function fmMo(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'})}
function _wkLabel(dateStr){
  if(!SC||!SC.studios)return'';
  const sel=_getSel('studioMenu');
  // Use selected studio's schedule; if multiple selected, only label when all share the same week
  const studios=sel.length?SC.studios.filter(s=>sel.includes(s.full_name)):SC.studios;
  // Only show week label when exactly 1 NSO studio is selected (weeks differ per studio)
  if(studios.length!==1)return'';
  for(const wk of(studios[0].weeks||[])){
    if(wk.date_start&&wk.date_end&&dateStr>=wk.date_start&&dateStr<=wk.date_end)
      return wk.week.replace('Week ','W').replace('WEEK ','W');
  }
  return'';
}

function skRow(label,actual,goal,color,noCheck){

  const met=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual>=goal;
  const miss=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual<goal;
  let h=`<div class="sk-row"><div><div class="sk-label">${label}</div></div><div class="sk-vals"><div class="sk-actual">${numActual}`;
  if(met)h+=`<span class="sk-check">✓</span>`;
  h+=`</div>`;
  if(numGoal!=null)h+=`<div class="sk-goal">Goal: ${numGoal}</div>`;
  h+=`</div></div>`;
  if(typeof actual==='number'&&typeof goal==='number'&&goal>0){
    const ratio=actual/goal;
    const basePct=Math.min(100,Math.round(ratio*100));
    const overPct=ratio>1?Math.min(60,Math.round((ratio-1)*100)):0;
    h+=`<div class="sk-progress"><div class="sk-progress-fill" style="width:${basePct}%;background:${color}"></div></div>`;
    if(overPct>0)h+=`<div class="sk-progress-over" style="width:${overPct}%;background:${color}"></div>`;
  }
  return h;
}

/* Parse "M/D - M/D" or "Label M/D - M/D" date strings → {start,end} YYYY-MM-DD */
function _parseWkDates(s){
  const m=[...s.matchAll(/(\d{1,2})\/(\d{1,2})/g)];
  if(m.length<2)return null;
  const fmt=(mo,dy)=>`2026-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
  // Use last two matches so label-embedded dates (e.g. "Move to $129 on 3/3 3/2 - 3/8") don't shift the range
  const s0=m[m.length-2],s1=m[m.length-1];
  return{start:fmt(s0[1],s0[2]),end:fmt(s1[1],s1[2])};
}

/* Aggregate data.json rows for a studio within a date range */
function _wkData(studioFull,dateStart,dateEnd){
  if(!RAW||!dateStart)return null;
  const rows=(RAW.daily_detail||[]).filter(r=>
    r.studio===studioFull && r.date>=dateStart && r.date<=dateEnd);
  if(!rows.length)return null;
  const nl=rows.reduce((a,r)=>a+(r.signups||0),0);
  const np=rows.reduce((a,r)=>a+(r.first_sales||0),0);
  const gl=rows.filter(r=>r.source==='Grassroots').reduce((a,r)=>a+(r.signups||0),0);
  return{nl,np,cr:nl>0?np/nl:null,gl};
}

function scKpi(label,val,target,fmt,targetLabel,auto){
  const fv=val!=null?fmt(val):'—';
  const pct=target&&val!=null?Math.min(100,Math.round(val/target*100)):null;
  const tl=targetLabel||(target!=null?fmt(target):null);
  const bar=pct!=null?`<div style="height:4px;background:#f0f6fa;border-radius:2px;margin-top:8px"><div style="height:100%;width:${pct}%;background:${pct>=100?'#0a8a4a':pct>=70?'#f4a021':'#e05a5a'};border-radius:2px"></div></div>`:'';
  const badge=auto?`<span style="font-size:9px;background:#e8f4fd;color:#0077bb;border-radius:3px;padding:1px 5px;margin-left:4px;font-family:Oswald,sans-serif;letter-spacing:.03em">AUTO</span>`:'';
  return`<div class="kpi-card"><div class="kpi-card-label">${label}${badge}</div><div class="kpi-card-val">${fv}</div>${tl?`<div style="font-size:11px;color:#8aaabb;margin-top:2px">Target: ${tl}</div>`:''} ${bar}</div>`;
}

  const icon=document.getElementById('sc-digital-icon');
  const open=subs[0]&&subs[0].style.display!=='none';

}

function renderScorecard(){
  const el=document.getElementById('scorecard-content');if(!el)return;
  if(!SC||!SC.studios||!SC.studios.length){
    el.innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">Scorecard data not available.</div>';
    return;
  }
  if(!_scStudio){
    const selStudios=_getSel('studioMenu');
    _scStudio=(selStudios.length?SC.studios.find(s=>selStudios.includes(s.full_name)):null)||SC.studios[0];
  }
  const sc=_scStudio||SC.studios[0];
  const cw=sc.current_week||0;
  const tgt=sc.targets||{};

  // Build week list with running cumulative spend/ig
  let _cMs=0,_cGs=0,_cGrs=0,_cLtf=0,_cTs=0,_cDs=0,_cIg=0;
  const weeks=sc.weeks.map(w=>{
    const wn=parseInt(String(w.week).replace(/[^0-9]/g,''))||0;
    const nl=w.new_leads??null, np=w.presales_week??null;
    const crRaw=w.conversion_rate;
    _cMs+=w.meta_spend||0;_cGs+=w.google_spend||0;_cGrs+=w.grassroots_spend||0;
    _cLtf+=w.leadteam_fee||0;_cTs+=w.total_marketing_spend||0;_cDs+=(w.meta_spend||0)+(w.google_spend||0);_cIg+=w.ig_new_followers||0;
    return{
      w:wn, date:w.date_range||'', isCur:wn===cw,
      ds:w.date_start||null, de:w.date_end||null,
      nl, np,
      cr:crRaw!=null?crRaw/100:(nl>0&&np!=null?np/nl:null),
      gl:w.grassroots_leads??null, gp:w.grassroots_presales??null,
      ev:w.comm_events??null,
      tl:w.total_leads??null, pc:w.presales_count??null,
      cancTot:w.cancellations_count??null, canc:w.cancellations_week??null,
      rmr:w.estimated_day1_rmr||null,
      ms:w.meta_spend??null, gs:w.google_spend??null,
      grs:w.grassroots_spend??null, ltf:w.leadteam_fee??null,
      ts:w.total_marketing_spend??null,
      dsp:(w.meta_spend!=null||w.google_spend!=null)?(w.meta_spend||0)+(w.google_spend||0):null,
      cpl:w.blended_cpl??null, cpa:w.blended_cpa??null,
      ig:w.ig_new_followers??null,
      cumMs:_cMs, cumGs:_cGs, cumGrs:_cGrs, cumLtf:_cLtf, cumTs:_cTs, cumDsp:_cDs, cumIg:_cIg,
      cumCr:(w.total_leads>0&&w.presales_count!=null)?w.presales_count/w.total_leads:null,
    };
  }).filter(w=>w.w<=cw+1);

  const $v=v=>v!=null?'$'+Math.round(v).toLocaleString('en-US'):'—';
  const fInt=v=>v!=null?v:'—';
  const fPct=v=>v!=null?(v*100).toFixed(1)+'%':'—';
  const fCur=v=>v!=null?'$'+v.toFixed(2):'—';
  const reqLeads=tgt.total_leads&&sc.go_week?+(tgt.total_leads/sc.go_week).toFixed(1):null;
  const reqPresales=tgt.presales_count&&sc.go_week?+(tgt.presales_count/sc.go_week).toFixed(1):null;

  const weeklyDefs=[
    {label:'New Leads',           key:'nl',  req:reqLeads,   fmt:fInt, color:true},
    {label:'New Presales',        key:'np',  req:reqPresales,fmt:fInt, color:true},
    {label:'Conversion Rate',     key:'cr',  req:.35,        fmt:fPct, color:true},
    {label:'Cancellations',       key:'canc',req:null,       fmt:fInt, color:false},
    {label:'Grassroots Leads',    key:'gl',  req:40,         fmt:fInt, color:true},
    {label:'Grassroots Presales', key:'gp',  req:20,         fmt:fInt, color:true},
    {label:'Comm. Events',        key:'ev',  req:6,          fmt:fInt, color:true},
    {label:'IG New Followers',    key:'ig',  req:30,         fmt:fInt, color:true},
    {label:'▶ Total Mktg Spend',                      key:'ts',  req:null, fmt:$v, color:false, spendParent:true},
    {label:'▶ Total Digital Ad Spend (Meta & Google)', key:'dsp', req:null, fmt:$v, color:false, spendSub:true, spendSubParent:true},
    {label:'Meta Spend',          key:'ms',  req:null,       fmt:$v,   color:false, spendSubSub:true},
    {label:'Google Spend',        key:'gs',  req:null,       fmt:$v,   color:false, spendSubSub:true},
    {label:'Grassroots Spend',    key:'grs', req:null,       fmt:$v,   color:false, spendSub:true},
    {label:'LeadTeam Fee',        key:'ltf', req:null,       fmt:$v,   color:false, spendSub:true},
    {label:'Blended CPL', key:'cpl', fmt:fCur, reqLabel:'$28 – $41',
     colorFn:v=>!v?'':(v<=41?'sc-cell-good':v<=41*1.3?'sc-cell-warn':'sc-cell-bad')},
    {label:'Blended CPA', key:'cpa', fmt:fCur, reqLabel:'$80 – $116',
     colorFn:v=>!v?'':(v<=116?'sc-cell-good':v<=116*1.3?'sc-cell-warn':'sc-cell-bad')},
  ];

  const cumDefs=[
    {label:'Total Leads',         key:'tl',  fmt:fInt, color:true,
     cumReqFn:wk=>tgt.total_leads&&sc.go_week?Math.round(tgt.total_leads/sc.go_week*wk.w):null,
     cumReqDisplay:tgt.total_leads||null},
    {label:'Presales (gross)',    key:'pc',  fmt:fInt, color:true,
     cumReqFn:wk=>tgt.presales_count&&sc.go_week?Math.round(tgt.presales_count/sc.go_week*wk.w):null,
     cumReqDisplay:tgt.presales_count||null},
    {label:'Net Presales',        key:null, computed:wk=>Math.max(0,(wk.pc||0)-(wk.cancTot||0)), fmt:fInt, color:true,
     cumReqFn:wk=>tgt.presales_count&&sc.go_week?Math.round(tgt.presales_count/sc.go_week*wk.w):null,
     cumReqDisplay:tgt.presales_count||null},
    {label:'Conversion Rate',     key:'cumCr', fmt:fPct, color:true,
     cumReqFn:_=>0.35, cumReqDisplay:0.35},
    {label:'Cancellations',       key:'cancTot', req:null, fmt:fInt, color:false},
    {label:'IG Followers (cum.)', key:'cumIg',   req:null, fmt:fInt, color:false},
    {label:'▶ Total Mktg Spend',                      key:'cumTs',  req:null, fmt:$v, color:false, spendParent:true},
    {label:'▶ Total Digital Ad Spend (Meta & Google)', key:'cumDsp', req:null, fmt:$v, color:false, spendSub:true, spendSubParent:true},
    {label:'Meta Spend',          key:'cumMs', req:null, fmt:$v, color:false, spendSubSub:true},
    {label:'Google Spend',        key:'cumGs', req:null, fmt:$v, color:false, spendSubSub:true},
    {label:'Grassroots Spend',    key:'cumGrs',req:null, fmt:$v, color:false, spendSub:true},
    {label:'LeadTeam Fee',        key:'cumLtf',req:null, fmt:$v, color:false, spendSub:true},
    {label:'Blended CPL', key:'cpl', fmt:fCur, reqLabel:'$28 – $41',
     colorFn:v=>!v?'':(v<=41?'sc-cell-good':v<=41*1.3?'sc-cell-warn':'sc-cell-bad')},
    {label:'Blended CPA', key:'cpa', fmt:fCur, reqLabel:'$80 – $116',
     colorFn:v=>!v?'':(v<=116?'sc-cell-good':v<=116*1.3?'sc-cell-warn':'sc-cell-bad')},
  ];

  const defs=_scView==='weekly'?weeklyDefs:cumDefs;
  const pastWeeks=weeks.filter(w=>w.w>0);
  function _fmtD(iso){if(!iso)return'?';const[y,m,d]=iso.split('-');return`${+m}/${+d}`+(y!=='2026'?`<br><span style="font-size:8px;color:#c07000">${y}</span>`:'')}

  // ── RMR Tier Breakdown ──────────────────────────────────────────────────
  const pricing=sc.pricing||{tier1_price:99,tier2_price:129,tier2_start_week:99};
  const t1p=pricing.tier1_price||99;
  const t2p=pricing.tier2_price||129;
  const t3p=pricing.tier3_price||null;
  const t2sw=pricing.tier2_start_week||99;
  const t3sw=pricing.tier3_start_week||null;
  // Build lookup from real Snowflake tier data (week → {t1,t2,t3})
  const _tierReal={};
  (sc.tier_rmr_by_week||[]).forEach(r=>{_tierReal[r.week]=r;});
  const _hasReal=Object.keys(_tierReal).length>0;

  let _t1=0,_t2=0,_t3=0;
  // Seed from W0 only when no real data (fallback path)
  if(!_hasReal){
    const _w0=weeks.find(w=>w.w===0);
    if(_w0){_t1+=_w0.np||0;let _c0=_w0.canc||0;_t1=Math.max(0,_t1-_c0);}
  }
  const rmrtRows=pastWeeks.map(wk=>{
    if(_tierReal[wk.w]){
      // Use actual prices from Snowflake
      _t1=_tierReal[wk.w].t1||0;
      _t2=_tierReal[wk.w].t2||0;
      _t3=_tierReal[wk.w].t3||0;
    } else {
      // Fallback: week-based tier assignment for future weeks
      const newPs=wk.np||0, canc=wk.canc||0;
      if(t3sw&&wk.w>=t3sw)_t3+=newPs;
      else if(wk.w>=t2sw)_t2+=newPs;
      else _t1+=newPs;
      let c=canc;
      if(t3p){const c3=Math.min(c,_t3);_t3-=c3;c-=c3;}
      const c2=Math.min(c,_t2);_t2-=c2;c-=c2;_t1=Math.max(0,_t1-c);
    }
    const rmr=Math.round(_t1*t1p+_t2*t2p+(t3p?_t3*t3p:0));
    const netPs=_t1+_t2+_t3;
    const totalSpend=wk.cumTs||0;
    const roms=totalSpend>0?((netPs*640)/totalSpend):null;
    return{w:wk.w,isCur:wk.isCur,ds:wk.ds,de:wk.de,t1:_t1,t2:_t2,t3:t3p?_t3:null,rmr,roms};
  });

  let h='';
  // Studio switcher tabs
  h+=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">`;
  (SC.studios||[]).forEach(s=>{
    const active=s.code===sc.code;
    h+=`<button onclick="switchScStudio('${s.code}')" style="font-family:Oswald,sans-serif;font-style:italic;font-size:13px;font-weight:600;text-transform:uppercase;padding:6px 16px;border-radius:4px;border:2px solid ${active?'#00A3E0':'#c0d4df'};background:${active?'#00A3E0':'transparent'};color:${active?'#fff':'#5a7a8a'};cursor:pointer;letter-spacing:.5px">${s.name}</button>`;
  });
  h+=`</div>`;
  // Mini RMR table
  h+=`<div class="chart-card" style="padding:14px 20px;margin-bottom:12px">`;
  h+=`<div style="font-family:Oswald,sans-serif;font-style:italic;font-size:12px;font-weight:600;text-transform:uppercase;color:#5a7a8a;letter-spacing:1px;margin-bottom:10px">`;
  const _tierSubtitle=`Tier 1 $${t1p} → Tier 2 $${t2p} from W${t2sw}`+(t3p&&t3sw?` → Tier 3 $${t3p} from W${t3sw}`:'');
  h+=`RMR Breakdown &nbsp;<span style="font-weight:400;font-size:10px;color:#aabbc8">${_tierSubtitle}</span></div>`;
  // Target column values — read from NSO Config sheet via pricing block, fallback to calculation
  const _t1tgt=pricing.tier1_members_target||(()=>{
    const _reqPs=tgt.presales_count&&sc.go_week?tgt.presales_count/sc.go_week:0;
    return t2sw>1?Math.round(_reqPs*(t2sw-1)):0;
  })();
  let _t2tgt,_t3tgt=0;
  if(pricing.tier2_members_target!=null){
    _t2tgt=pricing.tier2_members_target;
    _t3tgt=pricing.tier3_members_target||0;
  } else if(t3sw&&t3p){
    const _reqPs=tgt.presales_count&&sc.go_week?tgt.presales_count/sc.go_week:0;
    _t2tgt=Math.round(_reqPs*(t3sw-t2sw));
    _t3tgt=Math.max(0,Math.round(tgt.presales_count||0)-_t1tgt-_t2tgt);
  } else {
    const _reqPs=tgt.presales_count&&sc.go_week?tgt.presales_count/sc.go_week:0;
    _t2tgt=Math.max(0,Math.round(tgt.presales_count||0)-_t1tgt);
  }
  const _totalMembersTgt=_t1tgt+_t2tgt+_t3tgt;
  const _rmrTgt=tgt.estimated_day1_rmr||null;
  const _romsTgt=pricing.estimated_roms_target||null;

  h+=`<div id="scRmrScrollWrap" style="overflow-x:auto"><table class="data-table" style="font-size:12px"><thead><tr>`;
  h+=`<th style="min-width:200px;font-size:12px;position:sticky;left:0;z-index:3;background:#fff">KPI</th>`;
  h+=`<th class="num" style="min-width:80px;font-size:11px;background:#f8f4ec;color:#b8860b;position:sticky;left:200px;z-index:3">Target</th>`;
  rmrtRows.forEach(wk=>{
    const ds=wk.ds?`<br><span style="font-size:9px;font-weight:400;color:#5a7a8a;white-space:nowrap">${_fmtD(wk.ds)}</span><br><span style="font-size:9px;font-weight:400;color:#5a7a8a;white-space:nowrap">${_fmtD(wk.de)}</span>`:'';
    const tierB=wk.w===t2sw?`<br><span style="font-size:7px;background:#27ae60;color:#fff;border-radius:2px;padding:1px 3px;display:inline-block;margin-top:2px">→$${t2p}</span>`:wk.w===t3sw?`<br><span style="font-size:7px;background:#8e44ad;color:#fff;border-radius:2px;padding:1px 3px;display:inline-block;margin-top:2px">→$${t3p}</span>`:'';
    h+=`<th class="num${wk.isCur?' sc-cell-cur':''}" style="min-width:80px;font-size:11px">W${wk.w}${ds}${tierB}</th>`;
  });
  h+=`</tr></thead><tbody>`;
  const rmrRows2=[
    {label:`Tier 1 Members ($${t1p})`,key:'t1',target:_t1tgt},
    {label:`Tier 2 Members ($${t2p})`,key:'t2',target:_t2tgt},
    ...(t3p?[{label:`Tier 3 Members ($${t3p})`,key:'t3',target:_t3tgt}]:[]),
    {label:'Total Members',key:null,computed:wk=>(wk.t1||0)+(wk.t2||0)+(wk.t3||0),target:_totalMembersTgt,style:'font-weight:700;border-top:1px solid #e0ecf4'},
    {label:'Est. Day 1 RMR',key:'rmr',fmt:v=>`$${v.toLocaleString('en-US')}`,target:_rmrTgt,tgtFmt:v=>`$${Math.round(v).toLocaleString('en-US')}`,style:'border-top:1px solid #e0ecf4'},
    {label:'Est. ROMS',sublabel:'(Presales × $640 LTV) ÷ Mktg Spend',key:'roms',fmt:v=>v.toFixed(1)+'x',target:_romsTgt,tgtFmt:v=>typeof v==='string'?v:(+v).toFixed(1)+'x'},
  ];
  rmrRows2.forEach(row=>{
    const labelCell=row.sublabel
      ?`<div style="font-size:12px;font-weight:600">${row.label}</div><div style="font-size:9px;color:#aabbc8;margin-top:1px">${row.sublabel}</div>`
      :`${row.label}`;
    const _rowStyle=row.style?`font-size:12px;font-weight:600;${row.style}`:'font-size:12px;font-weight:600';
    h+=`<tr><td style="${_rowStyle};position:sticky;left:0;z-index:1;background:#fff">${labelCell}</td>`;
    const tgtFmt=row.tgtFmt||(row.fmt||(v=>v));
    const tgtVal=row.target;
    h+=`<td class="num" style="background:#f8f4ec;color:#b8860b;font-weight:600;position:sticky;left:200px;z-index:1${row.style?';'+row.style:''}">${tgtVal!=null?tgtFmt(tgtVal):'—'}</td>`;
    rmrtRows.forEach(wk=>{
      const v=row.computed?row.computed(wk):(row.key!=null?wk[row.key]:null);
      const fmt=row.fmt||(v=>v);
      h+=`<td class="num${wk.isCur?' sc-cell-cur':''}" style="${row.style||''}">${v!=null?fmt(v):'—'}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div></div>`;

  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">`;
  h+=`<div style="font-family:Oswald,sans-serif;font-style:italic;font-size:13px;color:#8aaabb;font-weight:500;text-transform:uppercase">${sc.full_name.replace('SWEAT440 ','')} — W${cw} current</div>`;
  h+=`<div class="gran-group"><button class="gran-btn${_scView==='weekly'?' active':''}" id="scWeeklyBtn" onclick="setScView('weekly')">Weekly</button><button class="gran-btn${_scView==='cum'?' active':''}" id="scCumBtn" onclick="setScView('cum')">Cumulative</button></div>`;
  h+=`</div>`;

  h+=`<div class="chart-card" style="padding:20px 24px"><div id="scScrollWrap" style="overflow-x:auto"><table class="data-table sc-table" style="font-size:13px"><thead><tr>`;
  h+=`<th style="min-width:200px;font-size:13px;position:sticky;left:0;z-index:3;background:#fff">KPI</th>`;
  h+=`<th class="num" style="background:#f8f4ec;color:#b8860b;min-width:70px;position:sticky;left:200px;z-index:3">${_scView==='weekly'?'Req/Wk':'Target'}</th>`;
  pastWeeks.forEach(wk=>{
    const dateSpan=wk.ds?`<span style="font-size:9px;font-weight:400;color:#5a7a8a;white-space:nowrap">${_fmtD(wk.ds)}</span><br><span style="font-size:9px;font-weight:400;color:#5a7a8a;white-space:nowrap">${_fmtD(wk.de)}</span>`:`<span style="font-size:9px;font-weight:400;color:#8aaabb">${(wk.date||'').slice(0,9)}</span>`;
    const tierBadge=wk.w===t2sw?`<br><span style="font-size:7px;background:#27ae60;color:#fff;border-radius:2px;padding:1px 3px;display:inline-block;margin-top:2px">→$${t2p}</span>`:wk.w===t3sw?`<br><span style="font-size:7px;background:#8e44ad;color:#fff;border-radius:2px;padding:1px 3px;display:inline-block;margin-top:2px">→$${t3p}</span>`:'';
    h+=`<th class="num${wk.isCur?' sc-cell-cur':''}" style="min-width:90px;font-size:13px">W${wk.w}<br>${dateSpan}${tierBadge}</th>`;
  });
  h+=`</tr></thead><tbody>`;

  defs.forEach(row=>{
    const isParent=row.spendParent;
    const isSubParent=row.spendSubParent;
    const isSub=row.spendSub&&!row.spendSubParent;
    const isSubSub=row.spendSubSub;
    let trClass='', trStyle='', tdStyle='font-size:13px;font-weight:600', trClick='', labelHtml=row.label;
    if(isParent){
      trClick=` onclick="toggleScSpend()" style="cursor:pointer"`;
      labelHtml=`<span id="sc-spend-icon" style="margin-right:6px;font-size:10px">▶</span>${row.label.replace('▶ ','')}`;
    } else if(isSubParent){
      trClass='sc-spend-sub'; trStyle='display:none';
      tdStyle='padding-left:20px;font-size:12px;font-weight:600';
      trClick=` onclick="toggleScDigital()" style="cursor:pointer"`;
      labelHtml=`<span id="sc-digital-icon" style="margin-right:6px;font-size:10px">▶</span>${row.label.replace('▶ ','')}`;
    } else if(isSub){
      trClass='sc-spend-sub'; trStyle='display:none';
      tdStyle='padding-left:20px;font-size:12px;color:#7a7a9a';
    } else if(isSubSub){
      trClass='sc-digital-sub'; trStyle='display:none';
      tdStyle='padding-left:40px;font-size:12px;color:#7a7a9a';
    }
    h+=`<tr class="${trClass}" style="${trStyle}"${trClick}>`;
    h+=`<td style="${tdStyle};position:sticky;left:0;z-index:1;background:#fff">${labelHtml}</td>`;
    const _reqCellVal=row.reqLabel!=null?row.reqLabel
      :(_scView==='weekly'
        ?(row.req!=null?row.fmt(row.req):'-')
        :(row.cumReqDisplay!=null?row.fmt(row.cumReqDisplay):'—'));
    h+=`<td class="num" style="background:#f8f4ec;color:#b8860b;font-size:13px;position:sticky;left:200px;z-index:1">${_reqCellVal}</td>`;
    pastWeeks.forEach(wk=>{
      const val=row.computed?row.computed(wk):(row.key!=null?wk[row.key]:null);
      const isCur=wk.isCur;
      let cls=isCur?'sc-cell-cur':'';
      const wkReq=_scView==='cum'&&row.cumReqFn?row.cumReqFn(wk):row.req;
      if(row.colorFn&&typeof val==='number'){
        const _c=row.colorFn(val); if(_c)cls=_c;
      } else if(row.color&&wkReq!=null&&typeof val==='number'){
        if(val>=wkReq)cls='sc-cell-good';
        else if(val>=wkReq*.7)cls='sc-cell-warn';
        else if(wk.w>0&&val>0)cls='sc-cell-bad';
      }
      h+=`<td class="num ${cls}" style="font-size:${isSub?12:13}px">${row.fmt(val)}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div></div>`;

  el.innerHTML=h;
  const scWrap=document.getElementById('scScrollWrap');
  if(scWrap)scWrap.scrollLeft=scWrap.scrollWidth;
  const scRmrWrap=document.getElementById('scRmrScrollWrap');
  if(scRmrWrap)scRmrWrap.scrollLeft=scRmrWrap.scrollWidth;
}

function drawScCumChart(sc,weeks){
  const ctx=document.getElementById('scCumChart');if(!ctx)return;
  if(_ch.scCum){_ch.scCum.destroy();_ch.scCum=null;}
  const go=sc.go_week||27;
  const allW=Array.from({length:go+1},(_,i)=>i);
  const labels=allW.map(i=>`W${i}`);
  const actual=allW.map(i=>{const w=weeks.find(x=>x.w===i);return(w&&w.pc)?w.pc:null;});
  const t300=allW.map((_,i)=>i<=12?Math.round(300/12*i):null);
  const t440_16=allW.map((_,i)=>i<=16?Math.round(440/16*i):null);
  const t440_go=allW.map((_,i)=>+(440/go*i).toFixed(1));
  _ch.scCum=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'Actual Presales',data:actual,borderColor:'#5b9bd5',borderWidth:2.5,pointRadius:3,pointHoverRadius:6,tension:.3,fill:false,spanGaps:false},

  };

}

const _C2S={'UT-001':'SWEAT440 Herriman','TX-003':'SWEAT440 Dallas - Prestonwood','FL-019':'SWEAT440 Naples - Mercato','FL-017':'SWEAT440 Pinecrest - Palmetto Bay','VA-001':'SWEAT440 Reston'};
const _SOC_SORTS={fb:{col:-1,dir:'desc'},ig:{col:-1,dir:'desc'}};

function _socSortHdr(text,key,colIdx,sortable=true){
  if(!sortable)return`<div class="soc-cell">${text}</div>`;
  const st=_SOC_SORTS[key];const sorted=st.col===colIdx;
  const arr=sorted?(st.dir==='desc'?' ▼':' ▲'):'';
  return`<div class="soc-cell${sorted?' sorted':''}" onclick="_socSort('${key}',${colIdx})">${text}${arr}</div>`;
}
function _socSort(key,colIdx){
  const st=_SOC_SORTS[key];
  if(st.col===colIdx)st.dir=st.dir==='desc'?'asc':'desc';else{st.col=colIdx;st.dir='desc';}
  if(key==='fb')renderFacebook();else renderInstagram();
}
function _scCls(key,col){return _SOC_SORTS[key].col===col?'sc':'';}

    const ST=_SOC_SORTS.ig;
    const KEYS=['date','caption','media_type','likes','comments','shares','reach','engagement','engagement_rate'];
    const NUM=[3,4,5,6,7,8];
    let sorted=[...allPosts];
    if(ST.col>=0){const k=KEYS[ST.col];const isN=NUM.includes(ST.col);sorted.sort((a,b)=>{let va=isN?(parseFloat(a[k])||0):String(a[k]||'').toLowerCase();let vb=isN?(parseFloat(b[k])||0):String(b[k]||'').toLowerCase();return(va<vb?-1:va>vb?1:0)*(ST.dir==='asc'?1:-1)});}

    h+=`<div class="chart-card"><div class="chart-card-title">Best Performing Posts <span style="font-size:11px;color:#8aaabb;font-style:normal;font-weight:400">(click column header to sort)</span></div>`;
    h+=`<div style="overflow-x:auto"><div style="min-width:860px">`;
    h+=`<div class="soc-row soc-th soc-ig">${_socSortHdr('Date','ig',0)}<div class="soc-cell"></div>${_socSortHdr('Post','ig',1)}${_socSortHdr('Type','ig',2)}${_socSortHdr('Likes','ig',3)}${_socSortHdr('Comments','ig',4)}${_socSortHdr('Shares','ig',5)}${_socSortHdr('Reach','ig',6)}${_socSortHdr('Eng.','ig',7)}${_socSortHdr('ER%','ig',8)}</div>`;
    sorted.slice(0,30).forEach(p=>{
      const isVid=p.media_type==='VIDEO'||p.media_type==='REELS';

        :`<div class="soc-thumb-ph">📷</div>`;
      const caption=p.permalink?`<a href="${p.permalink}" target="_blank" rel="noopener">${(p.caption||'').slice(0,80)||'(no caption)'}</a>`:((p.caption||'').slice(0,80)||'(no caption)');
      const typeLabel=p.media_type==='CAROUSEL_ALBUM'?'CAROUSEL':(p.media_type||'—');
      const er=p.engagement_rate!=null?p.engagement_rate.toFixed(2)+'%':'—';
      h+=`<div class="soc-row soc-ig">
        <div class="soc-cell soc-date ${_scCls('ig',0)}">${fmDay(p.date)}</div>
        <div class="soc-cell">${img}</div>
        <div class="soc-caption soc-cell ${_scCls('ig',1)}">${caption}</div>
        <div class="soc-cell ${_scCls('ig',2)}">${typeLabel}</div>
        <div class="soc-cell ${_scCls('ig',3)}">${(p.likes||0).toLocaleString('en-US')}</div>
        <div class="soc-cell ${_scCls('ig',4)}">${(p.comments||0).toLocaleString('en-US')}</div>
        <div class="soc-cell ${_scCls('ig',5)}">${(p.shares||0).toLocaleString('en-US')}</div>
        <div class="soc-cell ${_scCls('ig',6)}">${(p.reach||0).toLocaleString('en-US')}</div>

        <div class="soc-cell ${_scCls('ig',8)}">${er}</div>
      </div>`;
    });
    h+=`</div></div></div>`;
  }

  el.innerHTML=h;

    const _nsoShort=['Dallas - Prestonwood','Herriman','Naples - Mercato','Pinecrest - Palmetto Bay','Reston'];
    function _normStudio(arr){return arr.map(r=>_nsoShort.includes(r.studio)?{...r,studio:'SWEAT440 '+r.studio}:r)}
    RAW.daily_detail=_normStudio(RAW.daily_detail);RAW.monthly_detail=_normStudio(RAW.monthly_detail);}
  else{console.error('data.json failed');RAW={daily_detail:[],monthly_detail:[],sources:[],studios:[]}}

  if(scRes.status==='fulfilled'){SC=scRes.value}
  else{console.warn('nso_scorecard_data.json not found');SC={studios:[]};document.getElementById('summaryContent').innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">Scorecard data not yet available for NSO studios.</div>'}

  else{console.warn('nso_google_ads.json not found');GOOGLE_RAW=[]}

  if(socialRes.status==='fulfilled'){SOCIAL_RAW=socialRes.value}
  else{console.warn('social_insights.json not found');SOCIAL_RAW={facebook:[],instagram:[]}}

  if(salesRes.status==='fulfilled'){
    NSO_SALES=salesRes.value;
    NSO_SALES_ROWS=[];
    Object.values(NSO_SALES.studios||{}).forEach(s=>{
      (s.daily||[]).forEach(r=>{
        NSO_SALES_ROWS.push({date:r.date,studio:s.name,source:r.source||'Unknown',first_sales:r.presales||0,cancellations:r.cancellations||0,gross_revenue:r.gross_revenue||0});
      });

  if(gbpRes.status==='fulfilled'){GBP_RAW=gbpRes.value}
  else{console.warn('gbp_data.json not found');GBP_RAW=null}

  // Build multi-selects
  _buildMS('studioMenu','studioLabel',NSO,[]);
  // Canonical source list from MARKETING_REPORTS.PUBLIC.LEADS_LIST
  const _allSrc=['Meta Ads','Google Ads','Local Listings','Social Media Organic','Website (unattributed)','Word of Mouth','SWEAT440 App','MindBody App','ClassPass / Platforms','Grassroots','Business Mode','Print Ads / Signs','Other','N/A'];
  _buildMS('sourceMenu','sourceLabel',_allSrc,EXCL_SRC);

  // Fallback dates
  const nsoRows=[...(RAW.daily_detail||[]),...(RAW.monthly_detail||[])].filter(r=>NSO.includes(r.studio));
  const allKeys=nsoRows.map(r=>r.date||r.month).filter(Boolean).sort();
  if(allKeys.length){const lk=allKeys[allKeys.length-1].slice(0,7);const df=document.getElementById('fFrom').value.slice(0,7);const has=allKeys.some(k=>k>=df+'-01'&&k<=df+'-31');if(!has){const ld=new Date(lk+'-01T00:00:00Z');document.getElementById('fFrom').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth(),1)).toISOString().slice(0,10);document.getElementById('fTo').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth()+1,0)).toISOString().slice(0,10)}}

  renderSummary();
  applyFilters();
}
init();
</script>
