name: Refresh 2 Weeks for $40 Campaign Data

on:
  schedule:
    - cron: "30 10 * * *"   # 6:30 AM ET (EDT=UTC-4) — runs after all other dashboards
  workflow_dispatch:
    inputs:
      start:
        description: 'Override start date (YYYY-MM-DD). Leave blank for campaign default (2026-08-25).'
        required: false
        default: ''
      end:
        description: 'Override end date (YYYY-MM-DD). Leave blank for 2 days ago.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install snowflake-connector-python requests python-dotenv

      - name: Set date variables
        run: |
          END="${{ github.event.inputs.end }}"
          if [ -z "$END" ]; then
            END=$(date -u -d '2 days ago' +%Y-%m-%d)
          fi
          echo "END_DATE=$END" >> $GITHUB_ENV

          START="${{ github.event.inputs.start }}"
          if [ -z "$START" ]; then
            START="2026-08-25"
          fi
          echo "START_DATE=$START" >> $GITHUB_ENV

      - name: Fetch 2 Weeks for $40 data
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
          META_ACCESS_TOKEN:   ${{ secrets.META_TOKEN }}
          META_TOKEN:          ${{ secrets.META_TOKEN }}
        run: |
          python fetch_2weeks_data.py --start $START_DATE --end $END_DATE

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add campaign-dashboard/2weeks_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(campaign): refresh 2weeks data $END_DATE"
            git pull --rebase origin main
            git push
          fi
