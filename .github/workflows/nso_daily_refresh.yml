name: NSO Dashboard Daily Refresh

on:
  schedule:
    - cron: '0 12 * * *'   # 4:00 AM PT (after main refresh.yml at 11:00 UTC)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r nso-dashboard/requirements.txt

      - name: Set date variables
        run: |
          echo "TODAY=$(date -u +%Y-%m-%d)"                          >> $GITHUB_ENV
          echo "YESTERDAY=$(date -u -d '1 day ago' +%Y-%m-%d)"       >> $GITHUB_ENV
          echo "THREE_DAYS_AGO=$(date -u -d '3 days ago' +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Write Google service account credentials
        run: |
          mkdir -p nso-dashboard/credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      # ── NSO SALES ──────────────────────────────────────────────────────────
      - name: Refresh NSO Sales
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/fetch_nso_sales.py \
            --start $THREE_DAYS_AGO \
            --end   $TODAY \
            --output nso-dashboard/nso_sales_new.json
          python nso-dashboard/scripts/merge_nso_sales.py \
            --existing nso-dashboard/nso_sales_data.json \
            --new      nso-dashboard/nso_sales_new.json
          rm -f nso-dashboard/nso_sales_new.json
        continue-on-error: true

      # ── GBP ────────────────────────────────────────────────────────────────
      - name: Refresh Google Business Profile
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          python nso-dashboard/scripts/fetch_gbp.py \
            --start $THREE_DAYS_AGO \
            --end   $TODAY \
            --output nso-dashboard/gbp_data_new.json
          python nso-dashboard/scripts/merge_gbp.py \
            --existing nso-dashboard/gbp_data.json \
            --new      nso-dashboard/gbp_data_new.json
          rm -f nso-dashboard/gbp_data_new.json
        continue-on-error: true

      # ── META ADS + GA4 + GOOGLE ADS ────────────────────────────────────────
      - name: Refresh Meta Ads / GA4 / Google Ads
        env:
          META_ACCESS_TOKEN:               ${{ secrets.META_TOKEN }}
          META_APP_ID:                     ${{ secrets.META_APP_ID }}
          META_APP_SECRET:                 ${{ secrets.META_APP_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN:      ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:            ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:        ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:        ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID:    ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: nso-dashboard/credentials/service_account.json
          GA4_PROPERTY_ID:                 ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python nso-dashboard/scripts/fetch_all_marketing.py \
            --source all \
            --start $THREE_DAYS_AGO \
            --end   $TODAY \
            --output nso-dashboard/marketing_all_new.json

          python nso-dashboard/scripts/merge_array_json.py \
            --existing nso-dashboard/marketing_data.json \
            --new      nso-dashboard/marketing_all_new.json \
            --keys     meta_ads ga4_traffic ga4_page_views ga4_conversions

          python nso-dashboard/scripts/merge_array_json.py \
            --existing nso-dashboard/nso_google_ads.json \
            --new      nso-dashboard/marketing_all_new.json \
            --keys     google_ads

          rm -f nso-dashboard/marketing_all_new.json
        continue-on-error: true

      # ── SOCIAL INSIGHTS ────────────────────────────────────────────────────
      - name: Refresh Social Insights (Facebook + Instagram)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_TOKEN }}
          META_APP_ID:       ${{ secrets.META_APP_ID }}
          META_APP_SECRET:   ${{ secrets.META_APP_SECRET }}
        run: |
          python nso-dashboard/scripts/fetch_social_insights.py \
            --days 7 \
            --output nso-dashboard/social_insights.json
        continue-on-error: true

      # ── SCORECARD ──────────────────────────────────────────────────────────
      - name: Rebuild Scorecard
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: nso-dashboard/credentials/service_account.json
        run: |
          cd nso-dashboard && python scripts/build_all_scorecards.py
        continue-on-error: true

      # ── MILESTONES + PRICING FROM NSO CONFIG SHEET ────────────────────────
      - name: Apply pricing, milestones and tier targets from NSO Config sheet
        run: |
          cd nso-dashboard && python scripts/fetch_sheet_milestones.py
        continue-on-error: true

      # ── RESTON HISTORICAL DATA FROM SHEET ─────────────────────────────────
      - name: Patch Reston early weeks from Google Sheet
        run: |
          cd nso-dashboard && python scripts/patch_reston_early_weeks.py
        continue-on-error: true

      # ── TIER RMR (real prices from Snowflake) ──────────────────────────────
      - name: Calculate tier RMR from actual prices
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          cd nso-dashboard && python scripts/fetch_tier_rmr.py
        continue-on-error: true

      # ── COMMIT ─────────────────────────────────────────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            nso-dashboard/nso_sales_data.json \
            nso-dashboard/gbp_data.json \
            nso-dashboard/marketing_data.json \
            nso-dashboard/nso_google_ads.json \
            nso-dashboard/social_insights.json \
            nso-dashboard/nso_scorecard_data.json
          git diff --cached --quiet || \
            git commit -m "chore: nso daily refresh $TODAY"
          git push
