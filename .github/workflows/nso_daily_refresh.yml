name: NSO Dashboard Daily Refresh

on:
  schedule:
    - cron: '10 8 * * *'    # 4:10 AM Eastern (10 min after general refresh, to avoid git push collisions)
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      marketing_start:
        description: 'Override Meta/Google start date (YYYY-MM-DD). Leave blank for default 14-day lookback.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r nso-dashboard/requirements.txt

      - name: Set date variables
        run: |
          echo "YESTERDAY=$(date -u -d '1 day ago' +%Y-%m-%d)"           >> $GITHUB_ENV
          echo "TWO_DAYS_AGO=$(date -u -d '2 days ago' +%Y-%m-%d)"       >> $GITHUB_ENV
          echo "FOURTEEN_DAYS_AGO=$(date -u -d '14 days ago' +%Y-%m-%d)" >> $GITHUB_ENV
          # workflow_dispatch override: use custom start if provided, else 14-day lookback
          if [ -n "${{ github.event.inputs.marketing_start }}" ]; then
            echo "MARKETING_START=${{ github.event.inputs.marketing_start }}" >> $GITHUB_ENV
          else
            echo "MARKETING_START=$(date -u -d '14 days ago' +%Y-%m-%d)" >> $GITHUB_ENV
          fi

      - name: Write Google service account credentials
        run: |
          mkdir -p nso-dashboard/credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      # ── NSO SALES ──────────────────────────────────────────────────────────
      - name: Refresh NSO Sales (full scan)
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/fetch_nso_sales.py \
            --end $TWO_DAYS_AGO \
            --output nso-dashboard/nso_sales_data.json
        continue-on-error: true

      - name: Refresh Client History
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/fetch_client_history.py \
            --output nso-dashboard/nso_client_history.json
        continue-on-error: true

      # ── META ADS + GA4 + GOOGLE ADS ────────────────────────────────────────
      # Default: 14-day lookback (MARKETING_START) so Meta's retroactive spend
      # adjustments are captured. On manual dispatch, MARKETING_START can be
      # set to any past date for a one-time historical re-fetch.
      - name: Refresh Meta Ads / GA4 / Google Ads (14-day lookback)
        env:
          META_ACCESS_TOKEN:              ${{ secrets.META_TOKEN }}
          META_APP_ID:                    ${{ secrets.META_APP_ID }}
          META_APP_SECRET:                ${{ secrets.META_APP_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN:     ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:           ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:       ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:       ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_MCC_ID:              "6055462417"
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: nso-dashboard/credentials/service_account.json
        run: |
          python nso-dashboard/scripts/fetch_all_marketing.py \
            --start $MARKETING_START \
            --end   $YESTERDAY \
            --output nso-dashboard/marketing_all_new.json \
            --ad-meta-output nso-dashboard/nso_ad_meta.json
          python nso-dashboard/scripts/merge_array_json.py \
            --existing nso-dashboard/marketing_data.json \
            --new      nso-dashboard/marketing_all_new.json \
            --keys     meta_ads ga4_traffic
          python nso-dashboard/scripts/merge_array_json.py \
            --existing nso-dashboard/nso_google_ads.json \
            --new      nso-dashboard/marketing_all_new.json \
            --keys     google_ads
          rm -f nso-dashboard/marketing_all_new.json
        continue-on-error: true

      - name: Sync NSO ad thumbnails/videos to Drive
        env:
          META_ACCESS_TOKEN:               ${{ secrets.META_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: nso-dashboard/credentials/service_account.json
        run: python sync_ad_media.py --dashboard nso --max-new-images 300 --max-new-videos 200
        continue-on-error: true

      # ── SCORECARD ──────────────────────────────────────────────────────────
      - name: Rebuild Scorecard
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/build_all_scorecards.py
        continue-on-error: true

      # ── RESTON HISTORICAL DATA FROM SHEET ──────────────────────────────────
      # Must run BEFORE fetch_sheet_milestones so the static weeks (W0-W29)
      # are in place before the sheet patches grassroots/other spend on them.
      - name: Patch Reston early weeks from Google Sheet
        run: |
          cd nso-dashboard && python scripts/patch_reston_early_weeks.py
        continue-on-error: true

      # ── MILESTONES + PRICING + TARGETS FROM NSO CONFIG SHEET ───────────────
      - name: Apply pricing, milestones, targets and dates from NSO Config sheet
        run: |
          cd nso-dashboard && python scripts/fetch_sheet_milestones.py
        continue-on-error: true

      # ── GBP (Google Business Profile) ─────────────────────────────────────
      # gbp_data.json is managed by refresh.yml (Open Studio workflow) which
      # fetches the full historical range (--start 2025-01-01) daily.
      # Do NOT fetch GBP here — a 2-day window would overwrite the historical
      # file with zeros (GBP API has 3-4 day lag) and lose all past data.

      # ── TIER RMR (real prices from Snowflake) ───────────────────────────────
      - name: Calculate tier RMR from actual prices
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          cd nso-dashboard && python scripts/fetch_tier_rmr.py
        continue-on-error: true

      # ── COMMIT ─────────────────────────────────────────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            nso-dashboard/nso_sales_data.json \
            nso-dashboard/marketing_data.json \
            nso-dashboard/nso_google_ads.json \
            nso-dashboard/nso_scorecard_data.json \
            nso-dashboard/nso_ad_meta.json \
            nso-dashboard/nso_client_history.json
          git add nso-dashboard/nso_media_cache.json 2>/dev/null || true
          find nso-dashboard/thumbnails -type f 2>/dev/null | grep -q . && \
            git add nso-dashboard/thumbnails/ || true
          git diff --cached --quiet || \
            git commit -m "chore: nso daily refresh $YESTERDAY"
          git pull --rebase origin main
          git push
