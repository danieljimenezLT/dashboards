name: Refresh Paid Ads data

on:
  schedule:
    # 8:05 UTC = 4:05 AM EDT / 3:05 AM EST. Corre diario.
    # Corre unos minutos DESPUÉS de refresh.yml para no pisarlo en el git push.
    - cron: "5 8 * * *"
  workflow_dispatch: {}        # permite correrlo manual desde la UI
  push:
    branches: [main]
    paths:
      - "paid-ads-dashboards/fetch_paid_ads.py"
      - "paid-ads-dashboards/meta_client.py"
      - "paid-ads-dashboards/config.yaml"
      - "paid-ads-dashboards/analyze_ads.py"
      - ".github/workflows/refresh-paid-ads.yml"

permissions:
  contents: write               # para poder hacer commit del JSON

concurrency:
  group: refresh-paid-ads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: paid-ads-dashboards/requirements-paid-ads.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r paid-ads-dashboards/requirements-paid-ads.txt

      - name: Run ETL (Meta → paid-ads-dashboards/paid-ads-data.json + daniel-paid-ads-data.json)
        env:
          # Usa META_ACCESS_TOKEN (mismo token que NSO dashboard — siempre actualizado).
          # meta_client.py lo acepta como META_TOKEN o META_ACCESS_TOKEN.
          META_TOKEN:        ${{ secrets.META_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_TOKEN }}
          META_API_VERSION:  ${{ secrets.META_API_VERSION }}
        run: |
          cd paid-ads-dashboards
          python fetch_paid_ads.py
          # Merge fresh data into daniel-paid-ads-data.json (preserva campaigns en cache)
          python merge_data.py
          # También mantener copia en root para otros dashboards (index.html, etc.)
          cp paid-ads-data.json ../paid-ads-data.json

      - name: Run AI Analysis (paid-ads-analysis.json)
        continue-on-error: true        # si falla, el ETL data igual se commitea
        run: |
          cd paid-ads-dashboards
          python analyze_ads.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paid-ads-dashboards/paid-ads-data.json paid-ads-dashboards/daniel-paid-ads-data.json \
                  paid-ads-dashboards/paid-ads-analysis.json paid-ads-data.json
          if git diff --cached --quiet; then
            echo "No changes in data files"
          else
            git commit -m "chore(paid-ads): refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
