name: Refresh Snowflake Data

on:
  schedule:
    - cron: "0 6 * * *"   # Primary:  2:00 AM ET — main daily run
    - cron: "0 8 * * *"   # Fallback: 4:00 AM ET — retries if primary was delayed (skips if data already fresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Check data freshness (skip if already updated today)
        id: freshness
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          try:
              d = json.load(open('data.json'))
              ts = d.get('generated_at', '')
              dt = datetime.fromisoformat(ts.replace('Z', '+00:00'))
              age_h = (datetime.now(timezone.utc) - dt).total_seconds() / 3600
              print(f'data.json age: {age_h:.1f}h')
              if age_h < 2:
                  print('Data is fresh — skipping refresh')
                  print('skip=true')
              else:
                  print('Data is stale — running refresh')
                  print('skip=false')
          except Exception as e:
              print(f'Could not read data.json ({e}) — running refresh')
              print('skip=false')
          " | tee /tmp/freshness_out.txt
          grep '^skip=' /tmp/freshness_out.txt >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: |
          pip install snowflake-connector-python
          pip install -r nso-dashboard/requirements.txt

      - name: Set date variables
        if: steps.freshness.outputs.skip != 'true'
        run: |
          echo "YESTERDAY=$(date -u -d '1 day ago' +%Y-%m-%d)"     >> $GITHUB_ENV
          echo "TWO_DAYS_AGO=$(date -u -d '2 days ago' +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Write Google service account credentials
        if: steps.freshness.outputs.skip != 'true'
        run: |
          mkdir -p nso-dashboard/credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      # ── OPEN STUDIO DASHBOARD ─────────────────────────────────────────────
      - name: Refresh Open Studio data (Snowflake → data.json)
        if: steps.freshness.outputs.skip != 'true'
        env:
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USER:      ${{ secrets.SF_USER }}
          SF_TOKEN:     ${{ secrets.SF_TOKEN }}
          SF_ROLE:      ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:  ${{ secrets.SF_DATABASE }}
          SF_SCHEMA:    ${{ secrets.SF_SCHEMA }}
        run: python fetch_data.py

      # ── NSO DASHBOARD ─────────────────────────────────────────────────────
      - name: Refresh NSO Sales (Snowflake → nso_sales_data.json)
        if: steps.freshness.outputs.skip != 'true'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/fetch_nso_sales.py \
            --end $TWO_DAYS_AGO \
            --output nso-dashboard/nso_sales_data.json
        continue-on-error: true

      - name: Rebuild Scorecards (Snowflake → nso_scorecard_data.json)
        if: steps.freshness.outputs.skip != 'true'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: python nso-dashboard/scripts/build_all_scorecards.py
        continue-on-error: true

      - name: Calculate tier RMR (Snowflake → patches scorecard)
        if: steps.freshness.outputs.skip != 'true'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: cd nso-dashboard && python scripts/fetch_tier_rmr.py
        continue-on-error: true

      - name: Patch Reston early weeks from Google Sheet
        if: steps.freshness.outputs.skip != 'true'
        run: cd nso-dashboard && python scripts/patch_reston_early_weeks.py
        continue-on-error: true

      - name: Build pre-launch weekly lead & events buckets
        if: steps.freshness.outputs.skip != 'true'
        run: cd nso-dashboard && python scripts/fetch_pre_weeks.py
        continue-on-error: true

      - name: Apply pricing, milestones, targets and dates from NSO Config sheet
        if: steps.freshness.outputs.skip != 'true'
        run: cd nso-dashboard && python scripts/fetch_sheet_milestones.py
        continue-on-error: true

      - name: Rebuild Scorecard v2
        if: steps.freshness.outputs.skip != 'true'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: cd nso-dashboard && python scripts/build_scorecard_v2.py
        continue-on-error: true

      - name: Calculate tier RMR v2
        if: steps.freshness.outputs.skip != 'true'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: cd nso-dashboard && python scripts/fetch_tier_rmr_v2.py
        continue-on-error: true

      # ── COMMIT ────────────────────────────────────────────────────────────
      - name: Commit updated data files
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add nso-dashboard/nso_sales_data.json
          git add nso-dashboard/nso_scorecard_data.json
          git add nso-dashboard/nso_scorecard_data2.json
          git add nso-dashboard/nso_pre_weeks_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh snowflake data $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push after 5 attempts due to repeated conflicts"
          exit 1
