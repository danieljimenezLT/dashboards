name: Refresh Snowflake Data

on:
  schedule:
    - cron: "0 7 * * *"   # 3:00 AM Eastern (EDT=UTC-4; drifts to 2:00 AM during EST/winter) — runs 1hr before "Refresh Dashboard Data"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install snowflake-connector-python
          pip install -r nso-dashboard/requirements.txt

      - name: Set date variables
        run: |
          echo "YESTERDAY=$(date -u -d '1 day ago' +%Y-%m-%d)"     >> $GITHUB_ENV
          echo "TWO_DAYS_AGO=$(date -u -d '2 days ago' +%Y-%m-%d)" >> $GITHUB_ENV

      # ── OPEN STUDIO DASHBOARD ─────────────────────────────────────────────
      - name: Refresh Open Studio data (Snowflake → data.json)
        env:
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USER:      ${{ secrets.SF_USER }}
          SF_TOKEN:     ${{ secrets.SF_TOKEN }}
          SF_ROLE:      ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE:  ${{ secrets.SF_DATABASE }}
          SF_SCHEMA:    ${{ secrets.SF_SCHEMA }}
        run: python fetch_data.py

      # ── NSO DASHBOARD ─────────────────────────────────────────────────────
      - name: Refresh NSO Sales (Snowflake → nso_sales_data.json)
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: |
          python nso-dashboard/scripts/fetch_nso_sales.py \
            --end $TWO_DAYS_AGO \
            --output nso-dashboard/nso_sales_data.json
        continue-on-error: true

      - name: Rebuild Scorecards (Snowflake → nso_scorecard_data.json)
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: python nso-dashboard/scripts/build_all_scorecards.py
        continue-on-error: true

      - name: Calculate tier RMR (Snowflake → patches scorecard)
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SF_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SF_TOKEN }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_ROLE:      ${{ secrets.SF_ROLE }}
        run: cd nso-dashboard && python scripts/fetch_tier_rmr.py
        continue-on-error: true

      # ── COMMIT ────────────────────────────────────────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add nso-dashboard/nso_sales_data.json
          git add nso-dashboard/nso_scorecard_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh snowflake data $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push after 5 attempts due to repeated conflicts"
          exit 1
