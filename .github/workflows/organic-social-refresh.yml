name: Organic Social — Monthly Refresh

# HQ @sweat440 organic Instagram data for organic-social/index.html: per-post
# insights, monthly account totals, follower demographics. Manual only — run
# it from the Actions tab once a month when the report is built (the 5th).
# Stories counts and studio-started collabs come from
# nso-dashboard/social_insights.json, which the studio Instagram fetch keeps
# up to date, so nothing here needs to run daily.

on:
  workflow_dispatch:
    inputs:
      refresh_days:
        description: 'Re-pull insights for posts this many days old or newer (default 60; 700 re-pulls all history)'
        required: false
        default: '60'

permissions:
  contents: write

concurrency:
  group: organic-social-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r nso-dashboard/requirements.txt

      - name: Write Google service account credentials
        run: |
          mkdir -p nso-dashboard/credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      - name: Fetch HQ organic Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          python organic-social/scripts/fetch_organic_social.py \
            --refresh-days "${{ github.event.inputs.refresh_days || '60' }}"

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add organic-social/organic_social.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh organic social data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
