name: TEMP - Backfill Corporate Spend Monthly

# TEMPORARY workflow, meant to be deleted once run. One-time backfill of
# meta-corporate-spend-monthly.json (see fetch_meta_corporate_spend_monthly.py)
# back to April 2026, so the redesigned "Meta Ads Spend (Corporate Account)"
# report has full history under the new monthly/corporate-only model instead
# of just going forward from whenever the monthly job first runs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Backfill April through last full month
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          for MONTH in 2026-04 2026-05 2026-06 2026-07 2026-08; do
            echo "=== Backfilling $MONTH ==="
            python fetch_meta_corporate_spend_monthly.py --month "$MONTH" || echo "  $MONTH failed, continuing with the rest"
            sleep 10
          done

      - name: Commit backfilled data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta-corporate-spend-monthly.json
          git diff --cached --quiet || git commit -m "chore: backfill monthly corporate Meta spend, Apr-Aug 2026"
          git pull --rebase origin main
          git push
