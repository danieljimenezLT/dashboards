name: Refresh Meta Ads Only (Fast)

# Manual-only fast iteration: re-runs only fetch_meta_ads.py and commits
# meta-ads-data.json. Skips Snowflake + Google Ads for ~2-min cycles
# instead of ~1 hour.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-meta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch Meta Ads
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python fetch_meta_ads.py

      - name: Commit updated meta-ads-data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta-ads-data.json
          git diff --cached --quiet || git commit -m "chore: refresh meta-ads-data (manual) $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
