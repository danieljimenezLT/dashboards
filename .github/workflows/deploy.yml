name: Deploy Pages (prod + staging)

on:
  push:
    branches: [main, staging]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy main to root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.ADMIN_PUSH_TOKEN }}
          publish_dir: .
          keep_files: true

      - name: Deploy staging to /staging subfolder
        if: github.ref == 'refs/heads/staging'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.ADMIN_PUSH_TOKEN }}
          publish_dir: .
          destination_dir: staging
          keep_files: true
