name: Monthly Corporate Meta Spend

# Fetches last month's Meta ad spend by studio from the shared corporate ad
# account only (fetch_meta_corporate_spend_monthly.py), for
# admin-reports/meta-spend-corporate.html. One adset-level request for the
# whole month, right after it closes — see that script's docstring for why
# this replaced the old daily/ad-level pipeline.
#
# Runs 30 min after monthly-attribution-audit.yml (also on the 1st) so their
# commits don't race on the same push.

on:
  schedule:
    - cron: "30 9 1 * *"   # 1st of each month, 9:30 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch last month's corporate Meta spend by studio
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python fetch_meta_corporate_spend_monthly.py

      - name: Commit updated data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta-corporate-spend-monthly.json
          git diff --cached --quiet || git commit -m "chore: refresh monthly corporate Meta spend $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
