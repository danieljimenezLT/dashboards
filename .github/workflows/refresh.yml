name: Refresh Dashboard Data

on:
  schedule:
    - cron: "0 8 * * *"   # 4:00 AM Eastern (EDT=UTC-4; drifts to 3:00 AM during EST/winter) — runs 1hr after "Refresh Snowflake Data"
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv
          pip install google-ads gspread google-auth

      - name: Fetch Meta Ads (Santi - account view)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python fetch_meta_ads.py
        continue-on-error: true

      - name: Write Google service account credentials
        run: |
          mkdir -p nso-dashboard/credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      - name: Fetch Marketing Spend Adjustments (Leadteam Discount / External Agency)
        run: python fetch_agency_overrides.py
        continue-on-error: true

      - name: Sync OS ad thumbnails/videos to Drive
        env:
          META_ACCESS_TOKEN:               ${{ secrets.META_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: nso-dashboard/credentials/service_account.json
        run: python sync_ad_media.py --dashboard os --max-new-images 300 --max-new-videos 200
        continue-on-error: true

      - name: Fetch Google Ads data
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python fetch_google_ads.py
        continue-on-error: true

      - name: Build spend-data.json (Meta + Google combined)
        run: python build_spend_data.py
        continue-on-error: true

      - name: Fetch Instagram insights (all studios)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_TOKEN }}
          META_APP_ID:       ${{ secrets.META_APP_ID }}
          META_APP_SECRET:   ${{ secrets.META_APP_SECRET }}
        run: |
          python nso-dashboard/scripts/fetch_social_insights.py \
            --days 90 \
            --output nso-dashboard/social_insights.json
        continue-on-error: true

      - name: Write Google service account credentials
        run: |
          mkdir -p nso-dashboard/credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > nso-dashboard/credentials/service_account.json

      - name: Fetch Google Business Profile data (all studios)
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          python nso-dashboard/scripts/fetch_gbp.py \
            --start 2025-01-01 \
            --output nso-dashboard/gbp_data.json \
            --credentials nso-dashboard/credentials/service_account.json
        continue-on-error: true

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta-ads-data.json google-ads-data.json spend-data.json
          git add agency-spend-overrides.json 2>/dev/null || true
          git add nso-dashboard/social_insights.json
          git add nso-dashboard/gbp_data.json
          git add nso-dashboard/thumbnails/ 2>/dev/null || true
          git add os_media_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: refresh data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
