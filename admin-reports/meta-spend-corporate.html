<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — Meta Ads Spend (Corporate Account)</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="../favicon.jpg"/>
<link rel="stylesheet" href="../shared/style.css"/>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="../home.html"><img src="../logo.png" alt="SWEAT440"/></a>
  <div class="nav-tabs" id="navTabs">
    <a class="nav-tab active" href="index.html" style="text-decoration:none">← Marketing Admin Reports</a>
  </div>
  <div class="nav-user" id="navUser"></div>
</nav>

<div class="controls-bar">
  <button class="controls-toggle" id="ctrlToggle" onclick="toggleControls()">Filters ▾</button>
  <div class="controls-inner" id="ctrlInner">
    <span class="ctrl-label">Months</span>
    <div class="ctrl-date">
      <input type="month" id="fFrom" onchange="applyFilters()"/>
      <span style="font-size:12px;color:#5a7a8a">→</span>
      <input type="month" id="fTo" onchange="applyFilters()"/>
    </div>
  </div>
</div>

<div class="main">
  <div class="chart-card">
    <div class="chart-card-title-row">
      <div class="chart-card-title">Meta Ads Spend by Studio — Corporate Ad Account Only</div>
      <button class="download-btn" onclick="downloadMetaSpendCSV()">⬇ Download CSV</button>
    </div>
    <p style="font-size:12px;color:#5a7a8a;margin:-10px 0 18px">
      Spend billed to SWEAT440's shared corporate Meta ad account only, fetched once a month
      right after each month closes. Whole months only — partial months can't be selected.
    </p>
    <div style="overflow-x:auto"><table class="data-table" id="metaSpendTable"></table></div>
  </div>
</div>

<script src="../users.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script>
let SPEND_RAW = null;   // meta-corporate-spend-monthly.json — already monthly, already corporate-only

async function loadData() {
  const _authUser = checkAuth();
  if (!_authUser) return;
  if (_authUser.role !== 'admin') { location.replace('../home.html'); return; }
  renderAuthNav(_authUser);

  const spendRes = await fetch('../meta-corporate-spend-monthly.json?_=' + Date.now())
    .catch(e => { console.warn('meta-corporate-spend-monthly.json unavailable:', e); return null; });
  try { SPEND_RAW = spendRes ? await spendRes.json() : null; } catch(e) { console.warn('meta-corporate-spend-monthly.json unavailable:', e); }

  await loadStudiosRegistry('../');

  // Default: last full calendar month only. <input type="month"> only ever
  // allows picking whole months, so there's no partial-month case to guard.
  const _today = new Date();
  const _lastMonth = new Date(_today.getFullYear(), _today.getMonth() - 1, 1);
  const _lastMonthKey = _lastMonth.getFullYear() + '-' + String(_lastMonth.getMonth()+1).padStart(2,'0');
  document.getElementById('fFrom').value = _lastMonthKey;
  document.getElementById('fTo').value   = _lastMonthKey;

  applyFilters();
}

function applyFilters() {
  if (!SPEND_RAW) return;
  const fromKey = document.getElementById('fFrom').value || '2026-01';
  const toKey   = document.getElementById('fTo').value   || fromKey;
  // Swap if entered backwards — <input type="month"> doesn't enforce from <= to.
  buildMetaSpendTable(fromKey <= toKey ? fromKey : toKey, fromKey <= toKey ? toKey : fromKey);
}

// Every "YYYY-MM" key from fromKey to toKey, inclusive, with a display label.
function _monthList(fromKey, toKey) {
  const months = [];
  let [y, m] = fromKey.split('-').map(Number);
  while (`${y}-${String(m).padStart(2,'0')}` <= toKey) {
    const key = `${y}-${String(m).padStart(2,'0')}`;
    const label = new Date(Date.UTC(y, m-1, 1)).toLocaleDateString('en-US', {month:'short', year:'numeric', timeZone:'UTC'});
    months.push({ key, label });
    m += 1;
    if (m > 12) { m = 1; y += 1; }
  }
  return months;
}

// studio_code -> month key ("YYYY-MM") -> corporate spend. The source file is
// already scoped to the corporate account and already monthly, so this is
// just a direct lookup — no daily/monthly merge, no dedicated-account netting.
function _metaSpendByStudioMonth() {
  const out = {};
  for (const r of (SPEND_RAW.monthly || [])) {
    (out[r.studio_code] ||= {})[r.month] = (out[r.studio_code]?.[r.month] || 0) + (r.spend || 0);
  }
  return out;
}

let _metaSpendExport = null;

function buildMetaSpendTable(fromKey, toKey) {
  const table = document.getElementById('metaSpendTable');
  if (!table || !SPEND_RAW) return;

  const months = _monthList(fromKey, toKey);
  const spendByStudioMonth = _metaSpendByStudioMonth();

  const rows = Object.keys(META_CODE_TO_STUDIO)
    .map(code => ({
      studio: META_CODE_TO_STUDIO[code] || code,
      perMonth: months.map(m => Math.round((spendByStudioMonth[code]?.[m.key] || 0) * 100) / 100),
    }))
    .filter(r => r.perMonth.some(v => v > 0))
    .sort((a,b) => a.studio.localeCompare(b.studio));

  const totalPerMonth = months.map((_,i) => rows.reduce((sum,r) => sum + r.perMonth[i], 0));
  const grandTotal = rows.reduce((sum,r) => sum + r.perMonth.reduce((a,b)=>a+b,0), 0);

  const f$ = v => v > 0 ? '$'+v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—';

  const thead = '<thead><tr><th>Studio</th>'+
    months.map(m => `<th class="num">${m.label}</th>`).join('')+
    '<th class="num" style="border-left:1.5px solid #dde8ef">Total</th>'+
  '</tr></thead>';

  const tbody = '<tbody>'+
    rows.map(r => {
      const rowTotal = r.perMonth.reduce((a,b)=>a+b,0);
      return `<tr><td>${r.studio}</td>`+
        r.perMonth.map(v => `<td class="num${v<=0?' spend-zero':''}">${f$(v)}</td>`).join('')+
        `<td class="num" style="border-left:1.5px solid #dde8ef">${f$(rowTotal)}</td></tr>`;
    }).join('')+
  '</tbody>';

  const tfoot = '<tfoot><tr><td>Grand Total</td>'+
    totalPerMonth.map(v => `<td class="num">${f$(v)}</td>`).join('')+
    `<td class="num" style="border-left:1.5px solid #dde8ef">${f$(grandTotal)}</td></tr></tfoot>`;

  table.innerHTML = thead + tbody + tfoot;

  _metaSpendExport = { months, rows, totalPerMonth, grandTotal };
}

function _csvField(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadMetaSpendCSV() {
  const data = _metaSpendExport;
  if (!data) return;
  const { months, rows, totalPerMonth, grandTotal } = data;

  const header = ['Studio'].concat(months.map(m => m.label)).concat(['Total']);
  const body = rows.map(r => [r.studio].concat(r.perMonth.map(v => v.toFixed(2))).concat([r.perMonth.reduce((a,b)=>a+b,0).toFixed(2)]));
  body.push(['Grand Total'].concat(totalPerMonth.map(v => v.toFixed(2))).concat([grandTotal.toFixed(2)]));

  const csv = [header, ...body].map(r => r.map(_csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const fromStr = document.getElementById('fFrom').value || 'start';
  const toStr   = document.getElementById('fTo').value   || 'end';
  const a = document.createElement('a');
  a.href = url;
  a.download = `meta-spend-corporate_${fromStr}_to_${toStr}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

loadData();
</script>
</body>
</html>
