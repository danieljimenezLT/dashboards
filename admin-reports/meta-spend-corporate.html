<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — Meta Ads Spend (Corporate Account)</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="../favicon.jpg"/>
<link rel="stylesheet" href="../shared/style.css"/>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="../home.html"><img src="../logo.png" alt="SWEAT440"/></a>
  <div class="nav-tabs" id="navTabs">
    <a class="nav-tab active" href="index.html" style="text-decoration:none">← Marketing Admin Reports</a>
  </div>
  <div class="nav-user" id="navUser"></div>
</nav>

<div class="controls-bar">
  <button class="controls-toggle" id="ctrlToggle" onclick="toggleControls()">Filters ▾</button>
  <div class="controls-inner" id="ctrlInner">
    <span class="ctrl-label">Date range</span>
    <div class="ctrl-date">
      <input type="date" id="fFrom" onchange="applyFilters()"/>
      <span style="font-size:12px;color:#5a7a8a">→</span>
      <input type="date" id="fTo" onchange="applyFilters()"/>
    </div>
  </div>
</div>

<div class="main">
  <div class="chart-card">
    <div class="chart-card-title-row">
      <div class="chart-card-title">Meta Ads Spend by Studio — Corporate Ad Account Only</div>
      <button class="download-btn" onclick="downloadMetaSpendCSV()">⬇ Download CSV</button>
    </div>
    <p style="font-size:12px;color:#5a7a8a;margin:-10px 0 18px">
      Shows only spend billed to the shared corporate Meta ad account. A studio's spend
      after it moves to its own dedicated ad account is netted out automatically, day by day.
    </p>
    <div style="overflow-x:auto"><table class="data-table" id="metaSpendTable"></table></div>
  </div>
</div>

<script src="../users.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script>
let SPEND_RAW = null;

async function loadData() {
  const _authUser = checkAuth();
  if (!_authUser) return;
  if (_authUser.role !== 'admin') { location.replace('../home.html'); return; }
  renderAuthNav(_authUser);

  const spendRes = await fetch('../spend-data.json?_=' + Date.now()).catch(e => { console.warn('spend-data.json unavailable:', e); return null; });
  try { SPEND_RAW = spendRes ? await spendRes.json() : null; } catch(e) { console.warn('spend-data.json unavailable:', e); }

  await loadStudiosRegistry('../');

  // Default date range: trailing 6 full months
  const _today = new Date();
  const _firstOfRange = new Date(_today.getFullYear(), _today.getMonth() - 5, 1);
  const _lastOfLastMonth = new Date(_today.getFullYear(), _today.getMonth(), 0);
  document.getElementById('fFrom').value = localDateStr(_firstOfRange);
  document.getElementById('fTo').value   = localDateStr(_lastOfLastMonth);

  applyFilters();
}

function applyFilters() {
  if (!SPEND_RAW) return;
  const fromStr = document.getElementById('fFrom').value;
  const toStr   = document.getElementById('fTo').value;
  const from = fromStr ? new Date(fromStr+'T00:00:00Z') : new Date('2025-01-01T00:00:00Z');
  const to   = toStr   ? new Date(toStr+'T23:59:59Z')   : new Date();
  buildMetaSpendTable(from, to);
}

function _monthList(from, to) {
  const months = [];
  let cur = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth(), 1));
  const end = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), 1));
  while (cur <= end) {
    const mStart = new Date(Math.max(cur.getTime(), from.getTime()));
    const mEndFull = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 0, 23, 59, 59));
    const mEnd = new Date(Math.min(mEndFull.getTime(), to.getTime()));
    months.push({ start: mStart, end: mEnd, key: cur.toISOString().slice(0,7), label: cur.toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'}) });
    cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 1));
  }
  return months;
}

// studio_code -> month key ("YYYY-MM") -> corporate-only meta spend. Daily rows
// (2026) take priority over monthly rows for the same studio+month, same rule
// as _adminSpendFor() in studio-performance-summary.html.
//
// meta_spend_dedicated (daily rows only) is the portion of that day's spend
// that ran through a studio's own dedicated Meta ad account rather than the
// shared corporate one — see the meta_dedicated comment in build_spend_data.py.
// Subtracting it out gives corporate-only spend automatically, day by day, with
// no need to know which studios have migrated or when: a studio with no
// dedicated account always nets to its full spend, and one that migrated mid-
// month nets to $0 from its cutover day onward.
function _metaSpendByStudioMonth(from, to) {
  const fT = from.getTime(), tT = to.getTime();
  const out = {};   // code -> { monthKey -> spend }
  const dailyCovered = new Set();

  for (const r of (SPEND_RAW.daily || [])) {
    const d = new Date(r.date+'T00:00:00Z').getTime();
    if (d < fT || d > tT) continue;
    const mk = r.date.slice(0,7);
    const corp = (r.meta_spend || 0) - (r.meta_spend_dedicated || 0);
    (out[r.studio_code] ||= {})[mk] = (out[r.studio_code]?.[mk] || 0) + corp;
    dailyCovered.add(r.studio_code+'|'+mk);
  }
  for (const r of (SPEND_RAW.monthly || [])) {
    const d = new Date(r.month+'T00:00:00Z').getTime();
    if (d < fT || d > tT) continue;
    const mk = r.month.slice(0,7);
    if (dailyCovered.has(r.studio_code+'|'+mk)) continue;
    // Monthly rows are always pre-2026, before any studio had a dedicated
    // account, so meta_spend here is already corporate-only.
    (out[r.studio_code] ||= {})[mk] = (out[r.studio_code]?.[mk] || 0) + (r.meta_spend || 0);
  }
  return out;
}

let _metaSpendExport = null;

function buildMetaSpendTable(from, to) {
  const table = document.getElementById('metaSpendTable');
  if (!table || !SPEND_RAW) return;

  const months = _monthList(from, to);
  const spendByStudioMonth = _metaSpendByStudioMonth(from, to);

  const rows = Object.keys(META_CODE_TO_STUDIO)
    .map(code => ({
      studio: META_CODE_TO_STUDIO[code] || code,
      perMonth: months.map(m => Math.round((spendByStudioMonth[code]?.[m.key] || 0) * 100) / 100),
    }))
    .filter(r => r.perMonth.some(v => v > 0))
    .sort((a,b) => a.studio.localeCompare(b.studio));

  const totalPerMonth = months.map((_,i) => rows.reduce((sum,r) => sum + r.perMonth[i], 0));
  const grandTotal = rows.reduce((sum,r) => sum + r.perMonth.reduce((a,b)=>a+b,0), 0);

  const f$ = v => v > 0 ? '$'+v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—';

  const thead = '<thead><tr><th>Studio</th>'+
    months.map(m => `<th class="num">${m.label}</th>`).join('')+
    '<th class="num" style="border-left:1.5px solid #dde8ef">Total</th>'+
  '</tr></thead>';

  const tbody = '<tbody>'+
    rows.map(r => {
      const rowTotal = r.perMonth.reduce((a,b)=>a+b,0);
      return `<tr><td>${r.studio}</td>`+
        r.perMonth.map(v => `<td class="num${v<=0?' spend-zero':''}">${f$(v)}</td>`).join('')+
        `<td class="num" style="border-left:1.5px solid #dde8ef">${f$(rowTotal)}</td></tr>`;
    }).join('')+
  '</tbody>';

  const tfoot = '<tfoot><tr><td>Grand Total</td>'+
    totalPerMonth.map(v => `<td class="num">${f$(v)}</td>`).join('')+
    `<td class="num" style="border-left:1.5px solid #dde8ef">${f$(grandTotal)}</td></tr></tfoot>`;

  table.innerHTML = thead + tbody + tfoot;

  _metaSpendExport = { months, rows, totalPerMonth, grandTotal };
}

function _csvField(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadMetaSpendCSV() {
  const data = _metaSpendExport;
  if (!data) return;
  const { months, rows, totalPerMonth, grandTotal } = data;

  const header = ['Studio'].concat(months.map(m => m.label)).concat(['Total']);
  const body = rows.map(r => [r.studio].concat(r.perMonth.map(v => v.toFixed(2))).concat([r.perMonth.reduce((a,b)=>a+b,0).toFixed(2)]));
  body.push(['Grand Total'].concat(totalPerMonth.map(v => v.toFixed(2))).concat([grandTotal.toFixed(2)]));

  const csv = [header, ...body].map(r => r.map(_csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const fromStr = document.getElementById('fFrom').value || 'start';
  const toStr   = document.getElementById('fTo').value   || 'end';
  const a = document.createElement('a');
  a.href = url;
  a.download = `meta-spend-corporate_${fromStr}_to_${toStr}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

loadData();
</script>
</body>
</html>
