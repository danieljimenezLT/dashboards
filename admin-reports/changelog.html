<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — Changelog</title>
<link rel="icon" href="../favicon.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#0084B5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 24px 80px}

.back-link{position:fixed;top:24px;left:24px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.65);font-family:'Oswald',sans-serif;font-style:italic;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;text-decoration:none;transition:color .15s}
.back-link:hover{color:#fff}

.logo-wrap{margin-bottom:32px;text-align:center}
.logo-wrap img{height:42px}

.page-title{font-family:'Oswald',sans-serif;font-style:italic;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#fff;text-align:center;margin-bottom:8px}
.page-sub{font-size:13px;color:rgba(255,255,255,.75);text-align:center;margin-bottom:32px;max-width:520px;line-height:1.6}

.search-wrap{position:relative;width:100%;max-width:640px;margin-bottom:16px}
.search-input{width:100%;padding:12px 16px 12px 40px;border:none;border-radius:10px;font-size:14px;font-family:'Open Sans',sans-serif;color:#1a1a2e;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.search-input::placeholder{color:#8aaabb}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none}

.filter-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:640px;margin-bottom:24px}
.filter-btn{border:1.5px solid rgba(255,255,255,.4);border-radius:20px;background:transparent;color:rgba(255,255,255,.85);font-family:'Oswald',sans-serif;font-style:italic;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 16px;cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:#fff;color:#fff}
.filter-btn.active{background:#fff;color:#0084B5;border-color:#fff}

.list{width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px}

.entry{background:#fff;border-radius:16px;padding:24px 28px;box-shadow:0 12px 36px rgba(0,0,0,.18)}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.entry-date{font-family:'Oswald',sans-serif;font-style:italic;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#00A3E0}
.entry-tags{display:flex;flex-wrap:wrap;gap:6px}
.entry-tag{font-family:'Oswald',sans-serif;font-style:italic;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.entry-title{font-family:'Open Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:0;color:#1a1a2e;margin-bottom:8px;line-height:1.3}
.entry-summary{font-size:14px;color:#4a6473;line-height:1.65;margin-bottom:14px}
.entry-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#8aaabb}
.entry-author{font-weight:600}
.entry-link{color:#00A3E0;text-decoration:none;font-weight:600}
.entry-link:hover{text-decoration:underline}

.empty,.error{background:#fff;border-radius:16px;padding:32px;text-align:center;color:#5a7a8a;font-size:13px;width:100%;max-width:640px;box-shadow:0 12px 36px rgba(0,0,0,.18)}

@media(max-width:600px){
  .entry{padding:20px 22px}
  .back-link{position:static;margin-bottom:20px}
}
</style>
</head>
<body>

<a class="back-link" href="index.html">← Marketing Admin Reports</a>

<div class="logo-wrap">
  <img src="../logo.png" alt="SWEAT440"/>
</div>

<div class="page-title">Changelog</div>
<div class="page-sub">A plain-English record of what's changed across the dashboards, updated automatically whenever a new update goes live.</div>

<div class="search-wrap">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#8aaabb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input type="text" class="search-input" id="searchInput" placeholder="Search the changelog…"/>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="list" id="list">
  <div class="empty">Loading…</div>
</div>

<script src="../users.js"></script>
<script src="../shared/auth.js"></script>
<script>
const user = checkAuth();
if (user) {
  if (user.role !== 'admin') location.replace('../home.html');
}

const CATEGORIES = ['OS Dashboard', 'NSO Dashboard', 'Brand Audit', 'Campaign Dashboard', 'Paid Ads Dashboard', 'General'];
const CATEGORY_COLORS = {
  'OS Dashboard':        '#00A3E0',
  'NSO Dashboard':       '#00C9A7',
  'Brand Audit':         '#8E44AD',
  'Campaign Dashboard':  '#F5A623',
  'Paid Ads Dashboard':  '#E74C3C',
  'General':             '#7F8C8D',
};

let _entries = [];
let _activeFilter = 'All';
let _searchTerm = '';

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function renderFilters() {
  const row = document.getElementById('filterRow');
  const options = ['All', ...CATEGORIES];
  row.innerHTML = options.map(cat => `
    <button class="filter-btn${cat === _activeFilter ? ' active' : ''}" data-cat="${escapeAttr(cat)}">${escapeHtml(cat)}</button>
  `).join('');
  row.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      _activeFilter = btn.dataset.cat;
      renderFilters();
      renderList();
    });
  });
}

function renderList() {
  const list = document.getElementById('list');

  if (!_entries.length) {
    list.innerHTML = '<div class="empty">No changes logged yet.</div>';
    return;
  }

  let filtered = _activeFilter === 'All'
    ? _entries
    : _entries.filter(e => (e.categories || ['General']).includes(_activeFilter));

  if (_searchTerm) {
    filtered = filtered.filter(e =>
      (e.title || '').toLowerCase().includes(_searchTerm) ||
      (e.summary || '').toLowerCase().includes(_searchTerm)
    );
  }

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">No changes found${_searchTerm ? ' for "' + escapeHtml(_searchTerm) + '"' : ' in this category'} yet.</div>`;
    return;
  }

  list.innerHTML = filtered.map(e => {
    const cats = e.categories && e.categories.length ? e.categories : ['General'];
    const tags = cats.map(c => `<span class="entry-tag" style="background:${CATEGORY_COLORS[c] || '#7F8C8D'}">${escapeHtml(c)}</span>`).join('');
    return `
      <div class="entry">
        <div class="entry-top">
          <div class="entry-date">${fmtDate(e.date)}</div>
          <div class="entry-tags">${tags}</div>
        </div>
        <div class="entry-title">${escapeHtml(e.title || '')}</div>
        <div class="entry-summary">${escapeHtml(e.summary || '')}</div>
        <div class="entry-footer">
          <span class="entry-author">${escapeHtml(e.author || '')}</span>
          ${e.pr_url ? `<a class="entry-link" href="${escapeAttr(e.pr_url)}" target="_blank" rel="noopener">View details</a>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function loadChangelog() {
  const list = document.getElementById('list');
  try {
    const res = await fetch('../changelog.json?_=' + Date.now());
    const data = await res.json();
    _entries = data.entries || [];
    renderFilters();
    renderList();

    document.getElementById('searchInput').addEventListener('input', (e) => {
      _searchTerm = e.target.value.trim().toLowerCase();
      renderList();
    });
  } catch (e) {
    list.innerHTML = '<div class="error">Couldn\'t load the changelog right now.</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

loadChangelog();
</script>
</body>
</html>
