<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — Studio Performance Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="../favicon.jpg"/>
<link rel="stylesheet" href="../shared/style.css"/>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="../home.html"><img src="../logo.png" alt="SWEAT440"/></a>
  <div class="nav-tabs" id="navTabs">
    <a class="nav-tab active" href="index.html" style="text-decoration:none">← Marketing Admin Reports</a>
  </div>
  <div class="nav-user" id="navUser"></div>
</nav>

<div class="controls-bar">
  <button class="controls-toggle" id="ctrlToggle" onclick="toggleControls()">Filters ▾</button>
  <div class="controls-inner" id="ctrlInner">
    <span class="ctrl-label">Studio</span>
    <div class="multi-select" id="studioDropdown">
      <button class="ms-trigger" onclick="toggleDropdown('studio')">
        <span id="studioLabel">All Studios</span><span class="ms-arrow">▾</span>
      </button>
      <div class="ms-menu" id="studioMenu"></div>
    </div>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Source</span>
    <div class="multi-select" id="sourceDropdown">
      <button class="ms-trigger" onclick="toggleDropdown('source')">
        <span id="sourceLabel">All Sources</span><span class="ms-arrow">▾</span>
      </button>
      <div class="ms-menu" id="sourceMenu"></div>
    </div>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Date range</span>
    <div class="ctrl-date">
      <input type="date" id="fFrom" onchange="applyFilters()"/>
      <span style="font-size:12px;color:#5a7a8a">→</span>
      <input type="date" id="fTo" onchange="applyFilters()"/>
    </div>
  </div>
</div>

<div class="main">
  <div class="chart-card">
    <div class="chart-card-title-row">
      <div class="chart-card-title">Studio Performance Summary — Monthly Performance by Studio</div>
      <button class="download-btn" onclick="downloadStudioPerfCSV()">⬇ Download CSV</button>
    </div>
    <div style="overflow-x:auto"><table class="data-table" id="studioPerfTable"></table></div>
  </div>
</div>

<script src="../users.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script>
let RAW = null;
let SPEND_RAW = null;

// GOOGLE_STUDIO_ALIAS / googleStudioName() and META_CODE_TO_STUDIO now live in
// shared/utils.js, populated from studios.json via loadStudiosRegistry() (called
// in loadData() below).

async function loadData() {
  const _authUser = checkAuth();
  if (!_authUser) return;
  if (_authUser.role !== 'admin') { location.replace('../home.html'); return; }
  renderAuthNav(_authUser);

  const [rawRes, spendRes] = await Promise.allSettled([
    fetch('../data.json?_='       + Date.now()),
    fetch('../spend-data.json?_=' + Date.now()),
  ]);
  try {
    RAW = await rawRes.value.json();
    if (!RAW.daily_detail)   RAW.daily_detail   = [];
    if (!RAW.monthly_detail) RAW.monthly_detail = [];
  } catch(e) {
    console.warn('Using mock data:', e); RAW = getMock();
  }
  try { SPEND_RAW = await spendRes.value.json(); } catch(e) { console.warn('spend-data.json unavailable:', e); }

  // Default date range: last month
  const _today = new Date();
  const _firstOfLastMonth = new Date(_today.getFullYear(), _today.getMonth() - 1, 1);
  const _lastOfLastMonth  = new Date(_today.getFullYear(), _today.getMonth(), 0);
  document.getElementById('fFrom').value = localDateStr(_firstOfLastMonth);
  document.getElementById('fTo').value   = localDateStr(_lastOfLastMonth);

  await loadStudiosRegistry('../');
  buildMultiSelect('studioMenu', 'studioLabel', RAW.studios, DEFAULT_EXCL_STUDIOS);
  buildSourceSelect('sourceMenu', 'sourceLabel', RAW.sources, DEFAULT_EXCL_SOURCES);

  // If default date range has no data, fall back to last available month in dataset
  const allRows = [...(RAW.daily_detail||[]), ...(RAW.monthly_detail||[])];
  const allKeys = allRows.map(r=>r.date||r.month).filter(Boolean).sort();
  if (allKeys.length) {
    const lastKey  = allKeys[allKeys.length-1].slice(0,7); // YYYY-MM
    const defFrom  = document.getElementById('fFrom').value.slice(0,7);
    const defTo    = document.getElementById('fTo').value.slice(0,7);
    const hasData = allKeys.some(k => k >= defFrom+'-01' && k <= defTo+'-31');
    if (!hasData) {
      const lastDate = new Date(lastKey+'-01T00:00:00Z');
      const y = lastDate.getUTCFullYear(), m = lastDate.getUTCMonth();
      const firstOfLast = new Date(Date.UTC(y,m,1));
      const lastOfLast  = new Date(Date.UTC(y,m+1,0));
      document.getElementById('fFrom').value = firstOfLast.toISOString().slice(0,10);
      document.getElementById('fTo').value   = lastOfLast.toISOString().slice(0,10);
    }
  }

  applyFilters();
}

function applyFilters() {
  if (!RAW) return;
  const fromStr = document.getElementById('fFrom').value;
  const toStr   = document.getElementById('fTo').value;
  const from = fromStr ? new Date(fromStr+'T00:00:00Z') : new Date(RAW.monthly_detail[0]?.month+'T00:00:00Z');
  const to   = toStr   ? new Date(toStr+'T23:59:59Z')   : new Date();
  window._metaFrom = from; window._metaTo = to;
  buildStudioPerformanceTable();
}

// -- STUDIO PERFORMANCE SUMMARY -----------------------------------------
const ADMIN_LEADTEAM_PER_STUDIO_MONTH = 1200;
const STUDIO_PERF_COLS = [
  {key:'leads',    label:'Leads',        fmt:v=>Math.round(v)},
  {key:'ft',       label:'FT',           fmt:v=>Math.round(v)},
  {key:'mem',      label:'Members',      fmt:v=>Math.round(v)},
  {key:'spend',    label:'Mkt Spend',    fmt:v=>v.toFixed(2)},
  {key:'google',   label:'Google Ads',   fmt:v=>v.toFixed(2)},
  {key:'meta',     label:'Meta Ads',     fmt:v=>v.toFixed(2)},
  {key:'leadteam', label:'Leadteam Fee', fmt:v=>v.toFixed(2)},
  {key:'cpl',      label:'CPL',          fmt:v=>v.toFixed(2)},
  {key:'cpft',     label:'CPFT',         fmt:v=>v.toFixed(2)},
  {key:'cpa',      label:'CPA',          fmt:v=>v.toFixed(2)},
];
let _studioPerfExport = null;

function _adminMonthList(from, to) {
  const months = [];
  let cur = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth(), 1));
  const end = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), 1));
  while (cur <= end) {
    const mStart = new Date(Math.max(cur.getTime(), from.getTime()));
    const mEndFull = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 0, 23, 59, 59));
    const mEnd = new Date(Math.min(mEndFull.getTime(), to.getTime()));
    months.push({ start: mStart, end: mEnd, label: cur.toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'}) });
    cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 1));
  }
  return months;
}

// Same definition as spendFor() in index.html — reads spend-data.json
// (daily rows cover all of 2026, monthly rows cover pre-2026).
function _adminSpendFor(studio, f, t) {
  if (!SPEND_RAW) return {meta:0, google:0};
  const fT = f.getTime(), tT = t.getTime();
  let meta = 0, google = 0;
  const dailyCovered = new Set();
  for (const r of (SPEND_RAW.daily||[])) {
    const d = new Date(r.date+'T00:00:00Z').getTime();
    if (d < fT || d > tT) continue;
    const nm = META_CODE_TO_STUDIO[r.studio_code] || r.studio_code;
    if (nm !== studio) continue;
    meta   += r.meta_spend   || 0;
    google += r.google_spend || 0;
    dailyCovered.add(r.studio_code+'|'+r.date.slice(0,7));
  }
  for (const r of (SPEND_RAW.monthly||[])) {
    const d = new Date(r.month+'T00:00:00Z').getTime();
    if (d < fT || d > tT) continue;
    if (dailyCovered.has(r.studio_code+'|'+r.month.slice(0,7))) continue;
    const nm = META_CODE_TO_STUDIO[r.studio_code] || r.studio_code;
    if (nm !== studio) continue;
    meta   += r.meta_spend   || 0;
    google += r.google_spend || 0;
  }
  return {meta: Math.round(meta*100)/100, google: Math.round(google*100)/100};
}

function _adminLeadteamFee(f, t) {
  const days = Math.round((t.getTime()-f.getTime())/86400000);
  return ADMIN_LEADTEAM_PER_STUDIO_MONTH * (days/30.4375);
}

function buildStudioPerformanceTable() {
  const table = document.getElementById('studioPerfTable');
  if (!table || !RAW) return;
  const from = window._metaFrom || null, to = window._metaTo || null;
  if (!from || !to) return;

  const selStudios = getSelected('studioMenu') || [];
  const selSources = getSelected('sourceMenu') || [];
  const studios = (selStudios.length ? selStudios : RAW.studios).slice().sort();
  const months = _adminMonthList(from, to);

  const f$  = v => '$'+Math.round(v).toLocaleString('en-US');
  const f$2 = v => v>0 ? '$'+v.toFixed(2) : '—';

  function metricsFor(studio, mFrom, mTo) {
    const daily   = filterRows(RAW.daily_detail||[],   mFrom, mTo, [studio], selSources);
    const monthly = filterRows(RAW.monthly_detail||[], mFrom, mTo, [studio], selSources);
    const {leads, ft, mem} = sumRows([...daily, ...monthly]);
    const {meta, google} = _adminSpendFor(studio, mFrom, mTo);
    const leadteam  = _adminLeadteamFee(mFrom, mTo);
    const spend = google + meta + leadteam;
    return {
      leads, ft, mem, spend, google, meta, leadteam,
      cpl:  leads>0 ? spend/leads : 0,
      cpft: ft>0    ? spend/ft    : 0,
      cpa:  mem>0   ? spend/mem   : 0,
    };
  }

  function blank() { return {leads:0, ft:0, mem:0, spend:0, google:0, meta:0, leadteam:0, cpl:0, cpft:0, cpa:0}; }
  function addInto(acc, m) { acc.leads+=m.leads; acc.ft+=m.ft; acc.mem+=m.mem; acc.spend+=m.spend; acc.google+=m.google; acc.meta+=m.meta; acc.leadteam+=m.leadteam; }
  function finalize(acc) {
    acc.cpl  = acc.leads>0 ? acc.spend/acc.leads : 0;
    acc.cpft = acc.ft>0    ? acc.spend/acc.ft    : 0;
    acc.cpa  = acc.mem>0   ? acc.spend/acc.mem   : 0;
    return acc;
  }

  // studio -> {perMonth:[...], grand}
  const studioRows = studios.map(studio => {
    const perMonth = months.map(m => metricsFor(studio, m.start, m.end));
    const grand = finalize(perMonth.reduce((acc,m) => { addInto(acc,m); return acc; }, blank()));
    return { studio, perMonth, grand };
  });

  // Grand total row across all studios, per month + overall
  const totalPerMonth = months.map((m,i) => finalize(studioRows.reduce((acc,row) => { addInto(acc,row.perMonth[i]); return acc; }, blank())));
  const totalGrand = finalize(studioRows.reduce((acc,row) => { addInto(acc,row.grand); return acc; }, blank()));

  function zeroSpendClass(v) { return v<=0 ? ' spend-zero' : ''; }

  function metricCells(m, groupBorder) {
    const firstStyle = groupBorder ? ` style="${groupStyle}"` : '';
    return `<td class="num"${firstStyle}>${m.leads.toLocaleString()}</td><td class="num">${m.ft.toLocaleString()}</td><td class="num">${m.mem.toLocaleString()}</td>`+
           `<td class="num">${f$(m.spend)}</td>`+
           `<td class="num${zeroSpendClass(m.google)}">${f$(m.google)}</td>`+
           `<td class="num${zeroSpendClass(m.meta)}">${f$(m.meta)}</td>`+
           `<td class="num${zeroSpendClass(m.leadteam)}">${f$(m.leadteam)}</td>`+
           `<td class="num">${f$2(m.cpl)}</td><td class="num">${f$2(m.cpft)}</td><td class="num">${f$2(m.cpa)}</td>`;
  }
  const groupStyle = 'border-left:1.5px solid #dde8ef';
  const COLS_PER_GROUP = 10;

  const thead =
    '<thead>'+
      '<tr><th rowspan="2">Studio</th>'+
        months.map(m => `<th colspan="${COLS_PER_GROUP}" style="text-align:center;${groupStyle}">${m.label}</th>`).join('')+
        `<th colspan="${COLS_PER_GROUP}" style="text-align:center;${groupStyle}">Grand total</th>`+
      '</tr>'+
      '<tr>'+
        months.map(() => `<th class="num" style="${groupStyle}">Leads</th><th class="num">FT</th><th class="num">Members</th><th class="num">Mkt Spend</th><th class="num">Google Ads</th><th class="num">Meta Ads</th><th class="num">Leadteam Fee</th><th class="num">CPL</th><th class="num">CPFT</th><th class="num">CPA</th>`).join('')+
        `<th class="num" style="${groupStyle}">Leads</th><th class="num">FT</th><th class="num">Members</th><th class="num">Mkt Spend</th><th class="num">Google Ads</th><th class="num">Meta Ads</th><th class="num">Leadteam Fee</th><th class="num">CPL</th><th class="num">CPFT</th><th class="num">CPA</th>`+
      '</tr>'+
    '</thead>';

  const tbody = '<tbody>'+
    studioRows.map(row =>
      `<tr><td>${row.studio}</td>`+
        row.perMonth.map(m => metricCells(m, true)).join('')+
        metricCells(row.grand, true)+
      '</tr>'
    ).join('')+
  '</tbody>';

  const tfoot = '<tfoot><tr><td>Grand Total</td>'+
    totalPerMonth.map(m => metricCells(m, true)).join('')+
    metricCells(totalGrand, true)+
    '</tr></tfoot>';

  table.innerHTML = thead + tbody + tfoot;

  _studioPerfExport = { months, studioRows, totalPerMonth, totalGrand };
}

function _csvField(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadStudioPerfCSV() {
  const data = _studioPerfExport;
  if (!data) return;
  const { months, studioRows, totalPerMonth, totalGrand } = data;

  function metricValues(m) { return STUDIO_PERF_COLS.map(c => c.fmt(m[c.key])); }

  const header = ['Studio']
    .concat(months.flatMap(mo => STUDIO_PERF_COLS.map(c => `${mo.label} ${c.label}`)))
    .concat(STUDIO_PERF_COLS.map(c => `Grand Total ${c.label}`));

  const rows = studioRows.map(row => [row.studio]
    .concat(row.perMonth.flatMap(metricValues))
    .concat(metricValues(row.grand)));

  rows.push(['Grand Total']
    .concat(totalPerMonth.flatMap(metricValues))
    .concat(metricValues(totalGrand)));

  const csv = [header, ...rows].map(r => r.map(_csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const fromStr = document.getElementById('fFrom').value || 'start';
  const toStr   = document.getElementById('fTo').value   || 'end';
  const a = document.createElement('a');
  a.href = url;
  a.download = `studio-performance-summary_${fromStr}_to_${toStr}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

loadData();
</script>
</body>
</html>
