<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
// ── Agency Comparison (admin-only, staging) ─────────────────────────────────
// Agencies come from studios.json, by day: studio.agency (LT / FFM / JL) from
// studio.agency_from on, LT before it (and while it isn't set — e.g. an agency
// that hasn't started yet). Open / NSO also goes by day: NSO before
// studio.opening_date when there is one, otherwise studio.status.
const AGENCIES  = ['LT', 'FFM', 'JL'];
const LT = 'LT';
const AG_COLOR  = { LT:'#00A3E0', FFM:'#F28C28', JL:'#8E44EC', ALL:'#5a7a8a' };
const PAID_SRC  = { 'Meta Ads':'meta', 'Google Ads':'google' };
const DEFAULT_FROM = '2026-08-01';    // FFM started with its first studios in early August
let   DEFAULT_TO   = null;          // last day with funnel data (set on load)
const DEFAULT_SOURCES = ['Meta Ads', 'Google Ads'];     // Sources filter default

let RAW = null, SPEND = null, NSO_SALES = null, REG = null;
let STUDIOS = [];                 // [{name, code, status, agency, agencyFrom, openingDate}], not closed
let statusMode = 'open', viewMode = 'day', tableAgency = 'ALL';
// Which ad platforms the Sources filter includes (set in applyFilters): spend and
// ad-delivery metrics only count the selected platforms
let PS = { meta: true, google: true, paid: true };
let _charts = {}, _tableRows = [], _sort = { key:'spend', dir:-1 };

function toggleControls() { document.getElementById('ctrlInner').classList.toggle('open'); }

async function getJSON(path) {
  try { const r = await fetch(path + '?_=' + Date.now()); return r.ok ? await r.json() : null; }
  catch (e) { console.warn(path + ' unavailable:', e); return null; }
}

async function loadData() {
  const _authUser = checkAuth();
  if (!_authUser) return;
  if (_authUser.role !== 'admin') { location.replace('../home.html'); return; }
  renderAuthNav(_authUser);

  [RAW, SPEND, NSO_SALES] = await Promise.all([
    getJSON('../data.json'), getJSON('../spend-data.json'),
    getJSON('../nso-dashboard/nso_sales_data.json'),
  ]);
  REG = await loadStudiosRegistry('../');
  RAW = RAW || { daily_detail: [], sources: [] };

  STUDIOS = (REG.studios || [])
    .filter(s => s.agency && s.status !== 'closed')
    .map(s => ({ name: s.name, code: s.code, status: s.status === 'nso' ? 'nso' : 'open', agency: s.agency,
                 agencyFrom: s.agency_from || null, openingDate: s.opening_date || null }));

  // Default range: Aug 1 → the last day with data (moves forward with the
  // daily refresh)
  DEFAULT_TO = (RAW.daily_detail || []).reduce((m, r) => r.date > m ? r.date : m, '') || DEFAULT_FROM;
  for (const id of ['fFrom', 'fTo']) document.getElementById(id).max = DEFAULT_TO;
  document.getElementById('fFrom').value = DEFAULT_FROM;
  document.getElementById('fTo').value   = DEFAULT_TO;

  setupStudioSelect();
  const sources = (RAW.sources || []).slice();
  const notDefault = sources.filter(x => !DEFAULT_SOURCES.includes(x));
  if (typeof buildSourceSelect === 'function') buildSourceSelect('sourceMenu', 'sourceLabel', sources, notDefault);
  else buildMultiSelect('sourceMenu', 'sourceLabel', sources, notDefault);

  for (const [segId, setter] of [['statusSeg', v => statusMode = v], ['viewSeg', v => viewMode = v]]) {
    document.querySelectorAll(`#${segId} button`).forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll(`#${segId} button`).forEach(x => x.classList.toggle('active', x === b));
      setter(b.dataset.v); applyFilters();
    }));
  }
  document.getElementById('agChips').innerHTML = ['ALL', ...AGENCIES].map(a =>
    `<button type="button" class="chip${a === 'ALL' ? ' active' : ''}" data-a="${a}">${a === 'ALL' ? 'All agencies' : a}</button>`).join('');
  document.querySelectorAll('#agChips .chip').forEach(c => c.addEventListener('click', () => {
    tableAgency = c.dataset.a;
    document.querySelectorAll('#agChips .chip').forEach(x => x.classList.toggle('active', x === c));
    renderStudioTable();
  }));

  applyFilters();
}

// ── Agency / status on a given day ──────────────────────────────────────────
function agencyOn(s, d) { return s.agency === LT || !s.agencyFrom || d < s.agencyFrom ? LT : s.agency; }
function statusOn(s, d) { return s.openingDate ? (d < s.openingDate ? 'nso' : 'open') : s.status; }
function addDay(iso, n) { const t = new Date(iso + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function daysIn(from, to) { const out = []; for (let d = from; d <= to; d = addDay(d, 1)) out.push(d); return out; }
function monthDays(month) {            // 'YYYY-MM-01' or 'YYYY-MM' → every day of that month
  const m = month.slice(0, 7), out = [];
  for (let d = m + '-01'; d.slice(0, 7) === m; d = addDay(d, 1)) out.push(d);
  return out;
}

// Studio filter: the studios that are Open (or NSO) at some point in the range,
// grouped by their agency at the end of the range. Agency headers have a checkbox and an "Only" button, like each
// studio. Unchecked studios are kept in _unchecked so switching status doesn't
// reset the selection.
const _unchecked = new Set();

let _menuKey = null;
function renderStudioSelect(from, to) {
  _menuKey = `${statusMode}|${from}|${to}`;
  const menu = document.getElementById('studioMenu');
  const safe = n => 'ms_studio_' + n.replace(/[^a-z0-9]/gi, '_');
  const only = attrs => `<button type="button" class="ms-only-btn" ${attrs}>Only</button>`;
  const st = statusMode;
  // NSO → Open only ever moves forward, so checking both ends is enough
  const inSt = STUDIOS.filter(x => statusOn(x, from) === st || statusOn(x, to) === st)
    .map(x => ({ ...x, agency: agencyOn(x, to) }));
  let h = `<div class="ms-item ms-select-all"><input type="checkbox" id="studioMenu_all"> <label for="studioMenu_all" style="cursor:pointer">Select all</label></div><div class="ms-divider"></div>`;
  {
    for (const a of AGENCIES) {
      const list = inSt.filter(x => x.agency === a).sort((x, y) => x.name.localeCompare(y.name));
      if (!list.length) continue;
      const id = `studioMenu_ag_${st}_${a}`;
      h += `<div class="ms-cat-header ms-ag-header"><input type="checkbox" id="${id}" data-grp="ag" data-st="${st}" data-ag="${a}"> <label for="${id}" style="cursor:pointer;flex:1"><span class="ag-badge" style="background:${AG_COLOR[a]}">${a}</span> <span style="color:#5a7a8a">${list.length}</span></label>${only(`data-only-st="${st}" data-only-ag="${a}"`)}</div>`;
      h += list.map(x => `<div class="ms-item ms-ag-item"><input type="checkbox" id="${safe(x.name)}" value="${x.name}" data-st="${st}" data-ag="${a}"${_unchecked.has(x.name) ? '' : ' checked'}> <label for="${safe(x.name)}" style="cursor:pointer">${x.name}</label>${only(`data-only="${x.name}"`)}</div>`).join('');
    }
  }
  menu.innerHTML = h;
  syncStudioSelect();
}

function _studioBoxes() { return [...document.querySelectorAll('#studioMenu input[value]')]; }

function syncStudioSelect() {
  const all = _studioBoxes(), on = all.filter(c => c.checked);
  for (const c of all) c.checked ? _unchecked.delete(c.value) : _unchecked.add(c.value);
  const setTri = (el, boxes) => {
    const n = boxes.filter(c => c.checked).length;
    el.checked = boxes.length > 0 && n === boxes.length; el.indeterminate = n > 0 && n < boxes.length;
  };
  document.querySelectorAll('#studioMenu input[data-grp]').forEach(hd =>
    setTri(hd, all.filter(c => c.dataset.ag === hd.dataset.ag)));
  setTri(document.getElementById('studioMenu_all'), all);

  // Label: "All", the fully selected agencies ("LT + FFM only"), or a count.
  let label;
  if (on.length === all.length) label = 'All';
  else if (!on.length) label = 'None selected';
  else {
    const full = [], partial = [];
    for (const a of AGENCIES) {
      const g = all.filter(c => c.dataset.ag === a), n = g.filter(c => c.checked).length;
      if (!n) continue;
      (n === g.length ? full : partial).push(a);
    }
    label = !partial.length && full.length ? full.join(' + ') + ' only'
          : on.length <= 2 ? on.map(c => c.value).join(', ') : on.length + ' selected';
  }
  document.getElementById('studioLabel').textContent = label;
}

function setupStudioSelect() {
  const menu = document.getElementById('studioMenu');
  menu.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'studioMenu_all') _studioBoxes().forEach(c => c.checked = t.checked);
    else if (t.dataset.grp) _studioBoxes().forEach(c => { if (c.dataset.ag === t.dataset.ag) c.checked = t.checked; });
    syncStudioSelect(); applyFilters();
  });
  menu.addEventListener('click', e => {
    const b = e.target.closest('.ms-only-btn');
    if (!b) return;
    e.stopPropagation();
    const d = b.dataset;
    _studioBoxes().forEach(c => c.checked = d.only ? c.value === d.only
      : c.dataset.st === d.onlySt && (!d.onlyAg || c.dataset.ag === d.onlyAg));
    syncStudioSelect(); applyFilters();
  });
}

// ── Aggregation ─────────────────────────────────────────────────────────────
function emptyAgg() {
  return { spend:0, adSpend:0, metaSpend:0, googleSpend:0,
           leads:0, ft:0, mem:0, pre:0, canc:0, netPre:0,
         };
}
function addAgg(a, b) { for (const k in a) a[k] += b[k] || 0; return a; }

// One row per (studio, agency, status) in the selected window: each day of
// data goes to the agency that ran the studio that day and to its Open / NSO
// status that day, so a studio that changed agency or opened mid-range shows
// up once per part. `days` = days of the range in that part.
function perStudio(from, to, srcSel) {
  const segs = {}, byName = {}, codeToName = {};
  for (const s of STUDIOS) { byName[s.name] = s; if (s.code) codeToName[s.code] = s.name; }
  const srcSet = new Set(srcSel);
  const seg = (s, d) => {
    const a = agencyOn(s, d), st = statusOn(s, d), k = `${s.name}|${a}|${st}`;
    return segs[k] || (segs[k] = Object.assign(emptyAgg(), { name: s.name, code: s.code, agency: a, status: st, days: 0, first: d, last: d }));
  };
  for (const s of STUDIOS) for (const d of daysIn(from, to)) {
    const o = seg(s, d); o.days++;
    if (d < o.first) o.first = d; if (d > o.last) o.last = d;
  }
  const at = (name, d) => (byName[name] && d >= from && d <= to) ? seg(byName[name], d) : null;

  // Funnel (data.json): daily rows; months before the daily window come from the
  // monthly rows, spread evenly over the month's days
  const addFunnel = (o, r, w = 1) => {
    if (!srcSet.has(r.source)) return;
    o.leads += (r.signups || 0) * w; o.ft += (r.first_visits || 0) * w; o.mem += (r.first_activations || 0) * w;
  };
  const dailyMin = (RAW.daily_detail || []).reduce((m, r) => !m || r.date < m ? r.date : m, '');
  for (const r of RAW.daily_detail || []) { const o = at(r.studio, r.date); if (o) addFunnel(o, r); }
  for (const r of RAW.monthly_detail || []) {
    const md = monthDays(r.month);
    for (const d of md) if (!dailyMin || d < dailyMin) { const o = at(r.studio, d); if (o) addFunnel(o, r, 1 / md.length); }
  }

  for (const r of (SPEND && SPEND.daily) || []) {
    const o = at(codeToName[r.studio_code], r.date);
    if (o) { o.metaSpend += r.meta_spend || 0; o.googleSpend += r.google_spend || 0; }
  }
  // NSO presales (NSO view): net = presales − cancellations, by source like leads
  for (const st of Object.values((NSO_SALES && NSO_SALES.studios) || {})) {
    const name = codeToName[st.code] || (st.name || '').replace(/^SWEAT440\s+/, '');
    for (const r of st.daily || []) {
      const o = at(name, r.date);
      if (!o) continue;
      if (!srcSet.has(r.source)) continue;
      const P = r.presales || 0, C = r.cancellations || 0;
      o.pre += P; o.canc += C; o.netPre += P - C;
    }
  }
  // Spend: only the platforms in the Sources filter
  const m = srcSet.has('Meta Ads'), g = srcSet.has('Google Ads');
  return Object.values(segs).map(o => {
    o.adSpend   = o.metaSpend + o.googleSpend;
    o.spend     = (m ? o.metaSpend : 0) + (g ? o.googleSpend : 0);
    o.active = o.adSpend > 0;          // only studios the agency actually ran ads for
    return o;
  });
}

// Columns of the scorecard for the current status mode. "Per studio / day"
// divides volumes by the studio-days the agency ran each studio in the range
// (n), so studios with the agency for part of the range weigh by their days
// and nothing is projected. cnt = plain studio counts.
function buildColumns(rows, rangeDays) {
  const cols = [];
  const mk = (key, label, sub, color, filt, ref) => {
    const studios = rows.filter(filt);
    if (!studios.length && !ref) return;      // agency filtered out → no column
    const active = studios.filter(s => s.active);
    const agg = active.reduce(addAgg, emptyAgg());
    agg.n = sum(active.map(s => s.days));
    agg.cnt = active.length; agg.cntAll = studios.length;
    agg.partial = active.filter(s => s.days < rangeDays).length;
    agg.rangeDays = rangeDays;
    cols.push({ key, label, sub, color, agg, ref: !!ref });
  };
  const stOk = s => s.status === statusMode;
  const stSub = statusMode === 'nso' ? 'NSO' : 'Open';
  for (const a of AGENCIES) mk(a, a, stSub, AG_COLOR[a], s => s.agency === a && stOk(s));
  mk('ALL', 'All agencies', stSub, AG_COLOR.ALL, stOk, true);
  return cols;
}

const sum = arr => arr.reduce((a, b) => a + (b || 0), 0);

// ── Formatting ──────────────────────────────────────────────────────────────
const fmtUSD  = v => v == null || !isFinite(v) ? null : '$' + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2));
const fmtUSD0 = v => v == null || !isFinite(v) ? null : Math.abs(v) < 100 && v % 1 ? '$' + v.toFixed(2) : '$' + Math.round(v).toLocaleString('en-US');
const fmtInt  = v => v == null || !isFinite(v) ? null
  : !(v % 1) ? Math.round(v).toLocaleString('en-US')
  : Math.abs(v) < 10 ? v.toFixed(2) : Math.abs(v) < 100 ? v.toFixed(1) : Math.round(v).toLocaleString('en-US');
const fmtPct  = v => v == null || !isFinite(v) ? null : (v * 100).toFixed(1) + '%';
const div     = (a, b) => b ? a / b : null;
const perPos  = (a, b) => b > 0 ? a / b : null;   // cost per net presale (net can be ≤ 0)

// Scorecard rows — all follow the Sources filter. vol: volume metric (per
// studio per day in "Per studio / day"); better: which direction wins the
// row's highlight; st: only for Open or NSO studios (NSO studios are in
// presale — their funnel ends at net presales); when(): only shown while true
// (e.g. spend and costs need Meta Ads or Google Ads selected).
const paid = () => PS.paid;
const SC_ROWS = [
  { sec: 'Studios' },
  { label: 'Studios with ad spend', hint: 'studios with no Meta / Google spend in the period are left out', f: a => a.cnt, fmt: v => v, raw: true,
    sub: a => [a.cntAll > a.cnt ? `of ${a.cntAll}` : '', a.partial ? `${a.partial} for part of the range` : ''].filter(Boolean).join(' · ') },
  { label: 'Studio-days', hint: 'days each studio was with the agency in the range, added up', f: a => a.n, fmt: v => Math.round(v).toLocaleString('en-US'), raw: true },

  { sec: 'Spend', hint: 'ad spend of the selected sources (Meta Ads / Google Ads) — no agency or Leadteam fees', when: paid },
  { kpi: 'Spend', label: 'Ad spend', f: a => a.spend, fmt: fmtUSD0, vol: 'n', when: paid },
  { label: 'Meta share of spend', f: a => div(a.metaSpend, a.metaSpend + a.googleSpend), fmt: fmtPct, when: () => PS.meta && PS.google },

  { sec: 'Funnel', hint: 'selected sources' },
  { kpi: 'Leads', label: 'Leads', f: a => a.leads, fmt: fmtInt, vol: 'n', better: 'high' },
  { kpi: 'First Timers', st: 'open', label: 'First Timers', f: a => a.ft, fmt: fmtInt, vol: 'n', better: 'high' },
  { kpi: 'Members', st: 'open', label: 'Members', f: a => a.mem, fmt: fmtInt, vol: 'n', better: 'high' },
  { kpi: 'Lead → FT', st: 'open', label: 'Lead → First Timer', f: a => div(a.ft, a.leads), fmt: fmtPct, better: 'high' },
  { kpi: 'FT → Member', st: 'open', label: 'First Timer → Member', f: a => div(a.mem, a.ft), fmt: fmtPct, better: 'high' },
  { kpi: 'Lead → Member', st: 'open', label: 'Lead → Member', f: a => div(a.mem, a.leads), fmt: fmtPct, better: 'high' },
  { st: 'nso',  label: 'Presales', f: a => a.pre, fmt: fmtInt, vol: 'n', better: 'high' },
  { st: 'nso',  label: 'Cancellations', f: a => a.canc, fmt: fmtInt, vol: 'n' },
  { kpi: 'Net presales', st: 'nso',  label: 'Net presales', hint: 'presales − cancellations', f: a => a.netPre, fmt: fmtInt, vol: 'n', better: 'high' },
  { kpi: 'Lead → net presale', st: 'nso',  label: 'Lead → net presale', f: a => div(a.netPre, a.leads), fmt: fmtPct, better: 'high' },
  { kpi: 'CPL', label: 'CPL', hint: 'cost per lead: ad spend ÷ leads', f: a => div(a.spend, a.leads), fmt: fmtUSD, better: 'low', when: paid },
  { kpi: 'CPFT', st: 'open', label: 'CPFT', hint: 'cost per first timer: ad spend ÷ first timers', f: a => div(a.spend, a.ft), fmt: fmtUSD, better: 'low', when: paid },
  { kpi: 'CPA', st: 'open', label: 'CPA', hint: 'cost per member: ad spend ÷ members', f: a => div(a.spend, a.mem), fmt: fmtUSD, better: 'low', when: paid },
  { kpi: 'Cost / net presale', st: 'nso',  label: 'Cost per net presale', hint: 'ad spend ÷ net presales', f: a => perPos(a.spend, a.netPre), fmt: fmtUSD, better: 'low', when: paid },

];

// Section of each row (for the accordion and the KPI groups)
(() => {
  let sec = null;
  for (const r of SC_ROWS) { if (r.sec) { sec = r.sec; continue; } r.secName = sec; }
})();
const rowShown = r => (!r.st || r.st === statusMode) && (!r.when || r.when());

function cellValue(row, agg) {
  const v = row.f(agg);
  if (v == null) return null;
  if (row.vol && viewMode === 'day') return agg[row.vol] ? v / agg[row.vol] : null;
  return v;
}

// ── Render ──────────────────────────────────────────────────────────────────
function applyFilters() {
  if (!RAW) return;
  let from = document.getElementById('fFrom').value || DEFAULT_FROM;
  let to   = document.getElementById('fTo').value   || DEFAULT_TO;
  if (from > to) [from, to] = [to, from];
  if (_menuKey !== `${statusMode}|${from}|${to}`) renderStudioSelect(from, to);

  const studioSel = new Set(getSelected('studioMenu') || []);
  const srcSel = getSelected('sourceMenu') || [];
  PS = { meta: srcSel.includes('Meta Ads'), google: srcSel.includes('Google Ads') };
  PS.paid = PS.meta || PS.google;
  const rows = perStudio(from, to, srcSel).filter(s => studioSel.has(s.name));
  const cols = buildColumns(rows, daysIn(from, to).length);

  _tableRows = rows.filter(s => s.status === statusMode);
  renderScorecard(cols, from, to);
  renderChart(cols);
  renderStudioTable();
}

// Open sections of the scorecard (all closed by default; click a header to open)
const _secOpen = new Set();
let _last = null;     // last rendered {cols, from, to}, to re-render on toggles
function toggleSec(name) {
  _secOpen.has(name) ? _secOpen.delete(name) : _secOpen.add(name);
  if (_last) renderScorecard(_last.cols, _last.from, _last.to);
}

function renderScorecard(cols, from, to) {
  _last = { cols, from, to };
  const lastFunnel = (RAW.daily_detail || []).reduce((m, r) => r.date > m ? r.date : m, '');
  const notes = [
    `${fmtDayLabel(from)} – ${fmtDayLabel(to)}, ${to.slice(0, 4)}.`,
    viewMode === 'day'
      ? 'Volumes are per studio per day: totals ÷ the studio-days each agency ran (studios with ad spend), so studios with the agency for only part of the range count by their days. Rates and costs are pooled across the agency\'s studios.'
      : 'Volumes are totals; rates and costs are pooled across the agency\'s studios.',
    'Every metric follows the Sources filter' + (PS.paid ? '' : ' — no ad platform selected, so spend and costs are hidden') + '.',
    'Each day counts for the agency that ran the studio that day (FFM / JL from their start dates, LT before) and for its Open / NSO status that day (NSO until the opening date).',
    'Green = best agency on that row.',
  ];
  if (lastFunnel && to > lastFunnel) notes.push(`Funnel data runs through ${fmtDayLabel(lastFunnel)}.`);
  const noAds = [...new Set(_tableRows.filter(s => !s.active).map(s => s.name))].sort();
  if (noAds.length) notes.push(`No ad spend in the period (left out): ${noAds.join(', ')}.`);
  document.getElementById('scNote').textContent = notes.filter(Boolean).join(' ');

  const head = `<thead><tr><th>Metric</th>${cols.map(c =>
    `<th class="${c.ref ? 'ref' : ''}" style="--agc:${c.color}">${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}</th>`).join('')}</tr></thead>`;

  const nCols = cols.length + 1;
  const body = SC_ROWS.filter(rowShown)
    .filter(row => row.sec || _secOpen.has(row.secName)).map(row => {
    if (row.sec) {
      const open = _secOpen.has(row.sec);
      return `<tr class="sec${open ? ' open' : ''}" onclick="toggleSec('${row.sec}')" title="${open ? 'Hide' : 'Show'} ${row.sec}"><td colspan="${nCols}"><span class="caret">&#9656;</span> ${row.sec}${row.hint ? ` <span style="text-transform:none;font-style:normal;font-family:'Open Sans',sans-serif;font-weight:400;color:#5a7a8a;letter-spacing:0">— ${row.hint}</span>` : ''}</td></tr>`;
    }
    const vals = cols.map(c => cellValue(row, c.agg));
    // Best value across the agency columns.
    const best = {};
    if (row.better) {
      const groups = {};
      vals.forEach((v, i) => {
        if (cols[i].ref || v == null || !isFinite(v) || (v === 0 && row.better === 'low')) return;
        (groups[''] ||= []).push(v);
      });
      for (const [g, ok] of Object.entries(groups))
        if (ok.length > 1 && Math.max(...ok) !== Math.min(...ok)) best[g] =row.better === 'high' ? Math.max(...ok) : Math.min(...ok);
    }
    const tds = vals.map((v, i) => {
      const s = v == null ? null : row.fmt(v);
      if (s == null) return `<td class="na${cols[i].ref ? ' ref' : ''}">—</td>`;
      const sub = row.sub ? row.sub(cols[i].agg) : '';
      const b = best[''];
      const inner = b != null && v === b && !cols[i].ref ?`<span class="best">${s}</span>` : s;
      return `<td class="${cols[i].ref ? 'ref' : ''}">${inner}${sub ? ` <span style="font-weight:400;color:#8aa3b0">${sub}</span>` : ''}</td>`;
    }).join('');
    const label = row.label + (row.vol && viewMode === 'day' ? ' <span style="color:#8aa3b0">/ studio / day</span>' : '');
    return `<tr><td class="lbl">${label}${row.hint ? `<span class="hint">${row.hint}</span>` : ''}</td>${tds}</tr>`;
  }).join('');
  document.getElementById('scTable').innerHTML = head + '<tbody>' + body + '</tbody>';
}

// Big chart: one bar per agency (+ All agencies) for the KPI picked with the
// buttons. Volumes follow the Per studio / day / Totals switch; rates and
// costs are pooled, like the scorecard.
let chartKpi = 'Leads';
function renderChart(cols) {
  const kpis = SC_ROWS.filter(r => r.kpi && rowShown(r));
  if (!kpis.some(r => r.kpi === chartKpi)) chartKpi = kpis[0].kpi;
  let sec = null;
  document.getElementById('kpiBtns').innerHTML = kpis.map(r => {
    const head = r.secName !== sec ? `<span class="kpi-group">${(sec = r.secName)}</span>` : '';
    return `${head}<button type="button" class="kpi-btn${r.kpi === chartKpi ? ' active' : ''}" aria-pressed="${r.kpi === chartKpi}" onclick="chartKpi='${r.kpi}';renderChart(_last.cols)">${r.kpi}</button>`;
  }).join('');

  const row = kpis.find(r => r.kpi === chartKpi);
  const shown = cols.filter(c => c.ref || c.agg.n > 0);
  const vals = shown.map(c => cellValue(row, c.agg));
  document.getElementById('chTitle').textContent =
    `${row.label}${row.vol ? (viewMode === 'day' ? ' — per studio per day' : ' — total') : ''}`;

  const id = 'chMain';
  if (_charts[id]) _charts[id].destroy();
  const valueLabels = {       // value on top of each bar
    id: 'valueLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = '600 12px "Open Sans", sans-serif'; ctx.fillStyle = '#1a1a2e'; ctx.textAlign = 'center';
      chart.getDatasetMeta(0).data.forEach((bar, i) => {
        const v = vals[i];
        if (v == null || !isFinite(v)) return;
        ctx.fillText(row.fmt(v), bar.x, bar.y - 6);
      });
      ctx.restore();
    },
  };
  _charts[id] = new Chart(document.getElementById(id), {
    type: 'bar',
    data: {
      labels: shown.map(c => {
        // Studios with the agency for only part of the range: say for how long
        const cnt = c.agg.cnt, avgD = cnt ? c.agg.n / cnt : 0;
        return [c.ref ? 'All agencies' : c.label,
                `${cnt} studios` + (avgD && avgD < c.agg.rangeDays - 0.5 ? ` · ~${Math.round(avgD)} days each` : '')];
      }),
      datasets: [{
        data: vals,
        backgroundColor: shown.map(c => c.ref ? '#c9d6de' : c.color),
        borderRadius: 4, maxBarThickness: 90,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 24 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ctx.raw == null ? '—' : row.fmt(ctx.raw) } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 12, weight: 600 }, color: '#1a1a2e' } },
        y: { beginAtZero: true, grid: { color: '#eef3f7' },
             ticks: { font: { size: 10 }, color: '#5a7a8a', callback: v => row.fmt(v) } },
      },
    },
    plugins: [valueLabels],
  });
}

// ── Per-studio table ────────────────────────────────────────────────────────
// Same rules as the scorecard: funnel by the selected sources; spend, costs and
// costs only with Meta Ads / Google Ads selected (when()).
const TBL_COLS = [
  { key: 'name',      label: 'Studio',          get: s => s.name, txt: true,
    html: s => s.name + (s.active ? '' : ' <span class="st-badge" title="No Meta / Google spend in the period — left out of the scorecard">no ads</span>') },
  { key: 'agency',    label: 'Agency',          get: s => s.agency, txt: true,
    html: s => `<span class="ag-badge" style="background:${AG_COLOR[s.agency]}">${s.agency}</span>` },
  { key: 'days',      label: 'Days',            get: s => s.days, fmt: v => String(v),
    title: s => `${s.first} → ${s.last}` },
  { key: 'status',    label: 'Status',          get: s => s.status, txt: true,
    html: s => `<span class="st-badge ${s.status}">${s.status === 'nso' ? 'NSO' : 'Open'}</span>` },
  { key: 'spend',     label: 'Ad spend',        get: s => s.spend, fmt: fmtUSD0, when: paid },
  { key: 'leads',     label: 'Leads',           get: s => s.leads, fmt: fmtInt },
  { key: 'ft',        label: 'First Timers',    get: s => s.ft, fmt: fmtInt, st: 'open' },
  { key: 'mem',       label: 'Members',         get: s => s.mem, fmt: fmtInt, st: 'open' },
  { key: 'lft',       label: 'Lead→FT',         get: s => div(s.ft, s.leads), fmt: fmtPct, st: 'open' },
  { key: 'ftm',       label: 'FT→Mem',          get: s => div(s.mem, s.ft), fmt: fmtPct, st: 'open' },
  { key: 'pre',       label: 'Presales',        get: s => s.pre, fmt: fmtInt, st: 'nso' },
  { key: 'canc',      label: 'Cancellations',   get: s => s.canc, fmt: fmtInt, st: 'nso' },
  { key: 'netPre',    label: 'Net presales',    get: s => s.netPre, fmt: fmtInt, st: 'nso' },
  { key: 'lnp',       label: 'Lead→Net presale', get: s => div(s.netPre, s.leads), fmt: fmtPct, st: 'nso' },
  { key: 'cpl',       label: 'CPL',             get: s => s.spend ? div(s.spend, s.leads) : null, fmt: fmtUSD, when: paid },
  { key: 'cpa',       label: 'CPA',   get: s => s.spend ? div(s.spend, s.mem) : null, fmt: fmtUSD0, st: 'open', when: paid },
  { key: 'cpp',       label: 'Cost / net presale', get: s => s.spend ? perPos(s.spend, s.netPre) : null, fmt: fmtUSD0, st: 'nso', when: paid },
];

const tblCols = () => TBL_COLS.filter(rowShown);

function renderStudioTable() {
  const TBL_COLS = tblCols();
  const rows = _tableRows.filter(s => tableAgency === 'ALL' || s.agency === tableAgency);
  const col = TBL_COLS.find(c => c.key === _sort.key) || TBL_COLS.find(c => c.key === 'leads');
  rows.sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    if (col.txt) return String(va).localeCompare(String(vb)) * _sort.dir;
    if (va == null && vb == null) return 0;
    if (va == null) return 1; if (vb == null) return -1;
    return (va - vb) * _sort.dir;
  });
  const head = `<thead><tr>${TBL_COLS.map(c =>
    `<th class="sortable${c.txt ? '' : ' num'}" data-k="${c.key}">${c.label}${c.key === _sort.key ? (_sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>`;
  const body = rows.length ? rows.map(s => `<tr>${TBL_COLS.map(c => {
    if (c.html) return `<td>${c.html(s)}</td>`;
    if (c.txt) return `<td>${c.get(s)}</td>`;
    const v = c.get(s), t = v == null ? null : c.fmt(v);
    return `<td class="num${t == null || v === 0 ? ' dim' : ''}"${c.title ? ` title="${c.title(s)}"` : ''}>${t == null ? '—' : t}</td>`;
  }).join('')}</tr>`).join('')
    : `<tr class="no-hover"><td colspan="${TBL_COLS.length}"><div class="empty-msg">No studios match these filters.</div></td></tr>`;
  const t = document.getElementById('studioTable');
  t.innerHTML = head + '<tbody>' + body + '</tbody>';
  t.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    const c = TBL_COLS.find(x => x.key === k);
    _sort = { key: k, dir: _sort.key === k ? -_sort.dir : (c.txt ? 1 : -1) };
    renderStudioTable();
  }));
}

function downloadStudioCSV() {
  const TBL_COLS = tblCols();
  const rows = _tableRows.filter(s => tableAgency === 'ALL' || s.agency === tableAgency);
  const esc = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const lines = [TBL_COLS.map(c => esc(c.label)).join(',')];
  for (const s of rows) lines.push(TBL_COLS.map(c => {
    const v = c.get(s);
    if (v == null) return '';
    return esc(c.txt ? v : (Math.round(v * 10000) / 10000));
  }).join(','));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `agency-comparison_${document.getElementById('fFrom').value}_${document.getElementById('fTo').value}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

loadData();
</script>
</body>
