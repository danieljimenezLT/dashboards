<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — Dashboards</title>
<link rel="icon" href="favicon.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#0084B5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}

.logo-wrap{margin-bottom:48px;text-align:center}
.logo-wrap img{height:48px}

.welcome{font-family:'Oswald',sans-serif;font-style:italic;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,.65);text-align:center;margin-bottom:8px}
.welcome-name{font-family:'Oswald',sans-serif;font-style:italic;font-size:36px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#fff;text-align:center;margin-bottom:56px}

.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}

.dash-card{flex:1;min-width:280px;max-width:360px;background:#fff;border-radius:20px;padding:48px 36px 44px;text-align:center;cursor:pointer;text-decoration:none;box-shadow:0 16px 48px rgba(0,0,0,.22);transition:transform .2s ease,box-shadow .2s ease;display:block}
.dash-card:hover{transform:translateY(-6px);box-shadow:0 28px 64px rgba(0,0,0,.3)}
.dash-card:active{transform:translateY(-2px)}

.dash-icon{width:72px;height:72px;border-radius:18px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
.dash-icon svg{width:34px;height:34px}
.dash-icon.blue{background:#e6f6fd}
.dash-icon.cyan{background:#e0fff6}

.dash-title{font-family:'Oswald',sans-serif;font-style:italic;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#1a1a2e;margin-bottom:10px}
.dash-desc{font-size:13px;color:#8aaabb;line-height:1.7}

.signout{margin-top:48px;background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.65);font-family:'Oswald',sans-serif;font-style:italic;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;padding:9px 24px;border-radius:8px;cursor:pointer;transition:all .15s}
.signout:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.5)}

@media(max-width:600px){
  .welcome-name{font-size:28px}
  .cards{flex-direction:column;align-items:center}
  .dash-card{max-width:100%}
  .logo-wrap img{height:38px}
}
</style>
</head>
<body>

<div class="logo-wrap">
  <img src="logo.png" alt="SWEAT440"/>
</div>

<div class="welcome">Welcome back,</div>
<div class="welcome-name" id="welcomeName">—</div>

<div class="cards">
  <a class="dash-card" href="index.html">
    <div class="dash-icon blue">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00A3E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    <div class="dash-title">Open Studio Dashboard</div>
    <div class="dash-desc">Leads, funnel, paid &amp; organic channels across all your studios</div>
  </a>

  <a class="dash-card" href="nso-dashboard/nso-studios.html">
    <div class="dash-icon cyan">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00C9A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="dash-title">NSO Dashboard</div>
    <div class="dash-desc">New studio opening tracker — scorecard, funnel &amp; marketing data</div>
  </a>
</div>

<button class="signout" onclick="logout()">Sign out</button>

<script src="users.js"></script>
<script src="shared/auth.js"></script>
<script>
const user = checkAuth();
if (user) document.getElementById('welcomeName').textContent = user.name;
</script>
</body>
</html>
