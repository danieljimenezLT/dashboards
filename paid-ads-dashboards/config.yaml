# ---------------------------------------------------------------------
# SWEAT440 Paid Ads Dashboard -- Campaign config
# ---------------------------------------------------------------------
# Como funciona:
#   - 'active_campaign' apunta a UN bloque dentro de 'campaigns:'.
#   - Puedes tener tantos bloques como campanas quieras trackear.
#   - Para cambiar de campana: edita 'active_campaign' y relanza
#     el ETL (python backend/meta_to_sheets.py). No se toca codigo.
# ---------------------------------------------------------------------

active_campaign: free_class_open_studios_2026

# 'campaigns_to_track' son TODAS las campanas que el ETL va a extraer en
# cada run, para que aparezcan en el dropdown del dashboard.
# Anade o quita nombres aqui segun necesites.
campaigns_to_track:
  - win_a_free_month_apr2026
  - free_class_open_studios_2026
  - buy_1_get_3_open_studios_2026
  - two_weeks_for_40_2026

# 'campaigns_to_refresh' son las campanas que el ETL re-fetchea desde Meta
# cada run. Las campanas en 'campaigns_to_track' que NO esten aqui se cargan
# del JSON existente (cache), ahorrando tiempo y quota de API.
# Para forzar el re-fetch de una campana completada, agregala aqui temporalmente.
campaigns_to_refresh:
  - free_class_open_studios_2026
  - two_weeks_for_40_2026


campaigns:

  # =================================================================
  # Win a Free Month - Abril 2026  (completada)
  # =================================================================
  win_a_free_month_apr2026:
    display_name: "Win a Free Month"
    period_label: "Apr 1-14, 2026"
    date_start:   "2026-04-01"
    date_end:     "2026-04-14"
    ad_account_id: "act_1553887681409034"   # SWEAT440 - Corporate Studios
    campaign_id:   "120243785513570249"     # 2026 - Open Studios - Win a Free Month

    audience_tokens:
      DINKS: ["DINKS"]
      POC:   ["POC"]
      PYC:   ["PYC"]
      SI:    ["SI"]
      SAHP:  ["SAHP"]

    # Pilares de producto (los buscamos como tokens en el nombre del ad)
    pillar_tokens:
      "Decision Relief":      ["DR"]
      "Value Confidence":     ["VC"]
      "Psychological Safety": ["PS"]
      "Performance & Results": ["P&R", "P+R", "PR"]
      "Social Safety":        ["SSB", "SS"]
      HYROX:                  ["HYROX"]
      DC:                     ["DC"]

    # Studio roster resolved from studios.json (canonical registry) by code —
    # see resolve_campaign_studios() in fetch_paid_ads.py. Legacy inline
    # `studios:` list format is still supported as a fallback.
    studio_codes:
      [FL-001, FL-002, FL-003, FL-004, FL-005, FL-006, FL-007, FL-008,
       FL-009, FL-010, FL-011, FL-012, FL-013, FL-014, FL-015, FL-016,
       NC-001, NJ-001, NJ-002, NJ-003, NY-002, NY-003, NY-004, TX-001, TX-002,
       FL-017, TX-003]


  # =================================================================
  # Free Class - Open Studios  (en curso, ejemplo para copiar)
  # =================================================================
  # Para activarla, cambia arriba 'active_campaign' a este nombre
  # y relanza el ETL. La hoja de Google se reescribe con los nuevos
  # datos, y el dashboard se ajusta automaticamente.
  free_class_open_studios_2026:
    display_name: "Free Class - Open Studios"
    period_label: "Apr 15, 2026 onwards"
    date_start:   "2026-04-15"
    date_end:     "2026-12-31"
    ad_account_id: "act_1553887681409034"   # misma cuenta corporate
    campaign_ids:                            # campanas bajo Free Class
      - "120243103413640249"                 # Free Class - Native Forms (Apr–Aug 2026)
      - "120249459170510249"                 # Free Class - Landing Pages - No Conversion (Apr–Aug 2026)
      - "120250407271150249"                 # Free Class - Landing Pages (Apr–Aug 2026)
      - "120253123210040249"                 # Free Class - New Landing Pages (Aug 14, 2026 onwards)
    # Tipo de lead por campaign_id (Results column de Meta):
    # Native Forms → native form events; Landing Pages → pixel lead event
