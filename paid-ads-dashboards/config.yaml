# ---------------------------------------------------------------------
# Para anadir una campana nueva en el futuro:
#   1. Copia uno de los bloques de arriba y renombralo (ej. black_friday_2026:).
#   2. Ajusta display_name, period_label, date_start, date_end.
#   3. Ajusta ad_account_id y campaign_id con los IDs de Meta.
#   4. (Opcional) Ajusta la lista de studios si aplica.
#   5. Arriba pon 'active_campaign: black_friday_2026' y corre el ETL.
# ---------------------------------------------------------------------
