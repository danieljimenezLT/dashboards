      "120243103413640249": [onsite_conversion.lead_grouped, leadgen_grouped, leadgen.other]
      "120249459170510249": [_pixel_custom]   # custom pixel conversion in conversions[]
      "120250407271150249": [_pixel_custom]   # custom pixel conversion in conversions[]
      "120253123210040249": [_pixel_custom]   # Free Class - New Landing Pages

    audience_tokens:
      DINKS: ["DINKS"]
      POC:   ["POC"]
      PYC:   ["PYC"]
      SI:    ["SI"]
      SAHP:  ["SAHP"]

    pillar_tokens:
      "Decision Relief":      ["DR"]
      "Value Confidence":     ["VC"]
      "Psychological Safety": ["PS"]
      "Performance & Results": ["P&R", "P+R", "PR"]
      "Social Safety":        ["SSB", "SS"]
      HYROX:                  ["HYROX"]
      DC:                     ["DC"]

    # Si tu proxima campana es solo para algunos studios, quita los codigos
    # que no apliquen de la lista y el dashboard mostrara solo los relevantes.
    studio_codes:
      [FL-001, FL-002, FL-003, FL-004, FL-005, FL-006, FL-007, FL-008,
